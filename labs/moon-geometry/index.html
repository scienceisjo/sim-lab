'use strict';
Explorer.start({"id":"moon-geometry","title":"달의 모양과 식은 왜 다르게 변할까?","unit":"태양계","subject":"earth","codes":["9과07-04"],"core":"달의 위상은 밝은 반구를 보는 방향으로, 식은 실제 가림과 그림자로 설명한다.","controls":[{"key":"angle","label":"삭에서 움직인 공전 각","min":0,"max":360,"step":15,"unit":"°","value":90},{"key":"inclination","label":"달 궤도 기울기","options":[[5,"약 5°"],[0,"기울기 없는 비교 모형"]],"value":5},{"key":"node","label":"궤도 교차선 방향","options":[[0,"태양 방향과 나란함"],[90,"태양 방향과 어긋남"]],"value":90}],"outputs":[{"key":"lit","label":"밝게 보이는 면적 비율","unit":"%","digits":1,"noise":0},{"key":"eclipse","label":"식의 기하 조건","numeric":false}],"measure":"lit","evaluate":s=>{const a=s.angle*Math.PI/180,lat=Math.asin(Math.sin((s.angle-s.node)*Math.PI/180)*Math.sin(s.inclination*Math.PI/180));const x=-60.3*Math.cos(lat)*Math.cos(a),y=60.3*Math.cos(lat)*Math.sin(a),z=60.3*Math.sin(lat),off=Math.hypot(y,z);const eclipse=x<0&&off<1?'지구 일부에서 일식이 가능한 배열입니다.':x>0&&off<.72+.273?'달이 지구 본그림자와 겹칠 수 있습니다.':'식이 생기지 않는 배열입니다.';return{lit:(1-Math.cos(lat)*Math.cos(a))*50,eclipse};},"rule":"거리 지구반지름단위 달60.3, 달반지름0.273, 달거리 지구 본그림자반지름약0.72. 달위도=asin(sin(공전각−교차선각)sin기울기). 조명 면적(1−cos위도 cos공전각)/2. 15° 표본에서 지구일부 일식가능중심통과 허용약1지구반지름, 월식은원반겹침. 정밀 예보나 접촉시각은 계산하지 않는다.","limit":"천체의 크기와 거리는 확대했고 옆모습의 높이를 강조했습니다. 점은 위치 표지입니다. 식 판정은 배열의 가능성이며 실제 날짜의 예보가 아닙니다.","prompt":"삭과 보름에서 교차선 방향을 바꾸어 보세요. 위상은 비슷해도 식이 생기나요?","challenge":{"title":"보름인데 월식이 없는 배열","text":"공전 각 180°, 기울기 약 5°, 교차선 어긋남을 놓고 기록하세요.","check":s=>s.angle===180&&s.inclination===5&&s.node===90},"conclusion":"평소 달의 위상은 지구 그림자 때문이 {아닙니다|맞습니다}. 궤도가 기울어져 식이 매달 생기지는 {않습니다|않을 수 없습니다}.","quiz":[{"kind":"적용","question":"반달의 어두운 부분은 무엇인가요?","options":["지구 그림자가 항상 가린 부분입니다.","우리가 보는 달 표면 중 햇빛을 받지 않는 부분입니다.","달이 부서진 부분입니다."],"answer":1,"feedback":["위상과 월식을 구별합니다.","태양빛과 보는 방향을 연결합니다.","달 모양 자체는 유지됩니다."]},{"kind":"적용","question":"일식의 배열은?","options":["태양–지구–달입니다.","지구–태양–달입니다.","태양–달–지구입니다."],"answer":2,"feedback":["월식의 기본 배열입니다.","달이 태양을 가리지 못합니다.","달이 태양빛 경로 앞에 옵니다."]}],"caption":(s,v)=>v.eclipse,"describe":(s,v)=>`밝은 면적 ${v.lit.toFixed(1)}%. ${v.eclipse}`,"creative":"우주에서 본 배치와 지구에서 본 달 원반을 나란히 연결합니다. 원반의 밝은 부분은 구 표면의 조명 내적으로 계산합니다.","draw":function draw(p,s,v,m){const a=s.angle*Math.PI/180,lat=Math.asin(Math.sin((s.angle-s.node)*Math.PI/180)*Math.sin(s.inclination*Math.PI/180));p.circle(310,230,110,'#f2f5fa','#bed0df');p.circle(310,230,21,'#4d87bc');const x=310-110*Math.cos(a),y=230-110*Math.sin(a);p.circle(x,y,14,'#b4ad99');p.circle(65,230,30,'#e4b04e');if(m){p.arrow(100,165,195,165,'#dcad40');p.text(150,119,'태양빛');p.text(310,80,'위에서 본 위치',22);p.text(295,376,'옆모습: 높이를 강조했습니다.',19);p.line(120,430,490,430,'#a1b4c7',2,[4,4]);p.circle(310,430,6,'#4d87bc');p.c.fillStyle='#d8dde4';p.c.beginPath();p.c.moveTo(316,424);p.c.lineTo(475,426);p.c.lineTo(475,434);p.c.lineTo(316,436);p.c.fill();p.circle(310-130*Math.cos(a),430-60.3*Math.sin(lat)*6,3,'#8f7860');}const cx=737,cy=278,R=114;p.circle(cx,cy,R,'#28374c');const lx=Math.sin(a)*Math.cos(lat),ly=Math.sin(lat),lz=-Math.cos(a)*Math.cos(lat);for(let iy=-R;iy<R;iy+=2)for(let ix=-R;ix<R;ix+=2){const rr=(ix*ix+iy*iy)/(R*R);if(rr>1)continue;const z=Math.sqrt(1-rr);if(ix/R*lx+iy/R*ly+z*lz>0){p.c.fillStyle='#eee7d4';p.c.fillRect(cx+ix,cy+iy,2,2);}}p.text(cx,105,'지구에서 본 달',25);p.text(cx,445,'밝은 부분 '+v.lit.toFixed(1)+'%',22);},"state":{"angle":90,"inclination":5,"node":90},"answers":[0,0],"assumptions":["천체의 크기와 거리는 확대했고 옆모습의 높이를 강조했습니다. 점은 위치 표지입니다. 식 판정은 배열의 가능성이며 실제 날짜의 예보가 아닙니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
