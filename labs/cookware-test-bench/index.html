<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>조리 도구 재료 비교 · CLICK SCIENCE</title><link rel="stylesheet" href="../_kit/kit.css"><link rel="icon" href="data:,"></head><body><script src="../_kit/kit.js"></script><script src="../_kit/thermal.js"></script><script>
'use strict';
const MAT={iron:{name:'철',c:.107,a:11e-6,color:'#7c8fa5'},al:{name:'알루미늄',c:.214,a:23e-6,color:'#aab9c9'},water:{name:'물',c:1,color:'#9dcfec'}};
const capacity=k=>MAT[k].c*4187*.05;
const plateT=k=>20+20/.15*(1-Math.exp(-.15*60/capacity(k)));
const baseT=(k,minutes)=>20+40*Math.exp(-.15*minutes*60/capacity(k));
const expansion=k=>MAT[k].a*.2*60*1000;
const fits=s=>s.plate==='iron'&&s.base==='water'&&s.handle==='poor';
const marked=s=>baseT(s.base,s.minutes)>=s.threshold;
let book;const rows=i=>book.rows.filter(r=>r._mission===i);
function configure(l,s){Object.assign(l.state,s);l.update();}
Lab.init({id:'cookware-test-bench',version:1,title:'조리 도구 재료 비교',subject:'phys',unit:'비열과 열팽창',grade:'중1',updated:'2026-09-27',board:{w:960,h:600},state:{plate:'al',base:'al',handle:'good',minutes:10,threshold:50},
 sceneNote:'세 부품을 따로 시험한 결과입니다. 조립한 도구의 한 시각이나 실제 음식이 익는 과정을 나타내지 않습니다. 같은 양과 정해진 시험 조건에서 비교합니다. 손잡이는 전도 성질 카드이며 실제 온도·화상 위험을 계산하지 않습니다.',
 assumptions:['불판과 받침은 각각 50 g이며, 내부 온도는 고르다고 가정합니다. 용기의 열용량은 생략합니다.','불판은 같은 20 W 장치로 20 ℃에서 60초 가열합니다. 받침은 60 ℃에서 같은 방에 두어 식힙니다.','길이 비교는 두 불판 모두 20→80 ℃가 된 별도 시험입니다. 붙인 부품을 바이메탈처럼 휘게 그리지 않습니다.','열변색 기준 온도는 설계용 가정값입니다. 교과서·실물 재료의 수치나 안전한 온도 기준이 아닙니다.','학습 측정 온도만 최대 0.2 ℃ 흔들립니다. 이 비교만으로 실제 조리 도구의 안전성과 성능을 보장하지 않습니다.'],
 teacher:`<h4>교과서</h4><p>비상교육 p.95, 97–99, 103–105, 109. 불판·받침·손잡이마다 필요한 성질을 고르는 설계 활동입니다. 불판은 두 표에 모두 있는 철·알루미늄만 비교합니다. 내열 유리 불판이나 알려지지 않은 나무 팽창 계수를 만들어 최고 재료를 고르지 않습니다.</p><h4>계산과 판정 범위</h4><p>상대 비열 철 0.107, 알루미늄 0.214, 물 1에 4187 J/(kg K)를 곱합니다. 각 50 g, 불판 P=20 W, 주변 20 ℃, 손실 0.15 W/K의 해석해로 60초 뒤 온도를 구합니다. 받침은 같은 60 ℃에서 냉각해 선택한 0–10분 뒤 값을 구합니다. 열팽창은 별도 시험으로 L₀=20 cm, ΔT=60 ℃, α철=11·α알루미늄=23×10⁻⁶/K를 씁니다. 각각 0.132/0.276 mm 늘어납니다. 실제 조립 부품의 이음매·열응력은 계산하지 않습니다.</p><p>설계 비교 기준은 작은 비열의 불판, 큰 비열의 받침, 열이 잘 전달되지 않는 손잡이, 같은 온도 변화에서 작은 팽창입니다. 제한된 두 불판 중 철이 이 기준에 맞습니다. 실제 냄비는 양·두께·열전도·강도·구조 등도 영향을 주므로 보편적인 최고 재료를 뜻하지 않습니다. 손잡이는 교과서 성질만 비교하고 임의 전도율이나 온도 점수를 붙이지 않습니다.</p><h4>열변색</h4><p>p.109 생활용품 안전성 보완 설계를 받침 온도에 반응하는 모형 표지로 연결합니다. 설정 기준 이상에서 주황, 미만에서 파랑으로 표시하고 글자를 병기합니다. 기본 50 ℃는 교과서 수치가 아닌 설계 가정입니다. 실제 물감의 전이 폭·반응 지연·화학 원리는 생략하며 안전/위험을 자동 판정하지 않습니다.</p>`,
 missions:[
 {kind:'둘러보기',title:'세 부품 바꿔 보기',text:'각 부품의 선택을 바꾸어 결과를 기록하세요. 세 부품에서 각각 두 종류 이상의 기록을 남기세요.',check:()=>['plate','base','handle'].every(k=>new Set(rows(0).map(r=>r[k])).size>=2)},
 {kind:'해 보기',title:'비교 목적에 맞는 조합',text:'작은 비열·작은 팽창의 불판, 큰 비열의 받침, 열이 잘 전달되지 않는 손잡이를 골라 기록하세요.',check:()=>rows(1).some(fits),ok:'이 비교 조건의 목적에 맞았습니다. 실제 제품은 두께·양·전도·강도와 구조도 함께 고려해야 합니다.'},
 {kind:'변인 고르기',title:'받침 재료만 바꾸기',text:'불판과 손잡이, 냉각 시간을 유지하고 받침 재료에 따른 온도를 비교하세요.',variables:{options:[['base','받침 재료'],['plate','불판 재료'],['handle','손잡이 성질'],['minutes','냉각 시간'],['measuredBase','받침 온도']],change:'base',keep:['plate','handle','minutes'],measure:'measuredBase',recordId:'cookware'}},
 {kind:'해 보기',title:'같은 처음 온도에서 식히기',text:'더 해 보기를 열고 물 받침의 0분·10분을 각각 기록하세요. 열이 남는 정도를 비교하세요.',enter:l=>configure(l,{base:'water',minutes:0}),check:()=>[0,10].every(m=>rows(3).some(r=>r.base==='water'&&r.minutes===m)),ok:'물도 식습니다. 같은 조건에서 비열이 큰 물의 온도는 더 천천히 변합니다.'},
 {kind:'해 보기',title:'온도에 반응하는 표지 설계',text:'물 받침, 기준 50 ℃에서 0분과 10분을 기록하세요. 모형을 켜고 색과 글자가 함께 바뀌는지 보세요.',enter:l=>configure(l,{base:'water',threshold:50,minutes:0}),check:()=>[0,10].every(m=>rows(4).some(r=>r.base==='water'&&r.minutes===m&&r.threshold===50&&r.visible)),ok:'온도를 눈에 보이는 표시로 바꿨습니다. 50 ℃가 안전 온도라는 뜻은 아닙니다. 기준 온도는 설계자가 정한 가정입니다.'},
 {kind:'찾아내기',title:'부품마다 다른 성질',text:'같은 조건의 비교 결과를 정리하세요.',sentence:'빨리 데우려는 불판은 비열이 {작은|큰} 쪽, 오래 따뜻하게 두려는 받침은 {큰|작은} 쪽이 유리합니다. 손잡이는 열이 {잘 전달되지 않는|잘 전달되는} 성질을 고릅니다. 붙은 부품은 열팽창 정도가 {비슷한지|아무 관계 없는지} 살펴야 합니다.',blanks:[0,0,0,0]}
 ],
 quiz:[{kind:'진단',question:'불판과 받침을 같은 재료로만 만들어야 하나요?',options:['부품마다 필요한 성질이 달라 따로 고를 수 있습니다.','비열이 가장 큰 것으로 모두 만들어야 합니다.','열이 잘 전달되는 것으로 모두 만들어야 합니다.'],answer:0,feedback:['부품의 목적에 맞춰 성질을 비교합니다.','빨리 데우는 부분과 오래 따뜻하게 두는 부분은 목적이 다릅니다.','손잡이까지 열이 잘 전달되면 잡기 불편해질 수 있습니다.']},{kind:'적용',question:'온도가 빨리 오르는 성질과 열이 잘 전달되는 성질은?',options:['언제나 같은 성질입니다.','비열과 전도로 구별해서 생각해야 합니다.','금속에서만 같은 뜻입니다.'],answer:1,feedback:['같은 양을 데우는 데 필요한 열과 열의 전달은 구별합니다.','불판 온도와 손잡이 전도는 별도 비교입니다.','금속에서도 두 성질은 같은 뜻이 아닙니다.']},{kind:'새 상황',question:'50 ℃에서 색이 바뀌는 모형 표지가 파랑이면?',options:['언제나 맨손으로 잡아도 안전합니다.','액체 양이 0이라는 뜻입니다.','정한 기준보다 낮다는 뜻이며 안전을 보장하지 않습니다.'],answer:2,feedback:['색만으로 실제 접촉 안전성을 판단할 수 없습니다.','이 표지는 온도 기준을 나타냅니다.','기준값과 실제 안전성은 구별해야 합니다.']}],
 setup(l){const u=l.ui;Thermal.note(l,'불판과 받침의 계산 온도를 표시합니다. 손잡이 재료와 열변색 표지의 색은 별도의 뜻입니다.');u.group('부품별로 고르기');u.choice({key:'plate',label:'불판',options:[['iron','철'],['al','알루미늄']]});u.choice({key:'base',label:'받침',options:[['iron','철'],['al','알루미늄'],['water','물']]});u.choice({key:'handle',label:'손잡이의 전도 성질',options:[['good','잘 전달됨'],['poor','잘 전달되지 않음']]});const group=u.group('냉각과 열변색 설계'),details=document.createElement('details'),summary=document.createElement('summary');summary.textContent='더 해 보기 · 냉각·열변색';group.before(details);details.append(summary,group);u.slider({key:'minutes',label:'받침 냉각 시간',min:0,max:10,step:1,unit:'분'});u.slider({key:'threshold',label:'표지의 기준 온도(모형 가정)',min:30,max:60,step:5,unit:'℃'});u.note('기준 온도는 학생 설계용 가정이며 교과서 수치·실제 안전 기준이 아닙니다.');u.group('같은 조건의 시험 결과');u.readout({label:'불판 60초 뒤',get:s=>plateT(s.plate).toFixed(1)+' ℃'});u.readout({label:'받침 '+''+'온도',get:s=>baseT(s.base,s.minutes).toFixed(1)+' ℃'});u.readout({label:'열변색 표지',get:s=>marked(s)?'기준 이상입니다.':'기준 미만입니다.'});u.note('선택지 사이의 비교입니다. 다른 양·두께·구조에서는 결과가 달라질 수 있습니다.');u.learnOnly(u.group('비교 기준 확인'));u.readout({label:'불판의 비열·팽창',get:s=>s.plate==='iron'?'두 후보 중 더 작습니다.':'철보다 큽니다.'});u.readout({label:'받침의 비열',get:s=>s.base==='water'?'세 후보 중 가장 큽니다.':'물보다 작습니다.'});u.readout({label:'손잡이 전도',get:s=>s.handle==='poor'?'비교 목적에 맞습니다.':'전달이 작은 쪽을 살펴보세요.'});
 u.learnOnly(u.group('측정·기록'));book=u.records({id:'cookware',version:1,columns:[{key:'plate',label:'불판',format:v=>MAT[v].name},{key:'base',label:'받침',format:v=>MAT[v].name},{key:'handle',label:'손잡이 전도',format:v=>v==='poor'?'잘 전달되지 않음':'잘 전달됨'},{key:'minutes',label:'냉각(분)',numeric:true,digits:0},{key:'threshold',label:'표지 기준(℃)',numeric:true,digits:0},{key:'measuredPlate',label:'불판 측정(℃)',numeric:true,digits:1},{key:'measuredBase',label:'받침 측정(℃)',numeric:true,digits:1},{key:'mark',label:'표지'}],conditions:['plate','base','handle','minutes','threshold'],measure:'measuredBase',x:'minutes',y:'measuredBase',validate:r=>['iron','al'].includes(r.plate)&&Object.hasOwn(MAT,r.base)&&['good','poor'].includes(r.handle)&&r.minutes>=0&&r.minutes<=10&&r.threshold>=30&&r.threshold<=60&&Math.abs(r.measuredPlate-plateT(r.plate))<=.250001&&Math.abs(r.measuredBase-baseT(r.base,r.minutes))<=.250001});u.note('온도 측정은 ±0.2 ℃ 흔들립니다. 표지는 정확한 모형 온도에 반응하며, 기록한 측정값과 기준 근처에서 달라 보일 수 있습니다.');u.button({label:'시험 결과 측정·기록',onClick:l=>{const s=l.state;book.add({...s,measuredPlate:+l.measure('plate',plateT(s.plate),{amplitude:.2,fresh:true}).toFixed(1),measuredBase:+l.measure('base',baseT(s.base,s.minutes),{amplitude:.2,fresh:true}).toFixed(1),mark:marked(s)?'기준 이상':'기준 미만',visible:l.modelVisible});}});u.graphData({columns:[{key:'minutes',label:'시간(분)',numeric:true},{key:'temperature',label:'받침 온도(℃)',numeric:true}],getRows:()=>Array.from({length:11},(_,i)=>({minutes:i,temperature:baseT(l.state.base,i)}))});
 },
 draw(c,l){const s=l.state,z=l.fs(14),d=l.draw,text=(x,y,t,col='#334155',align='center')=>d.text(c,x,y,t,{size:z,color:col,align});c.fillStyle='#fbfcff';c.fillRect(0,0,960,600);text(480,35,'세 부품을 따로 시험한 결과입니다.');text(180,85,'불판: 60초 가열');text(490,85,'받침: '+s.minutes+'분 냉각');text(810,85,'손잡이: 전도 성질');
 c.fillStyle=l.modelVisible?Thermal.color(plateT(s.plate)):MAT[s.plate].color;c.fillRect(70,158,220,30);c.strokeStyle='#475569';c.lineWidth=4;c.strokeRect(70,158,220,30);c.fillStyle='#f5b27f';c.fillRect(92,210,177,15);text(180,263,MAT[s.plate].name);text(180,307,plateT(s.plate).toFixed(1)+' ℃');
 c.fillStyle=l.modelVisible?Thermal.color(baseT(s.base,s.minutes)):MAT[s.base].color;c.fillRect(405,145,170,90);c.strokeStyle='#64748b';c.strokeRect(401,120,178,120);text(490,263,MAT[s.base].name);text(490,307,baseT(s.base,s.minutes).toFixed(1)+' ℃');c.fillStyle=s.handle==='good'?'#94a3b8':'#cab897';c.fillRect(715,175,185,26);text(810,253,s.handle==='good'?'열이 잘':'열이 잘 전달되지');text(810,292,s.handle==='good'?'전달됩니다.':'않습니다.');
 if(l.modelVisible){text(220,378,'같은 20→80 ℃의 길이 비교');text(220,421,'처음 20 cm에서 늘어납니다.');c.fillStyle=MAT[s.plate].color;c.fillRect(60,458,expansion(s.plate)/.276*310,17);text(220,516,s.plate==='iron'?'철은 더 적게 늘어납니다.':'알루미늄이 더 늘어납니다.');text(710,378,'받침의 열변색 표지');c.fillStyle=marked(s)?'#f39a50':'#83bee5';c.fillRect(625,411,170,67);text(710,453,marked(s)?'기준 이상':'기준 미만','#203245');text(710,519,'기준 '+s.threshold+' ℃ (설계 가정)');text(710,566,'안전 판정이 아닙니다.');}else text(480,444,'모형을 켜면 길이 비교와 열변색 표지가 보입니다.');
 }
