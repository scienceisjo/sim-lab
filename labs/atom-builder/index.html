<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>원소와 전하는 무엇이 정할까? · CLICK SCIENCE</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../_kit/kit.css"><style>.rd{gap:12px;align-items:start}.rd>span{flex:0 0 28%}.rd b{overflow-wrap:anywhere;max-width:68%}.lab-panel a.abtn{display:block;text-decoration:none;text-align:center}.record-axes[hidden]{display:none}</style></head><body><script src="../_kit/kit.js"></script><script src="../_kit/explorer.js"></script><script>
'use strict';
Explorer.start({"id":"atom-builder","title":"원소와 전하는 무엇이 정할까?","unit":"물질의 구성","subject":"chem","codes":["9과11-01","9과11-02","9과11-03","9과11-04"],"core":"양성자 수가 원소를 정하고, 전자를 얻거나 잃으면 이온이 된다.","controls":[{"key":"element","label":"원소","options":[["Na","나트륨"],["Cl","염소"],["He","헬륨"]],"value":"Na"},{"key":"change","label":"전자 이동","options":[[0,"그대로"],[-1,"전자 1개 잃기"],[1,"전자 1개 얻기"]],"value":0}],"outputs":[{"key":"protons","label":"양성자 수","unit":"개","digits":0,"noise":0},{"key":"electrons","label":"전자 수","unit":"개","digits":0,"noise":0},{"key":"charge","label":"전하의 상대값","unit":"","digits":0,"noise":0}],"measure":"charge","evaluate":s=>{const protons={Na:11,Cl:17,He:2}[s.element];return{protons,electrons:protons+s.change,charge:-s.change};},"rule":"전하 단위는 양성자 1개의 전하. q=양성자 수−전자 수. 선택한 전자 이동을 셈하는 모형이며 각 이온의 안정성·생성 가능성을 뜻하지 않는다. 전자는 궤도 선 위의 작은 행성이 아니다.","limit":"전자의 위치와 원자핵 크기는 실제 비율이 아닙니다. 전자 이동은 전하를 세는 가정이며 모든 선택이 안정한 이온을 뜻하지 않습니다.","prompt":"전자만 옮겼을 때 원소 이름이 바뀌는지 확인하세요.","challenge":{"title":"원소는 그대로인 양이온","text":"나트륨에서 전자 1개를 잃는 조건을 만들고 기록하세요.","check":s=>s.element==='Na'&&s.change===-1},"conclusion":"원소의 종류는 {양성자 수|전자 이동 방향}로 정합니다. 전자를 잃으면 {양이온|음이온}이 됩니다.","quiz":[{"kind":"적용","question":"나트륨 원자가 전자를 잃으면?","options":["다른 원소가 됩니다.","나트륨 양이온이 됩니다.","양성자가 사라집니다."],"answer":1,"feedback":["양성자 수는 그대로입니다.","음전하가 줄어 양전하를 띱니다.","이 모형에서는 전자만 이동합니다."]},{"kind":"적용","question":"헬륨 같은 18족 원소의 특징은?","options":["다른 원소와 언제나 격렬하게 반응합니다.","양성자가 없습니다.","대체로 화학적으로 안정합니다."],"answer":2,"feedback":["일반적인 18족의 성질과 다릅니다.","헬륨에도 양성자가 있습니다.","주기율표에서 비슷한 성질을 묶어 봅니다."]}],"caption":(s,v)=>s.element+'의 양성자 수는 '+v.protons+'개로 같습니다.',"describe":(s,v)=>`양성자 ${v.protons}개, 전자 ${v.electrons}개이며 전하 상대값은 ${v.charge}입니다.`,"draw":function draw(p,s,v,m){p.circle(380,265,150,'#e4edf8');p.circle(380,265,46,'#df6760');p.text(380,265,s.element,30,'white');if(m){for(let i=0;i<v.electrons;i++){const a=i*2*Math.PI/v.electrons;p.circle(380+125*Math.cos(a),265+125*Math.sin(a),10,'#3264ab');p.text(380+125*Math.cos(a),265+125*Math.sin(a),'−',16,'white');}p.text(730,200,'양성자 '+v.protons+'개');p.text(730,275,'전자 '+v.electrons+'개');p.text(730,350,'전하 '+(v.charge>0?'+':'')+v.charge);p.text(730,435,'핵에는 양성자와 중성자가 있습니다.',17);p.text(380,445,'점의 위치는 전자 궤도가 아닙니다.',19);}},"state":{"element":"Na","change":0},"answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["전자의 위치와 원자핵 크기는 실제 비율이 아닙니다. 전자 이동은 전하를 세는 가정이며 모든 선택이 안정한 이온을 뜻하지 않습니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
</script></body></html>
