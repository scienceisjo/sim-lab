'use strict';
const M=.05,V=.6,F=.01,R=.5,G=9.8,DT=1/120,OMEGA=V/R;
const CASES={still:'정지한 공',none:'바람 없음',back:'뒤에서 바람',front:'앞에서 바람',side:'옆에서 바람',circle:'줄에 매단 공',cut:'줄 끊기',throw:'비스듬히 던진 공'};
const TYPES=['변하지 않음','속력만 변함','방향만 변함','둘 다 변함'];
function duration(k){return k==='circle'?2*Math.PI/OMEGA:k==='cut'?3:k==='throw'?4.8/G:2;}
function at(k,t){
 let x=0,y=0,vx=V,vy=0,fx=0,fy=0;
 if(k==='still')vx=0;
 else if(k==='circle'||k==='cut'){
  const q=k==='cut'?Math.min(1,t):t,a=OMEGA*q;
  x=R-R*Math.cos(a);y=R*Math.sin(a);vx=V*Math.sin(a);vy=V*Math.cos(a);
  if(k==='cut'&&t>=1){x+=vx*(t-1);y+=vy*(t-1);}else{fx=M*V*V/R*Math.cos(a);fy=-M*V*V/R*Math.sin(a);}
 }else if(k==='throw'){x=1.2*t;y=Math.max(0,2.4*t-G*t*t/2);vx=1.2;vy=2.4-G*t;fy=-M*G;}
 else{fx=k==='back'?F:k==='front'?-F:0;fy=k==='side'?F:0;x=V*t+fx/M*t*t/2;y=fy/M*t*t/2;vx=V+fx/M*t;vy=fy/M*t;}
 return{x,y,vx,vy,fx,fy,speed:Math.hypot(vx,vy)};
}
const sim={t:0,acc:0,maxDv:0,maxAngle:0,path:[],ended:false,owner:null,mode:null,cutDv:0,cutAngle:0};
let book,msg,classificationStatus;const observed={},answers={};let classified=false;const explored=new Set();
const rows=i=>book.rows.filter(r=>r._mission===i);
function classification(s,k){const initial=at(k,0).speed;return (s.maxDv>Math.max(.05,initial*.03)?1:0)+(s.maxAngle>3?2:0);}
function rewind(l){Object.assign(sim,{t:0,acc:0,maxDv:0,maxAngle:0,path:[{t:0,...at(l.state.case,0)}],ended:false,owner:null,mode:null,cutDv:0,cutAngle:0});}
function choose(l,k){l.state.case=k; l.rewind();l.speed=k==='throw'?.25:1;const speedButton=[...document.querySelectorAll('.speed button')].find(b=>b.textContent===(k==='throw'?'아주 느리게':'보통'));if(speedButton)speedButton.click();}
function validRun(l){return sim.ended&&sim.owner===l.mi&&sim.mode==='learn'&&l.mode==='learn';}
function advance(dt,l){sim.acc+=dt;const k=l.state.case,initial=at(k,0);while(sim.acc>=DT&&!sim.ended){sim.acc-=DT;sim.t=Math.min(duration(k),sim.t+DT);const v=at(k,sim.t);sim.maxDv=Math.max(sim.maxDv,Math.abs(v.speed-initial.speed));if(initial.speed>.05&&v.speed>.05){const cosine=(v.vx*initial.vx+v.vy*initial.vy)/(v.speed*initial.speed);sim.maxAngle=Math.max(sim.maxAngle,Math.acos(Math.max(-1,Math.min(1,cosine)))*180/Math.PI);}
 if(k==='cut'&&sim.t>=1){const start=at(k,1);sim.cutDv=Math.max(sim.cutDv,Math.abs(v.speed-start.speed));sim.cutAngle=Math.max(sim.cutAngle,Math.acos(Math.max(-1,Math.min(1,(v.vx*start.vx+v.vy*start.vy)/(v.speed*start.speed))))*180/Math.PI);}
 const interval=k==='throw'?.05:.25;if(sim.t-sim.path.at(-1).t>=interval-1e-8||sim.t>=duration(k)-1e-8)sim.path.push({t:sim.t,...v});
 if(sim.t>=duration(k)-1e-8){sim.ended=true;l.setRunning(false);if(validRun(l)){if(l.mi===0)explored.add(k);if(l.mi===5){observed[k]={maxDv:sim.maxDv,maxAngle:sim.maxAngle,type:classification(sim,k)};classificationStatus.textContent=`이 미션에서 ${Object.keys(observed).length}/8개 사례를 재생했습니다. 모두 고른 뒤 채점하세요.`;}}l.update();}
 }}

 teacher:`<h4>교과서</h4><p>비상교육 중1 p.178–184. 바람 방향에 따른 스펀지 공의 운동, 사례 분류, 바닥이 떠받치는 힘을 다룹니다. 학생 화면에는 관성·F=ma·구심력 용어를 도입하지 않습니다.</p><h4>내부 계산</h4><p>m=0.05 kg, v₀=0.6 m/s, 바람 F=0.01 N. 등가속도 해석해를 1/120초마다 표본화합니다. 앞바람은 2초 뒤 0.2 m/s로 아직 전진합니다. 원운동 r=0.5 m, ω=1.2 rad/s이며 줄이 당기는 힘은 중심 방향입니다. 줄 끊기는 1초 뒤부터 접선 방향 등속 직선 운동입니다. 투사체는 초기 (1.2,2.4) m/s, g=9.8 m/s², 비행 시간 약 0.4898초입니다. 착지 이후 운동은 다루지 않습니다.</p><h4>판정</h4><p>재생 전체의 최대 |속력−처음 속력|과 최대 방향각을 누적합니다. 속력 기준 max(0.05 m/s, 처음 속력의 3%), 방향 3°입니다. 원운동 한 바퀴·포물선의 시작과 끝만 비교하지 않습니다. 줄 끊기 사례 전체는 방향이 변하지만, 끊어진 이후만 보면 방향도 속력도 유지됩니다.</p><h4>보조 표현</h4><p>자국은 일정한 물리 시간 간격입니다(판 0.25초, 투사체 0.05초). 방향 나침반은 크기를 뜻하지 않는 고정 길이 점선입니다. 힘과 분리하여 표시합니다. 위에서 본 판의 힘 축척은 0.01 N=20 논리 px, 옆모습 중력·바닥 힘과 투사체는 0.1 N=14 px입니다. 축척 막대를 각 장면에 표시합니다.</p>`,
