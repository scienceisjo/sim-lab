<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>크기가 달라도 같은 물질일까? · CLICK SCIENCE</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../_kit/kit.css"><style>.rd{gap:12px;align-items:start}.rd>span{flex:0 0 28%}.rd b{overflow-wrap:anywhere;max-width:68%}.lab-panel a.abtn{display:block;text-decoration:none;text-align:center}.record-axes[hidden]{display:none}</style></head><body><script src="../_kit/kit.js"></script><script src="../_kit/explorer.js"></script><script>
'use strict';
Explorer.start({"id":"density-lab","title":"크기가 달라도 같은 물질일까?","unit":"물질의 특성","subject":"chem","codes":["9과08-01","9과08-02"],"core":"같은 온도의 같은 물질은 양을 바꾸어도 질량과 부피의 비가 같다.","controls":[{"key":"volume","label":"물체의 부피","min":10,"max":100,"step":10,"unit":"cm³","value":40},{"key":"material","label":"물질","options":[["al","알루미늄"],["fe","철"],["wood","균일한 나무 모형"]],"value":"al"}],"outputs":[{"key":"mass","label":"질량","unit":"g","digits":1,"noise":0.1},{"key":"density","label":"밀도","unit":"g/cm³","digits":2,"noise":0}],"measure":"mass","repeat":true,"evaluate":s=>{const density={al:2.7,fe:7.87,wood:.6}[s.material];return{mass:density*s.volume,density};},"rule":"온도 일정. m=ρV. 모형 밀도: 알루미늄 2.70, 철 7.87, 균일 나무 0.60 g/cm³. 나무의 실제 밀도는 수종과 수분에 따라 다르다. 질량 측정에만 ±0.1 g.","limit":"구멍과 기포가 없는 균일한 시료입니다. 나무 값은 모든 나무의 고유값이 아닙니다.","prompt":"물질은 그대로 두고 부피만 바꾸세요. 질량도 같은 비율로 변하는지 보세요.","challenge":{"title":"양을 늘려도 유지되는 성질","text":"알루미늄 80 cm³를 준비하고 같은 조건에서 세 번 기록하세요. 질량과 밀도를 구별하세요.","check":s=>s.material==='al'&&s.volume===80},"conclusion":"같은 물질의 양이 늘면 질량은 {늘어납니다|같습니다}. 같은 온도에서 밀도는 {같습니다|늘어납니다}.","quiz":[{"kind":"적용","question":"같은 알루미늄 덩어리를 반으로 나누면?","options":["밀도도 반이 됩니다.","질량과 부피가 함께 줄고 밀도는 같습니다.","철로 바뀝니다."],"answer":1,"feedback":["밀도는 물질의 양 자체가 아닙니다.","같은 온도와 물질을 비교합니다.","나누기는 물질 종류를 바꾸지 않습니다."]},{"kind":"적용","question":"질량이 같으면 같은 물질인가요?","options":["항상 같습니다.","색만 보면 충분합니다.","부피 등 다른 특성도 비교해야 합니다."],"answer":2,"feedback":["다른 물질도 질량이 같을 수 있습니다.","색만으로는 물질을 확정할 수 없습니다.","질량과 부피의 관계를 확인합니다."]}],"caption":(s,v)=>'질량이 달라져도 밀도는 '+v.density.toFixed(2)+' g/cm³입니다.',"describe":(s,v)=>`${s.volume} cm³의 질량은 ${v.mass.toFixed(1)} g입니다.`,"draw":function draw(p,s,v,m){const a=120*Math.cbrt(s.volume/40);p.box(100,390-a,a,a,{al:'#a7bdcf',fe:'#727f91',wood:'#bd8c55'}[s.material]);p.line(80,400,350,400);p.text(210,438,s.volume+' cm³');p.box(530,140,280,250,'#fff','#adc0cf');p.text(670,185,'가상 저울');p.text(670,270,v.mass.toFixed(1)+' g',40);if(m){p.text(670,350,'1 cm³당 '+v.density.toFixed(2)+' g');p.line(420,130,420,420,'#b9c9d8',2,[5,5]);}},"state":{"volume":40,"material":"al"},"answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["구멍과 기포가 없는 균일한 시료입니다. 나무 값은 모든 나무의 고유값이 아닙니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
</script></body></html>
