<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>흑점이 많으면 지구에는 꼭 문제가 생길까? · CLICK SCIENCE</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../_kit/kit.css"><style>.rd{gap:12px;align-items:start}.rd>span{flex:0 0 28%}.rd b{overflow-wrap:anywhere;max-width:68%}.lab-panel a.abtn{display:block;text-decoration:none;text-align:center}.record-axes[hidden]{display:none}</style></head><body><script src="../_kit/kit.js"></script><script src="../_kit/explorer.js"></script><script>
'use strict';
Explorer.start({"id":"solar-activity","title":"흑점이 많으면 지구에는 꼭 문제가 생길까?","unit":"태양계","subject":"earth","codes":["9과07-02"],"core":"흑점은 태양 활동의 지표이며 지구 영향은 분출 방향과 여러 조건에 따라 달라진다.","observation":true,"controls":[{"key":"activity","label":"비교할 태양","options":[["quiet","활동이 비교적 약한 때"],["active","활동이 비교적 강한 때"]],"value":"quiet"},{"key":"direction","label":"분출 방향","options":[["away","지구와 다른 방향"],["earth","지구 쪽 방향"]],"value":"away"}],"outputs":[{"key":"spots","label":"흑점 관찰","numeric":false},{"key":"impact","label":"지구 영향의 해석","numeric":false}],"evaluate":s=>({spots:s.activity==='active'?'흑점이 대체로 더 많이 나타납니다.':'흑점이 대체로 적게 나타납니다.',impact:s.direction==='away'?'분출이 지구를 직접 지나지 않을 수 있습니다.':'오로라·위성·통신에 영향을 줄 가능성이 있습니다.'}),"rule":"대표적 두 상태의 개념 비교. 실제 연도·흑점 관측 수·재해 확률은 생성하지 않는다. 태양 활동은 약11년 주기 경향이 있지만 주기와 강도는 일정하지 않다. 흑점은 주변보다 차가워 어둡게 보이는 영역.","limit":"특정 날짜의 태양 관측이나 우주 날씨 예보가 아닙니다. 지구 방향이라고 장애가 반드시 일어나는 것은 아닙니다.","prompt":"흑점과 분출 방향을 따로 바꾸어 가능성과 확정을 구별하세요.","challenge":{"title":"활동이 강해도 방향은 다를 수 있음","text":"활동이 강한 태양에서 지구와 다른 방향의 분출을 기록하세요.","check":s=>s.activity==='active'&&s.direction==='away'},"conclusion":"흑점은 주변보다 온도가 {낮아|높아} 어둡게 보입니다. 강한 태양 활동의 지구 영향은 조건에 따라 {달라집니다|항상 같습니다}.","quiz":[{"kind":"적용","question":"흑점은 빛을 전혀 내지 않는 구멍인가요?","options":["주변보다 어두워 보이는 태양 표면의 영역입니다.","완전히 빈 구멍입니다.","지구 그림자입니다."],"answer":0,"feedback":["상대적인 밝기를 비교합니다.","구멍이 아닙니다.","월식과 혼동하면 안 됩니다."]},{"kind":"적용","question":"태양 활동 주기를 어떻게 이해하나요?","options":["매번 정확히 11년입니다.","약 11년 경향이며 길이와 강도는 달라집니다.","하루마다 모두 반복됩니다."],"answer":1,"feedback":["자연의 변동성이 있습니다.","정확한 달력처럼 예측하지 않습니다.","자전과 활동 주기는 다릅니다."]}],"caption":(s,v)=>'영향의 가능성과 발생 확정은 다릅니다.',"describe":(s,v)=>v.spots+' '+v.impact,"draw":function draw(p,s,v,m){p.circle(255,275,140,'#f2bb5c');const n=s.activity==='active'?12:2;for(let i=0;i<n;i++){const a=i*2.399,r=25+20*Math.sqrt(i);p.ellipse(255+r*Math.cos(a),275+r*.55*Math.sin(a),7,5,'#977345');}p.circle(780,275,38,'#4b89be');p.text(780,350,'지구');if(m){p.arrow(405,250,s.direction==='earth'?730:660,s.direction==='earth'?270:95,'#d77945',9);p.text(480,449,'흑점의 수는 실제 관측값이 아닌 예시입니다.',21);p.text(230,85,'광구와 흑점');}},"state":{"activity":"quiet","direction":"away"},"measure":"spots","answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["특정 날짜의 태양 관측이나 우주 날씨 예보가 아닙니다. 지구 방향이라고 장애가 반드시 일어나는 것은 아닙니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
</script></body></html>
