Explorer.start({"id":"periodic-families","title":"원소를 순서대로 놓으면 어떤 무리가 보일까?","unit":"물질의 구성","subject":"chem","codes":["9과11-03"],"core":"주기율표는 양성자 수 순서로 배치되며 같은 족의 원소는 유사한 성질을 보일 수 있다.","observation":true,"controls":[{"key":"element","label":"원소","options":[["Li","리튬"],["Na","나트륨"],["K","칼륨"],["He","헬륨"],["Ne","네온"],["Ar","아르곤"]],"value":"Li"},{"key":"criterion","label":"비교 기준","options":[["protons","양성자 수"],["property","대표 성질"]],"value":"protons"}],"outputs":[{"key":"group","label":"족","numeric":false},{"key":"property","label":"비교 근거","numeric":false}],"evaluate":s=>({group:['Li','Na','K'].includes(s.element)?'1족':'18족',property:s.criterion==='protons'?'양성자 '+({Li:3,Na:11,K:19,He:2,Ne:10,Ar:18}[s.element])+'개입니다.':['Li','Na','K'].includes(s.element)?'물과 반응하는 공통 성질이 있습니다.':'다른 물질과 잘 반응하지 않는 공통 성질이 있습니다.'}),"rule":"주기율표의 일부인 Li/Na/K,He/Ne/Ar. 첫주기He행과Li행위치일치아님 아래격자원래주기1,2,3,4 배치. 구체반응원리·전자껍질주기성 생략. 수소는1족위치지만알칼리금속공통성으로일반화하지않음.","limit":"주기율표에서 두 족의 일부만 뽑았습니다. 이 성질을 모든 1족 원소에 예외 없이 적용하지 않으며, 구체적인 반응 원리는 다루지 않습니다.","prompt":"양성자 수와 성질을 따로 비교하세요. 양성자 수가 달라도 비슷한 성질을 가질까요?","challenge":{"title":"다른 원소, 비슷한 성질","text":"나트륨의 대표 성질을 관찰하고 기록하세요.","check":s=>s.element==='Na'&&s.criterion==='property'},"conclusion":"원소는 주로 {양성자 수|전자 이동 순서}에 따라 배열합니다. 같은 족 원소는 {유사한 성질|반드시 같은 원소}을 보일 수 있습니다.","quiz":[{"kind":"적용","question":"나트륨과 칼륨의 양성자 수가 다르면?","options":["다른 원소지만 비슷한 성질이 있을 수 있습니다.","같은 원소입니다.","둘 다 양성자가 없습니다."],"answer":0,"feedback":["원소의 정체성과 성질 유사성은 다릅니다.","양성자 수가 다릅니다.","원자핵에 양성자가 있습니다."]},{"kind":"적용","question":"네온과 아르곤의 공통 성질은?","options":["물과 격렬하게 반응합니다.","대체로 화학적으로 안정합니다.","양성자 수가 같습니다."],"answer":1,"feedback":["18족의 대표 성질과 다릅니다.","안정성이 유사합니다.","서로 다른 원소입니다."]}],"caption":(s,v)=>s.element+'은 '+v.group+'입니다.',"describe":(s,v)=>v.group+'이며 '+v.property,"draw":function draw(p,s,v,m){p.text(300,90,'1족 일부',28);p.text(655,90,'18족 일부',28);[['Li',2,300],['Na',3,300],['K',4,300],['He',1,655],['Ne',2,655],['Ar',3,655]].forEach(([el,row,x])=>{const y=95+row*80;p.box(x-70,y-30,140,60,el===s.element?'#e9c999':'#e5edf5',el===s.element?'#b98645':undefined);p.text(x,y,el,27);if(m)p.text(x-115,y,row+'주기',18);});},"state":{"element":"Li","criterion":"protons"},"measure":"group","answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["주기율표에서 두 족의 일부만 뽑았습니다. 이 성질을 모든 1족 원소에 예외 없이 적용하지 않으며, 구체적인 반응 원리는 다루지 않습니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
