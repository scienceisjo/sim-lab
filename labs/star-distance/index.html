<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>밝게 보이는 별이 정말 더 밝을까? · CLICK SCIENCE</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../_kit/kit.css"><style>.rd{gap:12px;align-items:start}.rd>span{flex:0 0 28%}.rd b{overflow-wrap:anywhere;max-width:68%}.lab-panel a.abtn{display:block;text-decoration:none;text-align:center}.record-axes[hidden]{display:none}</style></head><body><script src="../_kit/kit.js"></script><script src="../_kit/explorer.js"></script><script>
'use strict';
Explorer.start({"id":"star-distance","title":"밝게 보이는 별이 정말 더 밝을까?","unit":"별과 우주","subject":"earth","codes":["9과15-01"],"core":"별의 겉보기 밝기는 실제 광도와 거리에 함께 의존하며 가까운 별의 시차가 더 크다.","controls":[{"key":"distance","label":"별까지 상대 거리","min":1,"max":5,"step":1,"unit":"배","value":2},{"key":"luminosity","label":"별의 실제 밝기","min":1,"max":4,"step":1,"unit":"상대값","value":1},{"key":"color","label":"별의 색","options":[["red","붉은 별"],["white","흰 별"],["blue","푸른 별"]],"value":"red"}],"outputs":[{"key":"brightness","label":"겉보기 밝기","unit":"상대값","digits":3,"noise":0},{"key":"parallax","label":"연주시차 비교","numeric":false},{"key":"temperature","label":"표면 온도 비교","numeric":false}],"measure":"brightness","evaluate":s=>({brightness:s.luminosity/(s.distance*s.distance),parallax:s.distance===1?'비교 범위에서 가장 큽니다.':s.distance===5?'비교 범위에서 가장 작습니다.':'거리가 멀수록 작아집니다.',temperature:s.color==='red'?'붉은 별은 상대적으로 낮습니다.':s.color==='blue'?'푸른 별은 상대적으로 높습니다.':'붉은 별보다 높고 푸른 별보다 낮습니다.'}),"rule":"겉보기 밝기 B=L/d² 정규화 내부계산. 시차그림 관측기선±80, 별거리 화면100d로 atan(80/(100d)); 학습화면에 시차거리식·등급공식 없음. 색과 온도 정성순서, 밝은 별의 겉보기등급 숫자는 작다. 실제밝기는 절대등급으로 같은거리비교.","limit":"별과 지구 사이 거리는 줄이고 시차는 확대했습니다. 별의 원은 위치 표지이며 실제 지름이 아닙니다. 색과 광도는 별개의 조작값입니다.","prompt":"실제 밝기를 고정하고 거리만 바꾸세요. 다음에는 같은 거리에서 실제 밝기를 비교하세요.","challenge":{"title":"멀지만 실제로 밝은 별","text":"거리 2배, 실제 밝기 4에서 관찰값을 기록하세요.","check":s=>s.distance===2&&s.luminosity===4},"conclusion":"같은 별을 멀리서 보면 어둡게 {보입니다|변합니다}. 가까운 별의 연주시차는 상대적으로 {큽니다|작습니다}.","quiz":[{"kind":"적용","question":"겉보기 등급 숫자가 작은 별은?","options":["더 밝게 보입니다.","언제나 더 멀리 있습니다.","항상 더 차갑습니다."],"answer":0,"feedback":["등급 숫자와 밝기의 방향을 구별합니다.","실제 밝기도 영향을 줍니다.","색과 온도를 봐야 합니다."]},{"kind":"적용","question":"푸른 별과 붉은 별 중 표면 온도가 높은 쪽은?","options":["항상 붉은 별입니다.","대체로 푸른 별입니다.","색으로 비교할 수 없습니다."],"answer":1,"feedback":["일상 물감의 따뜻한 색과 다릅니다.","별의 색을 비교합니다.","별의 색은 온도와 관련됩니다."]}],"caption":(s,v)=>'거리와 실제 밝기를 함께 비교하세요.',"describe":(s,v)=>`겉보기 밝기 ${v.brightness.toFixed(3)}. ${v.parallax} ${v.temperature}`,"draw":function draw(p,s,v,m){const colors={red:'#de8d77',white:'#f2f0db',blue:'#9cbde9'};p.box(45,85,870,365,'#152b41');p.circle(270,260,20,'#4d8fc8');const sx=270+s.distance*100,alpha=Math.min(1,v.brightness/4);p.c.globalAlpha=alpha;p.circle(sx,260,35,colors[s.color]);p.c.globalAlpha=1;p.text(600,397,'겉보기 밝기 '+v.brightness.toFixed(3),22,'#e2eafa');if(m){p.circle(270,180,9,'#89b9d4');p.circle(270,340,9,'#89b9d4');p.line(270,180,sx,260,'#c4d9e5',2);p.line(270,340,sx,260,'#c4d9e5',2);p.text(220,120,'반년 간격의 관측',20,'#e2eafa');p.text(600,120,'색은 온도 비교에 씁니다.',20,'#e2eafa');}},"state":{"distance":2,"luminosity":1,"color":"red"},"answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["별과 지구 사이 거리는 줄이고 시차는 확대했습니다. 별의 원은 위치 표지이며 실제 지름이 아닙니다. 색과 광도는 별개의 조작값입니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
</script></body></html>
