'use strict';
Explorer.start({"id":"plate-patterns","title":"지진과 화산은 아무 곳에나 모일까?","unit":"지권의 변화","subject":"earth","codes":["9과09-05"],"core":"지진대와 화산대는 대체로 판 경계 부근에 분포하지만 판 내부에도 발생할 수 있다.","observation":true,"controls":[{"key":"layer","label":"살펴볼 분포","options":[["earthquake","지진대"],["volcano","화산대"],["both","두 분포 함께"]],"value":"earthquake"},{"key":"boundary","label":"판 경계 겹치기","options":[["off","경계 숨기기"],["on","경계 보이기"]],"value":"off"}],"outputs":[{"key":"pattern","label":"분포 해석","numeric":false},{"key":"exception","label":"주의할 점","numeric":false}],"evaluate":s=>({pattern:s.boundary==='on'?'많은 분포 띠가 판 경계와 겹칩니다.':'분포 띠와 경계를 겹쳐 비교해 보세요.',exception:s.layer==='volcano'?'판 내부 화산도 있으며 모든 경계에 화산이 있는 것은 아닙니다.':'판 내부에서도 지진이 발생할 수 있습니다.'}),"rule":"USGS 분포 설명을 바탕으로 대평양 주변·대서양 중앙의 대표 띠를 개략적으로 다시 그린 개념도. 점은 개별 사건 위치나 실시간 데이터가 아니다. 판경계종류별 지질학 심화 제외.","limit":"실제 지진 사건을 찍은 지도가 아닌 분포 띠의 개념도입니다. 점의 수를 발생 횟수로 세거나 이 그림으로 지진을 예측하지 않습니다.","prompt":"경계를 먼저 숨겨 띠를 찾고, 경계와 겹쳐 비교하세요.","challenge":{"title":"겹치지만 완전히 같지는 않음","text":"화산대와 판 경계를 함께 표시하고 기록하세요.","check":s=>s.layer==='volcano'&&s.boundary==='on'},"conclusion":"많은 지진과 화산은 판 경계 {부근|에서만 예외 없이}에 모입니다. 판 내부의 발생 가능성도 {있습니다|없습니다}.","quiz":[{"kind":"적용","question":"판 경계 밖은 지진이 절대로 없나요?","options":["드물더라도 판 내부에서도 발생합니다.","항상 안전합니다.","지진은 오직 바다에서만 납니다."],"answer":0,"feedback":["대체적인 경향과 예외를 구별합니다.","절대적인 안전 경계가 아닙니다.","육지에도 발생합니다."]},{"kind":"적용","question":"대륙이동설을 지지하는 근거는?","options":["해안선 하나만 보고 모든 것을 확정합니다.","여러 대륙의 지질·화석 등 맞물리는 근거를 함께 봅니다.","대륙이 매일 눈에 띄게 이동합니다."],"answer":1,"feedback":["여러 증거를 함께 봅니다.","독립적인 근거를 비교합니다.","매우 느린 변화입니다."]}],"caption":(s,v)=>v.pattern,"describe":(s,v)=>v.pattern+' '+v.exception,"draw":function draw(p,s,v,m){p.box(65,95,830,360,'#dfedf6');const pac=[[220,120],[145,180],[190,260],[240,335],[330,410],[500,420],[700,355],[765,260],[725,160],[620,120]],atl=[[455,110],[440,200],[470,270],[445,350],[460,425]];if(s.boundary==='on'){p.path(pac,'#746691',5);p.path(atl,'#746691',5);}if(m){for(const arr of [pac,atl])for(let i=0;i<arr.length-1;i++)for(let j=0;j<4;j++){const t=j/4,x=arr[i][0]*(1-t)+arr[i+1][0]*t,y=arr[i][1]*(1-t)+arr[i+1][1]*t;const X=x+8*Math.sin(i+j),Y=y+7*Math.cos(i-j);if(s.layer!=='volcano')p.circle(X,Y,4,'#ba4c4b');if(s.layer!=='earthquake'&&i%3!==2){p.c.fillStyle='#dd9b29';p.c.beginPath();p.c.moveTo(X+7,Y-7);p.c.lineTo(X+14,Y+6);p.c.lineTo(X,Y+6);p.c.fill();}}p.circle(545,270,7,s.layer==='earthquake'?'#ba4c4b':'#d29433');p.text(550,315,'판 내부 사례',18);p.text(460,475,'기호 수는 발생 횟수가 아닙니다.',19);}p.text(340,75,'분포 띠를 펼친 개념도',24);},"state":{"layer":"earthquake","boundary":"off"},"measure":"pattern","answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["실제 지진 사건을 찍은 지도가 아닌 분포 띠의 개념도입니다. 점의 수를 발생 횟수로 세거나 이 그림으로 지진을 예측하지 않습니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
