<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>확산과 증발 입자 관찰실 · CLICK SCIENCE</title><link rel="stylesheet" href="../_kit/kit.css"><link rel="icon" href="data:,"></head><body><script src="../_kit/kit.js"></script><script>
'use strict';
const DT=1/120,RATE=4,LIMIT=120,A=.035,B=.002,C=.08,PACKET=.015/8;
function random(seed){let x=seed>>>0;return()=>{x=(1664525*x+1013904223)>>>0;return(x+.5)/4294967296;};}
function gaussian(r){return Math.sqrt(-2*Math.log(r()))*Math.cos(2*Math.PI*r());}
function transfer(n,seed=301){const rng=random(seed);return {rng,t:0,packets:Array.from({length:n},(_,i)=>({id:i,phase:0,next:-Math.log(rng())/A,changed:0,old:0}))};}
function advanceTransfer(e,t){while(true){let p=null;for(const candidate of e.packets)if(candidate.next<=t&&(!p||candidate.next<p.next))p=candidate;if(!p)break;const at=p.next;p.old=p.phase;p.phase=p.phase===0?1:e.rng()<B/(B+C)?0:2;p.changed=at;p.next=p.phase===2?Infinity:at-Math.log(e.rng())/(p.phase===0?A:B+C);}e.t=t;}
const counts=e=>[0,1,2].map(k=>e.packets.filter(p=>p.phase===k).length);
function expected(n,t){const sum=A+B+C,disc=Math.sqrt(sum*sum-4*A*C),r1=(-sum+disc)/2,r2=(-sum-disc)/2,w=(-A-r2)/(r1-r2),l=n*(w*Math.exp(r1*t)+(1-w)*Math.exp(r2*t)),g=n*A/disc*(Math.exp(r1*t)-Math.exp(r2*t));return [l,g,n-l-g];}
const sim={t:0,acc:0,loaded:false,ps:[],escaped:0,initial:0,owner:null,mode:null,trace:[],path:[],sensed:Array(6).fill(null),transfer:transfer(0)};const books={},controls={};let msg;
const rows=i=>Object.values(books).flatMap(b=>b.rows).filter(r=>r._mission===i),mass=()=>counts(sim.transfer)[0]*PACKET;
function rewind(l){for(const [key,el]of Object.entries(controls))el.style.display=(key===l.state.scene||key==='trace'&&l.state.scene!=='evap')?'':'none';Object.assign(sim,{t:0,acc:0,loaded:false,ps:[],escaped:0,initial:0,owner:null,mode:null,trace:[],path:[],sensed:Array(6).fill(null),transfer:transfer(0)});l.state.tare=false;}
function configure(l,s){Object.assign(l.state,s);l.rewind();}
function load(l){const s=l.state,rng=random(501),ps=[],ink=s.scene==='ink',r=ink?6:4,n=ink?s.drops*15:s.sprays*25,total=(ink?440:200)+n;sim.initial=n;
 if(s.scene==='evap'){sim.transfer=transfer(s.evaporate*8);sim.initial=s.evaporate*8;}else{
 if(ink){const points=[];for(let j=-15;j<=15;j++)for(let i=-15;i<=15;i++){const x=i*13+(j%2)*6.5,y=j*11.26;if(Math.hypot(x,y)<167)points.push({x,y});}const origin=s.source==='center'?0:-90;points.sort((a,b)=>Math.hypot(a.x-origin,a.y)-Math.hypot(b.x-origin,b.y));const chosen=points.splice(0,n);for(let i=points.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[points[i],points[j]]=[points[j],points[i]];}for(const [i,p]of [...chosen,...points.slice(0,440)].entries())ps.push({...p,kind:i<n?'solute':'medium'});
 }else{for(let i=0;i<n;i++)ps.push({x:20+i%10*9,y:110+Math.floor(i/10)*9,kind:'solute'});while(ps.length<total){const p={x:8+rng()*704,y:8+rng()*284,kind:'medium'};if(ps.every(q=>Math.hypot(q.x-p.x,q.y-p.y)>8.2))ps.push(p);}}
 for(const p of ps){p.vx=gaussian(rng)*38;p.vy=gaussian(rng)*38;p.r=r;p.x0=p.x;p.y0=p.y;}const mx=ps.reduce((n,p)=>n+p.vx,0)/ps.length,my=ps.reduce((n,p)=>n+p.vy,0)/ps.length;for(const p of ps){p.vx-=mx;p.vy-=my;}sim.ps=ps;sim.tracerId=n;sim.ps.forEach((p,i)=>p.id=i);
 }sim.loaded=true;sim.owner=l.mi;sim.mode=l.mode;sim.path=[{time:0,mass:mass(),remaining:sim.initial}];l.update();}
function moveDisks(dt,s){const ink=s.scene==='ink',ps=sim.ps,size=ink?12:8,grid=new Map();for(const p of ps){p.x+=p.vx*dt;p.y+=p.vy*dt;bound(p,s);const key=Math.floor(p.x/size)+','+Math.floor(p.y/size);if(!grid.has(key))grid.set(key,[]);grid.get(key).push(p);}for(let i=0;i<ps.length;i++){const p=ps[i],ix=Math.floor(p.x/size),iy=Math.floor(p.y/size);for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)for(const q of grid.get((ix+dx)+','+(iy+dy))||[]){if(q===p||q.id<=p.id)continue;const x=q.x-p.x,y=q.y-p.y,d=Math.hypot(x,y);if(d>0&&d<size){const nx=x/d,ny=y/d,over=(size-d)/2,dv=(q.vx-p.vx)*nx+(q.vy-p.vy)*ny;p.x-=over*nx;p.y-=over*ny;q.x+=over*nx;q.y+=over*ny;if(dv<0){p.vx+=dv*nx;p.vy+=dv*ny;q.vx-=dv*nx;q.vy-=dv*ny;}}}}for(const p of ps)bound(p,s);}
function bound(p,s){if(s.scene==='ink'){const d=Math.hypot(p.x,p.y),limit=175-p.r;if(d>limit){const nx=p.x/d,ny=p.y/d,v=p.vx*nx+p.vy*ny;p.x=nx*limit;p.y=ny*limit;if(v>0){p.vx-=2*v*nx;p.vy-=2*v*ny;}}return;}if(p.x>720-p.r){if(s.window==='open'&&p.y>70&&p.y<230&&p.kind==='solute'){p.kind='medium';sim.escaped++;}p.x=720-p.r;p.vx=-Math.abs(p.vx);}if(p.x<p.r){p.x=p.r;p.vx=Math.abs(p.vx);}if(p.y<p.r){p.y=p.r;p.vy=Math.abs(p.vy);}if(p.y>300-p.r){p.y=300-p.r;p.vy=-Math.abs(p.vy);}}
function advance(dt,l){if(!sim.loaded){l.setRunning(false);return;}sim.acc+=dt*RATE;while(sim.acc>=DT&&sim.t<LIMIT-1e-8){sim.acc-=DT;sim.t=Math.min(LIMIT,sim.t+DT);if(Math.abs(sim.t-Math.round(sim.t))<1e-7)sim.t=Math.round(sim.t);if(l.state.scene==='evap')advanceTransfer(sim.transfer,sim.t);else moveDisks(DT,l.state);
 if(l.state.scene==='perfume')for(let i=0;i<6;i++)if(sim.sensed[i]==null){const x=190+i%3*170,y=i<3?80:220;if(sim.ps.filter(p=>p.kind==='solute'&&Math.hypot(p.x-x,p.y-y)<45).length>=2)sim.sensed[i]=sim.t;}
 if(Math.abs(sim.t*10-Math.round(sim.t*10))<1e-6){const p=sim.ps[sim.tracerId];if(p){sim.trace.push([p.x,p.y]);if(sim.trace.length>600)sim.trace.shift();}}if(sim.t-sim.path.at(-1).time>=1-1e-7)sim.path.push({time:sim.t,mass:mass(),remaining:sim.initial-sim.escaped});if(sim.t===LIMIT){l.setRunning(false);l.update();}}
}

 sceneNote:'모형 입자와 모형 시간입니다. 실제 방의 크기·입자 수·건조 시간을 그대로 재현하지 않습니다. 확산 장면은 충돌하는 원판의 운동 모형입니다. 증발 장면은 표면·공기·방으로 옮겨 가는 양을 나타내는 전달 모형이며, 실제 분자 궤적을 계산한 그림은 아닙니다.',
 assumptions:['물·향수·공기의 입자도 스스로 움직입니다. 확산 입자는 같은 질량의 탄성 원판으로 단순화합니다.','창문을 열어도 일정한 바람을 더하지 않습니다. 스스로 움직여 창밖으로 나간 향수와 들어오는 깨끗한 공기를 구별합니다.','증발은 같은 온도로 유지되는 얇은 젖은 막의 표면에서만 일어납니다. 내부 기포와 끓음은 다루지 않습니다.','액체·화면 안 기체·방으로 나간 양의 합은 같습니다. 저울에는 접시에 남은 액체만 더합니다.','아세톤 한 방울 0.015 g, 접시와 종이 30 g은 모형 가정입니다. 0.01 g 눈금의 0.00은 입자가 모두 없다는 뜻이 아닐 수 있습니다.'],
 teacher:`<h4>교과서와 범위</h4><p>비상교육 p.113–120, 152. 잉크 1–2방울, 향수 3–4회, 영점 맞춘 저울 위 아세톤 몇 방울입니다. 온도·바람 세기·습도·표면적을 조절하여 빠르기 요인을 비교하지 않습니다. 향수 감지는 두 표지가 반지름 45의 감지 영역에 함께 들어오면 기록하는 모형 기준입니다. 먼 자리는 대체로 늦지만 무작위 운동이므로 거리 순서를 반드시 따르는 답으로 채점하지 않습니다.</p><h4>확산 계산</h4><p>2차원 같은 질량의 탄성 원판, 초기 속도 성분은 가우스 분포이며 전체 평균 속도를 제거합니다. 원판 충돌·벽 반사에서 운동에너지를 보존합니다. 잉크 장면은 물 표지 440개와 방울당 잉크 15개, 반지름 6, 접시 반지름 175입니다. 실제 물의 인력·점성 전체를 재현하지 않는 조밀 원판 모형입니다. 향수는 공기 200개·회당 향수 25개, 반지름 4입니다. 열린 창문에서는 향수가 나간 수를 보존 장부에 남기고 같은 자리로 들어온 깨끗한 공기 표지로 대체합니다. 입자가 공기로 변한 것이 아닙니다. 공기 흐름이 없는 확산만 분리한 경계 조건입니다.</p><h4>증발 계산과 표시층</h4><p>미보정 Lennard–Jones 액체를 아세톤으로 부르지 않습니다. 얇은 젖은 막의 면적이 남은 양에 비례하는 근사에서 액체 L→기체 G, G→L, G→방 O의 1차 전달율 a=0.035, b=0.002, c=0.08 /모형초를 둡니다. dL/dt=−aL+bG, dG/dt=aL−(b+c)G, dO/dt=cG. 각 대표 입자의 지수 대기시간으로 전달을 표본화합니다. 주변이 온도를 유지하며 공급하는 에너지는 이번 차시에서 계기로 다루지 않습니다. 실제 아세톤 증기압·건조 시간 예측값이 아닙니다.</p><p>방울당 대표 입자 8개, 각 0.001875 g이며 저울은 L만 계산합니다. G와 O는 더하지 않습니다. 드물게 표면으로 돌아오는 입자도 다시 L에 더합니다. 세 영역의 그림은 양을 세는 도해이며, 액체에서 기체로 바뀌는 표시는 표면에 둡니다. DT=1/120초, 재생 1초=4모형초, 120모형초 관찰. 고정 난수열로 두 모드의 같은 조건을 재현합니다. 측정 흔들림 ±0.001 g 후 소수 둘째 자리 반올림은 학습에만 적용합니다.</p><h4>생활 연결</h4><p>p.152 새집 증후군은 가구 등에서 물질이 기체로 나오는 과정과, 나온 기체가 퍼지는 과정을 구별합니다. 창문은 밖으로 퍼져 나갈 경로가 됩니다. p.115 암모니아 지시약 실험과 p.117 석고 방향제 제작은 실물 활동으로 연결합니다. 끓음·기화의 열에너지는 뒤 실험실에서 다룹니다.</p>`,
