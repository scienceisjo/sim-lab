<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>우성 형질은 언제나 더 많을까? · CLICK SCIENCE</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../_kit/kit.css"><style>.rd{gap:12px;align-items:start}.rd>span{flex:0 0 28%}.rd b{overflow-wrap:anywhere;max-width:68%}.lab-panel a.abtn{display:block;text-decoration:none;text-align:center}.record-axes[hidden]{display:none}</style></head><body><script src="../_kit/kit.js"></script><script src="../_kit/explorer.js"></script><script>
'use strict';
Explorer.start({"id":"inheritance-lab","title":"우성 형질은 언제나 더 많을까?","unit":"생식과 유전","subject":"life","codes":["9과21-04","9과21-05"],"core":"자손은 부모에게서 대립유전자를 하나씩 받으며 확률은 가족 수가 적을 때 정확한 비율을 보장하지 않는다.","controls":[{"key":"parentA","label":"부모 1 유전자형","options":[["AA","AA"],["Aa","Aa"],["aa","aa"]],"value":"Aa"},{"key":"parentB","label":"부모 2 유전자형","options":[["AA","AA"],["Aa","Aa"],["aa","aa"]],"value":"Aa"}],"outputs":[{"key":"dominant","label":"우성 표현형 확률","unit":"%","digits":0,"noise":0},{"key":"recessive","label":"열성 표현형 확률","unit":"%","digits":0,"noise":0},{"key":"hetero","label":"Aa 확률","unit":"%","digits":0,"noise":0}],"measure":"recessive","evaluate":s=>{const outcomes=[...s.parentA].flatMap(a=>[...s.parentB].map(b=>[a,b].sort().join('')));return{dominant:outcomes.filter(g=>g!=='aa').length*25,recessive:outcomes.filter(g=>g==='aa').length*25,hetero:outcomes.filter(g=>g==='Aa').length*25};},"rule":"상염색체 한 유전자, 완전 우성, 생식세포의 대립유전자 전달 확률 각1/2, 무작위 수정. AA×aa 모두Aa; Aa×Aa AA:Aa:aa=1:2:1. 사람의 복합 형질을 단일 유전자로 단정하지 않는다.","limit":"완전 우성인 한 유전자 모형입니다. 키·지능·성격처럼 여러 요인이 관여하는 사람의 형질에 그대로 적용하지 않습니다.","prompt":"양쪽 부모가 우성 형질이어도 열성 자손이 가능한 조합을 찾아보세요.","challenge":{"title":"우성 부모에게 열성 자손","text":"부모 두 명을 Aa로 놓고 열성 자손 확률을 기록하세요.","check":s=>s.parentA==='Aa'&&s.parentB==='Aa'},"conclusion":"Aa와 Aa 사이에서 aa 자손은 {가능합니다|불가능합니다}. 확률 25%는 자녀 네 명 중 반드시 한 명이라는 뜻이 {아닙니다|맞습니다}.","quiz":[{"kind":"적용","question":"우성이라는 말은 어떤 뜻인가요?","options":["더 우수하고 흔하다는 뜻입니다.","이 모형에서 Aa일 때 나타나는 형질입니다.","열성 유전자를 없앱니다."],"answer":1,"feedback":["가치와 빈도를 뜻하지 않습니다.","대립유전자 조합의 표현 관계입니다.","a도 자손에게 전달됩니다."]},{"kind":"적용","question":"가계도에서 두 부모가 우성인데 열성 자녀가 있다면 이 모형의 부모는?","options":["둘 다 AA입니다.","둘 다 aa입니다.","둘 다 Aa입니다."],"answer":2,"feedback":["a를 줄 수 없습니다.","부모도 열성으로 나타납니다.","각 부모가 a를 하나씩 전달할 수 있습니다."]}],"caption":(s,v)=>'열성 표현형의 확률은 '+v.recessive+'%입니다.',"describe":(s,v)=>`우성 ${v.dominant}%, 열성 ${v.recessive}%, Aa ${v.hetero}%입니다.`,"draw":function draw(p,s,v,m){const a=[...s.parentA],b=[...s.parentB];p.text(190,100,'부모 1: '+s.parentA,27);p.text(745,100,'부모 2: '+s.parentB,27);for(let i=0;i<2;i++)for(let j=0;j<2;j++){const x=330+j*230,y=190+i*135,g=[a[i],b[j]].sort().join('');p.box(x,y,180,100,g==='aa'?'#ede3f5':'#def0e3','#bdd1c5');p.text(x+90,y+50,m?g:'가능한 자손',32);}if(m){p.text(225,242,a[0],30);p.text(225,377,a[1],30);p.text(420,151,b[0],30);p.text(650,151,b[1],30);}p.text(480,466,'각 칸은 같은 확률의 수정 조합입니다.',22);},"state":{"parentA":"Aa","parentB":"Aa"},"answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["완전 우성인 한 유전자 모형입니다. 키·지능·성격처럼 여러 요인이 관여하는 사람의 형질에 그대로 적용하지 않습니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
</script></body></html>
