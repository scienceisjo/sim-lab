<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>파동이 갈 때 입자도 따라갈까? · CLICK SCIENCE</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../_kit/kit.css"><style>.rd{gap:12px;align-items:start}.rd>span{flex:0 0 28%}.rd b{overflow-wrap:anywhere;max-width:68%}.lab-panel a.abtn{display:block;text-decoration:none;text-align:center}.record-axes[hidden]{display:none}</style></head><body><script src="../_kit/kit.js"></script><script src="../_kit/explorer.js"></script><script>
'use strict';
Explorer.start({"id":"wave-motion","title":"파동이 갈 때 입자도 따라갈까?","unit":"빛과 파동","subject":"phys","codes":["9과10-04"],"core":"매질은 제자리에서 진동하고 파동은 에너지를 전달하며 진폭·진동수·파형은 서로 다르다.","animate":true,"controls":[{"key":"amplitude","label":"진폭","min":5,"max":30,"step":5,"unit":"모형 단위","value":15},{"key":"frequency","label":"진동수","min":1,"max":4,"step":1,"unit":"Hz","value":2},{"key":"shape","label":"파형","options":[["sine","단순한 파형"],["complex","복합 파형"]],"value":"sine"}],"outputs":[{"key":"wavelength","label":"파장","unit":"모형 단위","digits":1,"noise":0},{"key":"period","label":"주기","unit":"s","digits":2,"noise":0}],"measure":"wavelength","evaluate":s=>({wavelength:240/s.frequency,period:1/s.frequency}),"rule":"전파 속력 v=240 모형길이/s 일정. y=A sin(kx−ωt). 복합 파형 y=A(sinθ+0.3sin3θ)/(19√19/90)의 고정 정규화(진폭 A). 파장은 v/f. 소리 자체는 종파이므로 아래 공기 점은 좌우로 진동시킨다.","limit":"위 그래프는 진동 상태를 펼친 표현입니다. 소리의 공기는 아래 모형처럼 진행 방향과 나란히 진동합니다. 화면은 실제 음파보다 느립니다.","prompt":"재생한 뒤 노란 점 하나만 따라 보세요. 진폭과 진동수를 따로 바꾸세요.","challenge":{"title":"진동수를 바꾸어도 진폭은 따로","text":"진폭 15, 진동수 4 Hz, 단순 파형을 선택하고 기록하세요.","check":s=>s.amplitude===15&&s.frequency===4&&s.shape==='sine'},"conclusion":"진동수가 커지면 소리의 높이는 {높아집니다|낮아집니다}. 매질 입자는 멀리 따라가기보다 {제자리에서 진동합니다|파동과 함께 이동합니다}.","quiz":[{"kind":"적용","question":"큰 소리와 높은 소리는 같은 뜻인가요?","options":["진폭과 진동수라는 서로 다른 특성과 관련됩니다.","항상 같습니다.","둘 다 입자의 이동 거리만 뜻합니다."],"answer":0,"feedback":["크기와 높낮이를 따로 조작해 보세요.","독립적으로 바꿀 수 있습니다.","파동과 입자 이동을 구별합니다."]},{"kind":"적용","question":"같은 높이의 악기 소리가 다른 까닭은?","options":["진동수가 반드시 다릅니다.","파형이 달라 맵시가 다를 수 있습니다.","소리는 진동하지 않습니다."],"answer":1,"feedback":["같은 기본 진동수도 다른 맵시를 냅니다.","복합 파형을 비교하세요.","소리는 진동으로 전달됩니다."]}],"caption":(s,v)=>'파동의 진행과 노란 입자의 진동을 구별하세요.',"describe":(s,v)=>`진동수 ${s.frequency} Hz, 파장 ${v.wavelength}, 주기 ${v.period.toFixed(2)}초입니다.`,"draw":function draw(p,s,v,m,l){const t=l.sceneTime||0,fn=a=>s.shape==='sine'?Math.sin(a):(Math.sin(a)+.3*Math.sin(3*a))/(19*Math.sqrt(19)/90);const pts=Array.from({length:401},(_,i)=>{const x=i*2;return[80+x,230-s.amplitude*2*fn(2*Math.PI*(x/v.wavelength-s.frequency*t))];});p.line(80,230,880,230,'#cad5e0');p.path(pts,'#367ec2',3);p.circle(400,230-s.amplitude*2*fn(2*Math.PI*(320/v.wavelength-s.frequency*t)),9,'#e2a92c');if(m){p.arrow(630,105,850,105,'#16866e');p.text(380,107,'파동의 진행');for(let i=0;i<49;i++){const x=80+i*16;const dis=s.amplitude*.12*fn(2*Math.PI*((x-80)/v.wavelength-s.frequency*t));p.circle(x+dis,370,4,i===20?'#e2a92c':'#568bad');}p.text(480,437,'아래 공기 입자는 좌우로 진동합니다.',21);}},"state":{"amplitude":15,"frequency":2,"shape":"sine"},"answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["위 그래프는 진동 상태를 펼친 표현입니다. 소리의 공기는 아래 모형처럼 진행 방향과 나란히 진동합니다. 화면은 실제 음파보다 느립니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
</script></body></html>
