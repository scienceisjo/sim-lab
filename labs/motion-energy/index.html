<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>떨어지는 동안 에너지는 어디로 갈까? · CLICK SCIENCE</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../_kit/kit.css"><style>.rd{gap:12px;align-items:start}.rd>span{flex:0 0 28%}.rd b{overflow-wrap:anywhere;max-width:68%}.lab-panel a.abtn{display:block;text-decoration:none;text-align:center}.record-axes[hidden]{display:none}</style></head><body><script src="../_kit/kit.js"></script><script src="../_kit/explorer.js"></script><script>
'use strict';
Explorer.start({"id":"motion-energy","title":"떨어지는 동안 에너지는 어디로 갈까?","unit":"운동과 에너지","subject":"phys","codes":["9과19-01","9과19-02","9과19-03","9과19-04"],"core":"자유 낙하에서 속력은 같은 시간마다 같은 만큼 늘고 위치 에너지가 운동 에너지로 전환된다.","controls":[{"key":"time","label":"낙하한 시간","min":0,"max":2,"step":0.1,"unit":"s","value":1},{"key":"mass","label":"물체 질량","min":1,"max":5,"step":1,"unit":"kg","value":2},{"key":"height","label":"출발 높이","min":20,"max":40,"step":10,"unit":"m","value":20}],"outputs":[{"key":"speed","label":"아래쪽 속력","unit":"m/s","digits":2,"noise":0.01},{"key":"potential","label":"위치 에너지","unit":"J","digits":2,"noise":0},{"key":"kinetic","label":"운동 에너지","unit":"J","digits":2,"noise":0}],"measure":"speed","repeat":true,"evaluate":s=>{const time=Math.min(s.time,Math.sqrt(2*s.height/9.8)),speed=9.8*time;return{speed,potential:s.mass*9.8*Math.max(0,s.height-4.9*time*time),kinetic:.5*s.mass*speed*speed};},"rule":"공기 저항 없음, g=9.8 m/s², 처음 속력 0. v=gt, h=h₀−gt²/2, Ep=mgh, Ek=mv²/2. 착지 직전까지 계산. 시간 슬라이더는 0~2초, 최소 높이20m로 충돌 이후를 포함하지 않는다.","limit":"공기 저항과 바닥 충돌은 다루지 않습니다. 위치 에너지의 기준은 바닥입니다.","prompt":"시간을 같은 간격으로 늘리세요. 질량을 바꾸어도 같은 시각의 속력이 달라지나요?","challenge":{"title":"같은 시간의 낙하","text":"시간 2초, 질량 2 kg, 높이 20 m에서 세 번 기록하세요.","check":s=>s.time===2&&s.mass===2&&s.height===20},"conclusion":"공기 저항이 없으면 같은 시간의 낙하 속력은 질량과 {무관합니다|정비례합니다}. 위치 에너지와 운동 에너지의 합은 {같습니다|늘어납니다}.","quiz":[{"kind":"적용","question":"낙하 중 위치 에너지가 줄면 그 에너지는?","options":["모두 사라집니다.","운동 에너지로 전환됩니다.","질량으로 전부 바뀝니다."],"answer":1,"feedback":["이 모형에서는 역학적 에너지가 보존됩니다.","두 막대의 합을 비교합니다.","이 현상의 설명이 아닙니다."]},{"kind":"적용","question":"질량이 큰 물체는 진공에서 항상 더 빨리 떨어지나요?","options":["같은 높이에서 정지해 놓으면 낙하 속력이 같습니다.","항상 더 빠릅니다.","무거우면 중력이 없습니다."],"answer":0,"feedback":["공기 저항 없는 조건입니다.","질량과 가속도를 혼동했습니다.","무거운 물체에도 중력이 작용합니다."]}],"caption":(s,v)=>'두 에너지의 합은 '+(v.potential+v.kinetic).toFixed(1)+' J입니다.',"describe":(s,v)=>`${s.time}초의 속력 ${v.speed.toFixed(2)} m/s, 두 에너지 합 ${(v.potential+v.kinetic).toFixed(2)} J입니다.`,"draw":function draw(p,s,v,m){const y=420-(s.height-4.9*s.time*s.time)*8;p.line(90,420,340,420,'#728395',4);p.line(220,85,220,420,'#cad5e0',2,[4,5]);for(let t=0;t<=s.time+.001;t+=.2)p.circle(220,420-(s.height-4.9*t*t)*8,3,'#adc6e0');p.circle(220,y,20,'#2d74bd');p.text(220,459,s.time.toFixed(1)+' s');if(m){p.arrow(260,y,260,y+v.speed*2.8,'#2d74bd');p.bar(450,190,'위치 에너지',v.potential,s.mass*9.8*s.height,'#7955bb',' J');p.bar(450,300,'운동 에너지',v.kinetic,s.mass*9.8*s.height,'#d99112',' J');p.text(615,410,'막대의 합은 일정합니다.',21);}},"state":{"time":1,"mass":2,"height":20},"answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["공기 저항과 바닥 충돌은 다루지 않습니다. 위치 에너지의 기준은 바닥입니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
