<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>거울 뒤의 상은 어디에 있을까? · CLICK SCIENCE</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../_kit/kit.css"><style>.rd{gap:12px;align-items:start}.rd>span{flex:0 0 28%}.rd b{overflow-wrap:anywhere;max-width:68%}.lab-panel a.abtn{display:block;text-decoration:none;text-align:center}.record-axes[hidden]{display:none}</style></head><body><script src="../_kit/kit.js"></script><script src="../_kit/explorer.js"></script><script>
'use strict';
Explorer.start({"id":"image-optics","title":"거울 뒤의 상은 어디에 있을까?","unit":"빛과 파동","subject":"phys","codes":["9과10-02"],"core":"평면거울의 상은 반사광을 거꾸로 연장한 곳에 보이며 렌즈의 상은 물체 위치에 따라 달라진다.","observation":true,"controls":[{"key":"distance","label":"물체의 거리","min":15,"max":60,"step":5,"unit":"모형 단위","value":40},{"key":"optic","label":"광학 기구","options":[["mirror","평면거울"],["convex","볼록렌즈"],["concave","오목렌즈"]],"value":"mirror"}],"outputs":[{"key":"image","label":"상의 특징","numeric":false},{"key":"place","label":"상의 위치","numeric":false}],"evaluate":s=>{if(s.optic==='mirror')return{image:'바로 선 같은 크기의 허상',place:'거울 뒤, 물체와 같은 거리'};const f=s.optic==='convex'?20:-20;if(s.distance===f)return{image:'유한한 위치에 상이 맺히지 않습니다.',place:'나가는 빛이 나란합니다.'};const q=1/(1/f-1/s.distance),mag=-q/s.distance;return{image:(mag>0?'바로 선 ':'거꾸로 선 ')+(Math.abs(Math.abs(mag)-1)<1e-8?'같은 크기의 ':Math.abs(mag)>1?'확대된 ':'축소된 ')+(q>0?'실상':'허상'),place:q>0?'렌즈의 반대편':'물체와 같은 편'};},"rule":"평면거울 x영상=−x물체. 렌즈는 얇은 렌즈 근축식 f=±20 모형단위, q=1/(1/f−1/u), 배율 −q/u. 공식과 정량 상 계산은 기본 화면·문항에 제시하지 않는다. 광선은 얇은 렌즈에 대한 근축 모형.","limit":"렌즈는 얇고 빛이 중심축에 가까운 경우를 단순화합니다. 허상으로 향하는 점선에는 실제 빛이 지나가지 않습니다.","prompt":"거울에서는 물체를 멀리 옮겨 보세요. 볼록렌즈에서는 가까이 놓았을 때도 비교하세요.","challenge":{"title":"가까이서 확대해 보기","text":"볼록렌즈에서 물체 거리를 15로 놓고 상의 방향과 크기를 기록하세요.","check":s=>s.optic==='convex'&&s.distance===15},"conclusion":"평면거울의 상은 거울 {뒤|앞}에 보입니다. 허상을 향한 점선은 실제 빛의 경로가 {아닙니다|맞습니다}.","quiz":[{"kind":"적용","question":"거울 뒤 허상 자리에 종이를 놓으면 상을 받을 수 있나요?","options":["빛이 실제로 모이지 않아 받을 수 없습니다.","언제나 받을 수 있습니다.","거울 크기만 크면 됩니다."],"answer":0,"feedback":["광선의 연장선이 만나는 자리입니다.","실상과 허상을 구별합니다.","거울 크기로 바뀌는 성질이 아닙니다."]},{"kind":"적용","question":"볼록렌즈의 상은 항상 거꾸로인가요?","options":["항상 그렇습니다.","물체가 가까우면 바로 선 확대된 허상도 생깁니다.","오목렌즈에서만 상이 생깁니다."],"answer":1,"feedback":["물체의 위치를 바꾸어 보세요.","돋보기 조건을 비교합니다.","두 렌즈 모두 상을 만들 수 있습니다."]}],"caption":(s,v)=>v.image,"describe":(s,v)=>v.image+'이며 '+v.place+'입니다.',"draw":function draw(p,s,v,m){const x=480,y=290,scale=4,u=s.distance*scale;p.line(55,y,905,y,'#a5b3c2',2);p.line(x,95,x,460,s.optic==='mirror'?'#657889':'#53a7c2',8);p.arrow(x-u,y,x-u,y-55,'#16866e',6);p.text(x-u,425,'물체');if(!m)return;let q,mag;if(s.optic==='mirror'){q=-s.distance;mag=1;}else{const f=s.optic==='convex'?20:-20;if(s.distance===f){p.arrow(x,y-55,880,y-55,'#d79113');return;}q=1/(1/f-1/s.distance);mag=-q/s.distance;}const ix=s.optic==='mirror'?x-q*scale:x+q*scale,iy=y-55*mag;if(ix>45&&ix<915&&iy>55&&iy<460){p.arrow(ix,y,ix,iy,'#7955bb',4);p.text(ix,465,'상');}else p.text(700,440,'상은 이 화면 밖에 있습니다.',18);if(s.optic==='mirror'){for(const h of [230,340]){p.arrow(x-u,y-55,x,h,'#d79113',3);p.arrow(x,h,x-200,h+(h-(y-55))*200/u,'#d79113',3);p.line(x,h,ix,iy,'#7955bb',2,[7,6]);}}else{p.line(x-u,y-55,x,y-55,'#d79113',3);const f=s.optic==='convex'?80:-80;p.arrow(x,y-55,860,y-55+55*380/f,'#d79113',3);p.line(x-u,y-55,x,y,'#d79113',3);p.arrow(x,y,880,y+55*400/u,'#d79113',3);if(q<0){p.line(x,y-55,ix,iy,'#7955bb',2,[7,6]);p.line(x,y,ix,iy,'#7955bb',2,[7,6]);}}},"state":{"distance":40,"optic":"mirror"},"measure":"image","answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["렌즈는 얇고 빛이 중심축에 가까운 경우를 단순화합니다. 허상으로 향하는 점선에는 실제 빛이 지나가지 않습니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
</script></body></html>
