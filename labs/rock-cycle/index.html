<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>암석은 한 방향으로만 바뀔까? · CLICK SCIENCE</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../_kit/kit.css"><style>.rd{gap:12px;align-items:start}.rd>span{flex:0 0 28%}.rd b{overflow-wrap:anywhere;max-width:68%}.lab-panel a.abtn{display:block;text-decoration:none;text-align:center}.record-axes[hidden]{display:none}</style></head><body><script src="../_kit/kit.js"></script><script src="../_kit/explorer.js"></script><script>
'use strict';
Explorer.start({"id":"rock-cycle","title":"암석은 한 방향으로만 바뀔까?","unit":"지권의 변화","subject":"earth","codes":["9과09-01","9과09-03","9과09-04"],"core":"암석은 생성 과정으로 분류하며 여러 경로로 순환하고 풍화 산물이 토양 형성에 기여한다.","observation":true,"controls":[{"key":"rock","label":"출발 물질","options":[["igneous","화성암"],["sedimentary","퇴적암"],["metamorphic","변성암"],["sediment","퇴적물"],["magma","마그마"]],"value":"igneous"},{"key":"process","label":"작용","options":[["weather","풍화·침식"],["pressure","열과 압력"],["melt","용융"],["cool","냉각"],["compact","다져짐·굳어짐"]],"value":"weather"}],"outputs":[{"key":"result","label":"변화의 결과","numeric":false},{"key":"note","label":"조건 해석","numeric":false}],"evaluate":s=>{const solid=['igneous','sedimentary','metamorphic'].includes(s.rock);let result='이 조건만으로 해당 변화 경로를 정하지 않습니다.';if(s.rock==='magma'&&s.process==='cool')result='화성암';if(solid&&s.process==='weather')result='퇴적물';if(solid&&s.process==='pressure')result='변성암';if(solid&&s.process==='melt')result='마그마';if(s.rock==='sediment'&&s.process==='compact')result='퇴적암';return{result,note:s.process==='pressure'?'녹지 않은 상태에서 조직과 광물이 달라집니다.':s.process==='weather'?'암석 조각과 풍화 산물은 토양의 재료가 됩니다.':'출발 물질과 작용을 함께 확인합니다.'};},"rule":"방향성 있는 암석 순환 관계망. 모든 조합이 전이를 만드는 것은 아니다. 변성≠용융. 토양에는 풍화물뿐 아니라 유기물·물·공기가 포함. 지권은 지각·맨틀·외핵·내핵이며 맨틀은 대부분 고체.","limit":"경로를 고르는 모형이며 변화 속도·깊이·온도를 정량 예측하지 않습니다. 한 암석이 반드시 모든 단계를 순서대로 거치지는 않습니다.","prompt":"같은 암석에 서로 다른 작용을 적용해 보세요. 되돌아가는 길도 찾아보세요.","challenge":{"title":"녹음과 변성 구별하기","text":"퇴적암에 열과 압력을 적용한 결과를 기록하세요.","check":s=>s.rock==='sedimentary'&&s.process==='pressure'},"conclusion":"변성암은 암석이 녹지 않은 채 {변한 것입니다|굳은 것입니다}. 암석 순환에는 {여러 경로|한 가지 고정 순서}가 있습니다.","quiz":[{"kind":"적용","question":"맨틀 전체가 마그마인가요?","options":["대부분 고체이며 마그마는 일부에서 생깁니다.","전부 액체입니다.","전부 공기입니다."],"answer":0,"feedback":["층의 상태와 일부 용융을 구별합니다.","전체를 액체로 그리면 오개념입니다.","암석으로 이루어집니다."]},{"kind":"적용","question":"토양은 잘게 부순 암석만인가요?","options":["항상 그렇습니다.","풍화물과 유기물·물·공기 등이 함께 있습니다.","모두 새로 생긴 원소입니다."],"answer":1,"feedback":["토양의 다른 구성물을 놓쳤습니다.","시간과 생물의 작용도 중요합니다.","물질 순환으로 설명합니다."]}],"caption":(s,v)=>v.result,"describe":(s,v)=>v.result+'입니다. '+v.note,"draw":function draw(p,s,v,m){const names={igneous:'화성암',sedimentary:'퇴적암',metamorphic:'변성암',sediment:'퇴적물',magma:'마그마'};const points=[[170,165],[480,125],[790,165],[710,380],[250,380]];Object.entries(names).forEach(([k,n],i)=>{const [x,y]=points[i];p.box(x-85,y-42,170,85,k===s.rock?'#dacbb5':n===v.result?'#d7eadd':'#eef1f6');p.text(x,y,n,25);});if(m){const start=Object.keys(names).indexOf(s.rock),end=Object.values(names).indexOf(v.result);if(end>=0&&end!==start){const a=points[start],b=points[end],dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy);p.arrow(a[0]+dx/len*90,a[1]+dy/len*55,b[0]-dx/len*95,b[1]-dy/len*55,'#9b7042');}p.text(480,270,'작용을 바꾸면 경로도 달라집니다.',22);}},"state":{"rock":"igneous","process":"weather"},"measure":"result","answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["경로를 고르는 모형이며 변화 속도·깊이·온도를 정량 예측하지 않습니다. 한 암석이 반드시 모든 단계를 순서대로 거치지는 않습니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
</script></body></html>
