Explorer.start({"id":"atmosphere-circulation","title":"높이와 위도를 바꾸면 공기는 어떻게 다를까?","unit":"날씨와 기후변화","subject":"earth","codes":["9과17-01","9과17-02"],"core":"대기의 수직 층과 위도별 지표 바람을 구별하고 대순환이 에너지 재분배에 기여함을 이해한다.","observation":true,"controls":[{"key":"height","label":"지표에서의 높이","min":0,"max":100,"step":5,"unit":"km","value":5},{"key":"latitude","label":"북반구 위도대","options":[[15,"0~30°"],[45,"30~60°"],[75,"60~90°"]],"value":15}],"outputs":[{"key":"layer","label":"대기층","numeric":false},{"key":"temperatureTrend","label":"층 안의 기온 경향","numeric":false},{"key":"wind","label":"지표 부근 바람","numeric":false}],"evaluate":s=>({layer:s.height<10?'대류권':s.height<50?'성층권':s.height<80?'중간권':'열권',temperatureTrend:s.height<10||s.height>=50&&s.height<80?'높이 올라갈수록 대체로 낮아집니다.':'높이 올라갈수록 대체로 높아집니다.',wind:s.latitude===15?'북동 무역풍':s.latitude===45?'편서풍':'극동풍'}),"rule":"층 경계 모형10/50/80km 근사. 실제경계는시공간변화. 수직기온경향에 따른4권역. 북반구0~30북동무역풍,30~60편서풍,60~90극동풍. 지표풍의 대표경향, 전향력·비자전지구 비교 제외.","limit":"층 경계와 바람은 평균적인 경향을 단순화했습니다. 높이 손잡이는 대기층, 위도 손잡이는 지표 바람을 바꾸며 두 위치를 같은 관측점으로 읽지 않습니다.","prompt":"높이에 따른 층 구분과 위도에 따른 바람 구분은 서로 다른 비교입니다.","challenge":{"title":"성층권과 중위도 바람 구별하기","text":"높이 20 km, 북반구 30~60°를 선택해 각각의 결과를 기록하세요.","check":s=>s.height===20&&s.latitude===45},"conclusion":"성층권에서는 높이 올라갈수록 기온이 대체로 {높아집니다|낮아집니다}. 북반구 중위도 지표의 대표 바람은 {편서풍|북동 무역풍}입니다.","quiz":[{"kind":"적용","question":"대기 대순환은 어떤 역할을 하나요?","options":["위도 사이의 에너지를 재분배합니다.","태양 에너지를 새로 만듭니다.","바다는 영향을 받지 않습니다."],"answer":0,"feedback":["불균등 가열로 생긴 차이를 줄이는 데 기여합니다.","에너지를 만들어 내지 않습니다.","표층 해류와 연결됩니다."]},{"kind":"적용","question":"지표의 바람 이름을 높이 손잡이만으로 정할 수 있나요?","options":["언제나 가능합니다.","수직 층과 위도별 지표 바람을 구별해야 합니다.","대기층은 모두 같은 온도입니다."],"answer":1,"feedback":["비교하는 위치가 다릅니다.","두 축을 구별합니다.","높이에 따른 기온 경향이 다릅니다."]}],"caption":(s,v)=>'대기층과 지표 바람을 각각 비교하세요.',"describe":(s,v)=>`${s.height} km는 ${v.layer}, 선택 위도대의 지표 바람은 ${v.wind}입니다.`,"draw":function draw(p,s,v,m){const cols=['#dcebf3','#bedbeb','#d9d5ee','#ede2f2'],bounds=[0,10,50,80,100],names=['대류권','성층권','중간권','열권'];for(let i=0;i<4;i++){const y=445-bounds[i+1]*3.4,h=(bounds[i+1]-bounds[i])*3.4;p.box(100,y,330,h,cols[i]);p.text(265,y+h/2,names[i],20);}const y=445-s.height*3.4;p.arrow(455,y,425,y,'#b36b49');p.text(275,80,'높이에 따른 층',24);p.text(700,80,'위도별 지표 바람',24);[[75,160],[45,280],[15,400]].forEach(([a,Y])=>{p.line(545,Y,870,Y,'#c3d3e0',2);p.text(550,Y-35,a+'° 부근',18,'#526c80','left');if(m){const selected=s.latitude===a;p.arrow(a===45?690:770,Y+(a===45?25:-25),a===45?770:690,Y+(a===45?-25:25),selected?'#b97950':'#8aa6b9',selected?7:3);p.text(710,Y+55,a===15?'북동 무역풍':a===45?'편서풍':'극동풍',19);}});},"state":{"height":5,"latitude":15},"measure":"layer","answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["층 경계와 바람은 평균적인 경향을 단순화했습니다. 높이 손잡이는 대기층, 위도 손잡이는 지표 바람을 바꾸며 두 위치를 같은 관측점으로 읽지 않습니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
