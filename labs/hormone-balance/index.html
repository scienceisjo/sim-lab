<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>혈당이 달라지면 몸은 어떻게 조절할까? · CLICK SCIENCE</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../_kit/kit.css"><style>.rd{gap:12px;align-items:start}.rd>span{flex:0 0 28%}.rd b{overflow-wrap:anywhere;max-width:68%}.lab-panel a.abtn{display:block;text-decoration:none;text-align:center}.record-axes[hidden]{display:none}</style></head><body><script src="../_kit/kit.js"></script><script src="../_kit/explorer.js"></script><script>
'use strict';
Explorer.start({"id":"hormone-balance","title":"혈당이 달라지면 몸은 어떻게 조절할까?","unit":"자극과 반응","subject":"life","codes":["9과20-03"],"core":"호르몬은 혈액을 통해 표적 기관에 작용하며 혈당 변화에 대한 조절이 항상성에 기여한다.","observation":true,"controls":[{"key":"condition","label":"몸의 상황","options":[["high","식후 혈당이 높아진 상황"],["low","공복에 혈당이 낮아진 상황"]],"value":"high"},{"key":"view","label":"살펴볼 과정","options":[["signal","분비와 이동"],["target","표적 기관의 작용"]],"value":"signal"}],"outputs":[{"key":"hormone","label":"더 활발해지는 조절","numeric":false},{"key":"effect","label":"주요 작용","numeric":false}],"evaluate":s=>({hormone:s.condition==='high'?'이자의 인슐린 분비가 증가합니다.':'이자의 글루카곤 분비가 증가합니다.',effect:s.condition==='high'?'세포의 포도당 이용과 간·근육의 저장을 촉진합니다.':'간에서 저장 물질의 분해와 포도당 방출을 촉진합니다.'}),"rule":"정상적인 혈당 항상성의 정성적 음성 되먹임. 농도 임계값·투약·질환 진단 없음. 두 호르몬이 단순 ON/OFF 스위치라는 뜻은 아니다. 성장호르몬·티록신은 교사용 설명에서 성장·대사에 관여한다고 연결.","limit":"건강한 몸의 조절 방향을 단순화한 모형입니다. 실제 혈당 진단이나 약물 투여량을 예측하지 않습니다.","prompt":"변화가 더 커지는지 원래 상태 쪽으로 돌아오는지 비교하세요.","challenge":{"title":"공복 때의 조절","text":"혈당이 낮아진 상황에서 표적 기관의 작용을 기록하세요.","check":s=>s.condition==='low'&&s.view==='target'},"conclusion":"혈당이 높아지면 인슐린은 혈당을 {낮추는 쪽|더 높이는 쪽}으로 작용합니다. 호르몬은 주로 {혈액|소화관 내용물}을 통해 이동합니다.","quiz":[{"kind":"적용","question":"호르몬은 모든 세포에 똑같이 작용하나요?","options":["표적 세포가 신호에 반응합니다.","모든 물체에 똑같이 작용합니다.","혈액에서는 이동하지 않습니다."],"answer":0,"feedback":["신호를 받아들이는 세포가 있습니다.","표적과 기능이 다릅니다.","혈액을 통해 운반됩니다."]},{"kind":"적용","question":"항상성을 설명하는 말은?","options":["모든 값이 영원히 고정됩니다.","변화에 반응해 적절한 범위를 유지합니다.","조절 없이 변화가 계속 커집니다."],"answer":1,"feedback":["완전히 변하지 않는다는 뜻이 아닙니다.","상황에 맞춰 조절합니다.","조절 방향을 봅니다."]}],"caption":(s,v)=>v.hormone,"describe":(s,v)=>v.hormone+' '+v.effect,"draw":function draw(p,s,v,m){p.box(80,180,210,130,'#e8eff6');p.text(185,245,s.condition==='high'?'혈당이 높아짐':'혈당이 낮아짐',23);p.box(375,180,210,130,'#ede3f5');p.text(480,245,'이자',28);p.box(670,180,210,130,'#dfeddf');p.text(775,245,'간·표적 세포',23);p.arrow(300,245,365,245);p.arrow(595,245,660,245);if(m){p.path([[775,325],[775,420],[185,420],[185,325]],'#428d69',4);p.text(480,395,'변화를 줄이는 쪽으로 조절합니다.',23);p.text(480,115,s.condition==='high'?'인슐린':'글루카곤',28,'#7955bb');}},"state":{"condition":"high","view":"signal"},"measure":"hormone","answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["건강한 몸의 조절 방향을 단순화한 모형입니다. 실제 혈당 진단이나 약물 투여량을 예측하지 않습니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
</script></body></html>
