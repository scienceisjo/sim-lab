const CAP={sand:382000,water:2000000},NAMES={sand:'모래',water:'물'},DT=60,RATE=1440;
const sunlight=hour=>300*Math.max(0,Math.sin(Math.PI*(hour-6)/12));
function thermal(T,key,hour,dt=DT){const C=CAP[key],e=Math.exp(-25*dt/C);return 20+(T-20)*e+sunlight(hour)/25*(1-e);}
const cache=new Map();
function profile(left,right,dt=DT){const id=left+':'+right+':'+dt;if(cache.has(id))return cache.get(id);const n=86400/dt;let a=20,b=20,u=0;const list=[];for(let i=0;i<=21*n;i++){if(i>=20*n)list.push({hour:(i-20*n)*dt/3600,left:a,right:b,flow:u});if(i===21*n)break;const hour=((i%n)+.5)*dt/3600,aa=thermal(a,left,hour,dt),bb=thermal(b,right,hour,dt),e=Math.exp(-dt/1200);u=u*e+((a-b+aa-bb)/2)*(1-e);a=aa;b=bb;}cache.set(id,list);return list;}
function sample(s){const rows=profile(s.left,s.right),j=Math.min(1440,Math.max(0,s.hour*60)),i=Math.floor(j),f=j-i,a=rows[i],b=rows[Math.min(1440,i+1)];return {hour:s.hour,left:a.left+(b.left-a.left)*f,right:a.right+(b.right-a.right)*f,flow:a.flow+(b.flow-a.flow)*f};}
const range=(s,side)=>{const values=profile(s.left,s.right).map(p=>p[side]);return Math.max(...values)-Math.min(...values);};
function wind(s,r=sample(s)){if(Math.abs(r.flow)<.001)return '이 모형에서는 바람이 없습니다.';if(s.left==='sand'&&s.right==='water')return r.flow>0?'해풍 · 바다에서 육지로':'육풍 · 육지에서 바다로';if(s.left==='water'&&s.right==='sand')return r.flow>0?'육풍 · 육지에서 바다로':'해풍 · 바다에서 육지로';return r.flow>0?'오른쪽에서 왼쪽으로':'왼쪽에서 오른쪽으로';}
const sim={elapsed:0,acc:0,owner:null,mode:null,fullDay:false};let book,msg,lastFrame=0;const rows=i=>book.rows.filter(r=>r._mission===i);const markers=Array.from({length:60},(_,i)=>({x:.08+(i%10)*.093,z:.12+Math.floor(i/10)*.15}));

 teacher:`<h4>교과서</h4><p>비상교육 p.97, 99, 108. 모래·물 상대 비열 0.191/1, 낮 해풍·밤 육풍과 바다가 있던 자리가 모래로 바뀔 때의 일교차를 연결합니다. '육풍'은 p.108 활동의 용어입니다. 중3의 기압·공기 기둥 계산은 학생 화면에 넣지 않습니다.</p><h4>열 계산</h4><p>C물=2×10⁶, C모래=382000 J/(m² K). C dT/dt=S(t)−25(T−20), S(t)=300 max(0,sin[π(t−6)/12]) W/m². 60초 간격의 중간 시각 일사량을 일정하게 둔 해석해로 한 단계씩 계산합니다. 초기 20 ℃에서 20일 예비 계산한 뒤 다음 하루를 비교합니다. 두 칸의 질량/면적이 같다는 설명 모형이며 실제 토양 깊이·해양 혼합층을 예측하지 않습니다. 시간 간격을 절반으로 줄여 수렴을 확인합니다.</p><h4>순환 모형</h4><p>상대 순환 u는 du/dt=[(T왼−T오른)−u]/1200으로 온도 차를 따라갑니다. 각 간격의 평균 온도 차를 쓴 해석적 1차 응답입니다. 흐름 함수 ψ=A sin(πx)sin(πz), A=−0.02u의 속도 성분 (∂ψ/∂z,−∂ψ/∂x)으로 표지를 옮깁니다. z는 위쪽이 양수입니다. 왼쪽이 따뜻한 정상 방향에서 지표는 오른쪽→왼쪽, 왼쪽 상승·상층 오른쪽·오른쪽 하강으로 닫힙니다. 단일 순환 근사이며 실제 분자 운동이나 풍속이 아닙니다. |u|＜0.001은 표시상 바람 없음으로 둡니다.</p><p>오른쪽 바다를 모래로 바꾸면 오른쪽 칸의 일교차가 커집니다. 두 칸의 열 방정식은 독립이므로 왼쪽 육지의 온도 범위가 바뀐다고 주장하지 않습니다. 아랄해 주변 기후의 모든 변화를 이 두 칸만으로 설명하거나 실제 수치 예측으로 쓰지 않습니다.</p>`,
