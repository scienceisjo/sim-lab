<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>지구 안쪽은 모두 녹아 있을까? · CLICK SCIENCE</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../_kit/kit.css"><style>.rd{gap:12px;align-items:start}.rd>span{flex:0 0 28%}.rd b{overflow-wrap:anywhere;max-width:68%}.lab-panel a.abtn{display:block;text-decoration:none;text-align:center}.record-axes[hidden]{display:none}</style></head><body><script src="../_kit/kit.js"></script><script src="../_kit/explorer.js"></script><script>
'use strict';
Explorer.start({"id":"earth-layers","title":"지구 안쪽은 모두 녹아 있을까?","unit":"지권의 변화","subject":"earth","codes":["9과09-01"],"core":"지각·맨틀·외핵·내핵의 위치와 상태를 구별하고 지구계 구성 요소를 연결한다.","observation":true,"controls":[{"key":"depth","label":"표면에서의 깊이","min":0,"max":6370,"step":10,"unit":"km","value":1000},{"key":"crust","label":"지각 모형","options":[["continent","대륙 지각 35 km"],["ocean","해양 지각 7 km"]],"value":"continent"}],"outputs":[{"key":"layer","label":"해당 층","numeric":false},{"key":"stateOfMatter","label":"물질의 상태","numeric":false}],"evaluate":s=>{const layer=s.depth<(s.crust==='continent'?35:7)?'지각':s.depth<2890?'맨틀':s.depth<5150?'외핵':'내핵';return{layer,stateOfMatter:layer==='외핵'?'액체입니다.':layer==='맨틀'?'대부분 고체이며 긴 시간에 걸쳐 변형됩니다.':'고체입니다.'};},"rule":"지구반지름6371 km. 모형 지각두께 대륙35/해양7, 맨틀–외핵경계2890km, 외핵–내핵5150km. 실제지각두께지역차이, 숫자암기목표아님. 지진파 탐사원리 생략.","limit":"경계 깊이는 비교용 근삿값입니다. 지각 두께는 지역마다 다릅니다. 그림에서 매우 얇은 지각은 찾기 쉽도록 외곽선으로 강조했습니다.","prompt":"깊이를 바꾸고 맨틀과 외핵의 상태를 비교하세요.","challenge":{"title":"고체 맨틀과 액체 외핵","text":"깊이 3000 km를 선택하여 외핵의 상태를 기록하세요.","check":s=>s.depth===3000},"conclusion":"맨틀은 대부분 {고체|액체}입니다. 외핵은 {액체|기체}입니다.","quiz":[{"kind":"적용","question":"지구계에 속하는 것은?","options":["지권만 있습니다.","지권·수권·기권·생물권 등 연결된 요소가 있습니다.","대기는 지구와 무관합니다."],"answer":1,"feedback":["여러 요소가 상호작용합니다.","물질과 에너지가 오갑니다.","기권도 구성 요소입니다."]},{"kind":"적용","question":"지각과 맨틀을 같은 말로 써도 되나요?","options":["완전히 같습니다.","맨틀은 대기입니다.","서로 다른 층입니다."],"answer":2,"feedback":["층을 구별합니다.","지구 내부의 층입니다.","지각 아래에 맨틀이 있습니다."]}],"caption":(s,v)=>v.layer+': '+v.stateOfMatter,"describe":(s,v)=>`${s.depth} km는 이 모형에서 ${v.layer}이며 ${v.stateOfMatter}`,"draw":function draw(p,s,v,m){const cx=340,cy=285,R=180;p.circle(cx,cy,R,'#be9873','#775e48');p.circle(cx,cy,R*(6371-35)/6371,'#d5a17d');p.circle(cx,cy,R*(6371-2890)/6371,'#e1b561');p.circle(cx,cy,R*(6371-5150)/6371,'#f2d9a0');const r=R*(6371-s.depth)/6371;p.circle(cx+r,cy,7,'#274d79');if(m){p.line(cx+r,cy,620,cy,'#47698c',2);p.text(730,220,v.layer,34);p.text(730,305,s.depth+' km',28);p.text(730,395,'깊이에 비례한 단면',19);}},"state":{"depth":1000,"crust":"continent"},"measure":"layer","answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["경계 깊이는 비교용 근삿값입니다. 지각 두께는 지역마다 다릅니다. 그림에서 매우 얇은 지각은 찾기 쉽도록 외곽선으로 강조했습니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
</script></body></html>
