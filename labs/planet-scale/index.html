'use strict';
Explorer.start({"id":"planet-scale","title":"행성의 크기와 거리를 따로 비교하면?","unit":"태양계","subject":"earth","codes":["9과07-01"],"core":"행성의 크기와 거리는 다른 척도이며 지구형과 목성형의 특징을 근거로 분류한다.","controls":[{"key":"planet","label":"행성","options":[["mercury","수성"],["venus","금성"],["earth","지구"],["mars","화성"],["jupiter","목성"],["saturn","토성"],["uranus","천왕성"],["neptune","해왕성"]],"value":"earth"},{"key":"scale","label":"비교할 척도","options":[["size","반지름 비교"],["distance","거리 비교"]],"value":"size"}],"outputs":[{"key":"radius","label":"지구 대비 반지름","unit":"배","digits":2,"noise":0},{"key":"distance","label":"태양까지 평균 거리","unit":"AU","digits":2,"noise":0},{"key":"group","label":"행성의 분류","numeric":false}],"measure":"radius","evaluate":s=>{const data={mercury:[.383,.387],venus:[.949,.723],earth:[1,1],mars:[.532,1.524],jupiter:[10.97,5.203],saturn:[9.14,9.537],uranus:[3.98,19.19],neptune:[3.86,30.07]},a=data[s.planet];return{radius:a[0],distance:a[1],group:['mercury','venus','earth','mars'].includes(s.planet)?'지구형 행성':'목성형 행성'};},"rule":"NASA 행성 자료를 비교용으로 반올림한 평균 반지름·평균 궤도거리. 반지름 비교에서는 지구1=10px, 거리에서는1AU=24px. 두 척도를 같은 그림에서 혼합하지 않는다. 목성형은 중학교 분류이며 천왕성·해왕성은 얼음 거대 행성으로도 구별한다.","limit":"반지름 그림과 거리 그림은 서로 다른 축척입니다. 거리 그림의 표지는 행성의 크기를 나타내지 않습니다.","prompt":"반지름과 거리의 척도를 바꾸어 보세요. 크다고 반드시 태양에서 가장 멀까요?","challenge":{"title":"멀리 있는 큰 행성 비교","text":"해왕성을 거리 비교로 관찰하고 기록하세요.","check":s=>s.planet==='neptune'&&s.scale==='distance'},"conclusion":"목성은 지구보다 반지름이 {큽니다|작습니다}. 크기와 거리를 비교할 때 축척을 {구별해야 합니다|항상 같다고 봅니다}.","quiz":[{"kind":"적용","question":"행성과 위성을 나누는 중요한 기준은?","options":["색입니다.","주로 무엇을 중심으로 공전하는지입니다.","어둠에서 보이는지입니다."],"answer":1,"feedback":["색만으로 구별하지 않습니다.","위성은 행성 등 주천체 주위를 공전합니다.","밝기만으로 구별하지 않습니다."]},{"kind":"적용","question":"명왕성이 왜소행성으로 분류되면?","options":["태양계 밖으로 나갑니다.","태양이 됩니다.","천체는 그대로 있고 분류가 달라진 것입니다."],"answer":2,"feedback":["분류 변경은 위치 이동이 아닙니다.","별이 되는 것이 아닙니다.","태양계 구성원입니다."]}],"caption":(s,v)=>v.group+'입니다. 축척을 확인하세요.',"describe":(s,v)=>`반지름 ${v.radius}배, 평균 거리 ${v.distance} AU인 ${v.group}입니다.`,"draw":function draw(p,s,v,m){if(s.scale==='size'){p.circle(210,270,10,'#4a85c5');p.circle(620,270,v.radius*10,'#baa185');p.text(210,430,'지구 = 1');p.text(620,430,'선택 행성 = '+v.radius);if(m){p.line(110,95,210,95);p.text(160,130,'지구 반지름 10배',18);}}else{p.line(100,280,870,280);p.circle(100,280,15,'#dda340');p.circle(100+v.distance*24,280,8,'#4a85c5');[0,10,20,30].forEach(a=>{p.line(100+a*24,275,100+a*24,300);p.text(100+a*24,335,a+' AU',20);});if(m)p.text(480,150,'거리 표지 크기는 행성 크기가 아닙니다.',23);}},"state":{"planet":"earth","scale":"size"},"answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["반지름 그림과 거리 그림은 서로 다른 축척입니다. 거리 그림의 표지는 행성의 크기를 나타내지 않습니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
