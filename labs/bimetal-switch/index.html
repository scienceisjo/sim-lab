const MAT={al:{name:'알루미늄',a:23e-6,color:'#91a6bc'},brass:{name:'놋쇠',a:19e-6,color:'#d4b65e'},cu:{name:'구리',a:17e-6,color:'#cb8768'},iron:{name:'철',a:11e-6,color:'#64748b'}};
const DT=.05,RATE=30,L=.025,H=.0004,SCALE=450/L,YSCALE=SCALE*4;
const deflect=(s,T)=>3*(MAT[s.upper].a-MAT[s.lower].a)*(T-20)*L*L/(4*H);
const normal=s=>s.side==='down'?1:-1,gap=s=>s.scene==='blanket'?.00018:.0005;
const sim={t:0,acc:0,T:20,maxT:20,B:20,closed:true,latched:false,ended:false,boiling:false,owner:null,mode:null,path:[],events:[]};let book,msg;const rows=i=>book.rows.filter(r=>r._mission===i);
const temperature=s=>s.scene==='manual'?s.target:sim.B;
function closed(s,T=temperature(s)){if(s.scene!=='manual')return sim.closed;const q=normal(s)*deflect(s,T);return s.contact==='off'?q<=gap(s):q>=gap(s);}
function direction(s,T){const y=deflect(s,T);return Math.abs(y)<1e-10?'휘지 않았습니다.':(y>0?MAT[s.lower].name:MAT[s.upper].name)+' 쪽으로 휘었습니다.';}
function actualDeflection(s,T){const y=deflect(s,T);return s.scene==='manual'&&s.contact==='on'&&normal(s)*y>gap(s)?normal(s)*gap(s):y;}
function rewind(l){const s=l.state;if(s.scene!=='manual'){s.contact='off';s.side='down';}Object.assign(sim,{t:0,acc:0,T:20,maxT:20,B:20,closed:true,latched:false,ended:false,boiling:false,owner:null,mode:null,path:[{time:0,body:20,strip:20}],events:[]});}
function configure(l,s){Object.assign(l.state,s);l.rewind();}
function tick(s,dt=DT){const kettle=s.scene==='kettle',C=kettle?4187:300,P=kettle?1500:180,loss=kettle?5:3,tau=kettle?30:5,oldT=sim.T;
 sim.T+=(P*Number(sim.closed)-loss*(sim.T-20))*dt/C;sim.B+=(oldT-sim.B)*dt/tau;sim.t=Math.round((sim.t+dt)*1e8)/1e8;
 const q=normal(s)*deflect(s,sim.B),before=sim.closed;if(kettle){if(q>gap(s))sim.latched=true;sim.closed=!sim.latched;}else{if(sim.closed&&q>=gap(s))sim.closed=false;else if(!sim.closed&&q<=.00010)sim.closed=true;}
 if(before!==sim.closed)sim.events.push({t:sim.t,closed:sim.closed});if(kettle&&sim.T>=100){sim.T=100;sim.boiling=true;sim.ended=true;}sim.maxT=Math.max(sim.maxT,sim.T);if(sim.t>=900)sim.ended=true;

}

 sceneNote:'두 층 전체가 같은 온도라고 가정합니다. 휨 변화는 가로 길이 비율에 비해 4배로, 두께는 별도로 확대했습니다. 접점은 작은 변형을 따라 움직이는 유연한 부품입니다. 기기에서 떨어진 접점의 이동은 원리도입니다. 실제 제품의 구조·안전 온도를 그대로 재현한 것은 아닙니다.',
 assumptions:['두 금속 층의 두께와 탄성은 같고 단단히 붙어 있습니다. 전체 온도는 고릅니다.','꺼지는 접점은 작은 변형을 따라가다가 이동 한계에서 떨어집니다. 접점이 판에 주는 힘은 작다고 가정합니다.','켜지는 접점에 닿은 뒤에는 끝이 더 내려가지 못합니다. 점선은 접점이 없을 때의 모양입니다.','주전자는 한 번 꺼지면 걸쇠가 꺼진 상태를 유지합니다. 장판은 식으면 다시 켜집니다.','학습 온도 측정만 최대 0.2 ℃ 흔들립니다. 주전자 물이 100 ℃에 닿으면 관찰을 끝내며 더 높은 온도로 올리지 않습니다.'],
 teacher:`<h4>교과서</h4><p>비상교육 p.101–103, 107. 가열하면 열팽창 정도가 작은 쪽, 냉각하면 큰 쪽으로 휨을 비교합니다. 금속은 알루미늄·놋쇠·구리·철(강철)이며 α=23/19/17/11×10⁻⁶/K입니다. 두 층의 탄성률과 두께가 같다는 근사에서 전체 두께 h=0.4 mm, 길이 L=25 mm, 기준 20 ℃, κ=3(α위−α아래)ΔT/(2h), 자유 끝 처짐=κL²/2입니다. 작은 기울기 근사를 씁니다.</p><p>켜지는 접점이 끝을 막으면 자유 휨 y=δu²에 끝 힘으로 인한 (δ실제−δ)(1.5u²−0.5u³)을 더합니다(u=x/L). 접점 반력의 크기는 표시하지 않습니다. 꺼지는 접점은 판을 미리 눌러 휨을 숨기지 않고 판을 따라가는 유연한 접점으로 단순화했습니다. 기본 이동 한계 0.5 mm, 방향 위/아래를 고를 수 있습니다.</p><h4>기기 모형</h4><p>주전자 물 1 kg: 열용량 4187 J/K, 출력 1500 W, 손실 5 W/K, 공기 20 ℃, 바이메탈 응답 30초. 한 번 접점이 떨어지면 걸쇠가 유지됩니다. 물이 100 ℃에 도달하면 끓는 중으로 표시하고 관찰을 끝냅니다. 기화 이후는 계산하지 않습니다. 장판: 열용량 300 J/K, 출력 180 W, 손실 3 W/K, 바이메탈 응답 5초, 0.18 mm에서 끄고 0.10 mm에서 다시 켭니다. 이력 특성으로 접점 떨림을 피합니다. 두 기기는 상수와 스위치 구조가 다른 설명 모형이며 실제 안전장치 설계값이 아닙니다. 기기 장면은 꺼지는 아래 접점으로 고정합니다.</p><p>고정 0.05초 오일러 적분, 재생 1초=30초, 최대 900초. 작은 시간 간격과 대조하여 수렴을 확인합니다. 열원 위치 변경은 전체 균일 온도 가정에서 휨 방향에 영향을 주지 않습니다. 전압·전류 세기·전자 운동·인바 조성은 제외합니다.</p>`,
