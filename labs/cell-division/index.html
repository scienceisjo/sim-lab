<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>세포는 왜 커지기만 하지 않을까? · CLICK SCIENCE</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../_kit/kit.css"><style>.rd{gap:12px;align-items:start}.rd>span{flex:0 0 28%}.rd b{overflow-wrap:anywhere;max-width:68%}.lab-panel a.abtn{display:block;text-decoration:none;text-align:center}.record-axes[hidden]{display:none}</style></head><body><script src="../_kit/kit.js"></script><script src="../_kit/explorer.js"></script><script>
'use strict';
Explorer.start({"id":"cell-division","title":"세포는 왜 커지기만 하지 않을까?","unit":"생식과 유전","subject":"life","codes":["9과21-01","9과21-02","9과21-03"],"core":"세포 크기에 따른 표면적과 부피의 관계, 분열에 따른 염색체 분배를 구별한다.","controls":[{"key":"size","label":"정육면체 세포 한 변","min":1,"max":4,"step":1,"unit":"모형 단위","value":2},{"key":"division","label":"분열 과정","options":[["before","DNA 복제 전"],["copied","DNA 복제 후"],["mitosis","체세포분열 후"],["meiosis1","감수 1분열 후"],["meiosis","생식세포 형성 후"],["cleavage","초기 난할 후"]],"value":"before"}],"outputs":[{"key":"ratio","label":"분열 전 표면적/부피","unit":"","digits":2,"noise":0},{"key":"cells","label":"모형 속 세포 수","unit":"개","digits":0,"noise":0},{"key":"chromosomes","label":"세포당 염색체 수","unit":"개","digits":0,"noise":0}],"measure":"ratio","evaluate":s=>({ratio:6/s.size,cells:{before:1,copied:1,mitosis:2,meiosis1:2,meiosis:4,cleavage:2}[s.division],chromosomes:['meiosis1','meiosis'].includes(s.division)?2:4}),"rule":"정육면체 SA=6a²,V=a³, SA/V=6/a. 2n=4인 가상 생물. 체세포분열 후2세포각4, 감수분열 완료후4세포각2. 초기 난할의 총부피는 거의 같고 딸세포는 작아진다. DNA 복제 후와 감수1분열 후에는 X 모양으로 연결된 두 염색분체를 표시한다. DNA 복제만으로 염색체 수는 늘지 않으며 감수1분열에서 상동염색체, 2분열에서 염색분체가 분리된다. 막대 색은 부모에게서 온 상동염색체를 구별한다. 딸세포 크기는 동일 총부피를 나눈 비율로 그린다.","limit":"염색체 4개인 가상 생물의 가능한 분배 한 예입니다. 정육면체는 표면적과 부피를 비교하며 실제 세포 모양은 다양합니다.","prompt":"세포를 크게 해도 표면적과 부피가 같은 비율로 늘까요? 분열 종류도 비교하세요.","challenge":{"title":"염색체 수가 절반인 세포","text":"한 변 2, 생식세포 형성 후를 선택해 기록하세요.","check":s=>s.size===2&&s.division==='meiosis'},"conclusion":"세포가 커지면 표면적/부피는 {작아집니다|커집니다}. 생식세포 형성이 끝나면 세포당 염색체 수는 {절반입니다|두 배입니다}.","quiz":[{"kind":"적용","question":"체세포분열 후 딸세포의 염색체 수는?","options":["모세포와 같습니다.","항상 절반입니다.","0개입니다."],"answer":0,"feedback":["DNA를 복제하고 고르게 나눕니다.","감수분열과 구별합니다.","유전 정보가 전달됩니다."]},{"kind":"적용","question":"수정란의 초기 난할에서 주로 일어나는 일은?","options":["전체 부피가 매번 두 배가 됩니다.","전체 크기는 거의 같고 세포 수가 늘어납니다.","염색체가 모두 없어집니다."],"answer":1,"feedback":["성장과 초기 난할을 구별합니다.","한 세포의 크기는 작아집니다.","염색체를 분배합니다."]}],"caption":(s,v)=>'세포당 염색체 '+v.chromosomes+'개 · 세포 '+v.cells+'개',"describe":(s,v)=>`표면적/부피 ${v.ratio.toFixed(2)}, ${v.cells}세포 각각 염색체 ${v.chromosomes}개입니다.`,"draw":function draw(p,s,v,m){const a=45*s.size;p.box(65,320-a,a,a,'#dcece7','#61977e');p.text(180,410,'한 변 '+s.size);const n=v.cells,r=65/Math.cbrt(n);for(let i=0;i<n;i++){const x=510+(i%2)*235,y=n>2?170+Math.floor(i/2)*215:275;p.circle(x,y,r,'#ede6f4','#9b87b3');if(m)for(let j=0;j<v.chromosomes;j++){const xx=x-(v.chromosomes-1)*10+j*20,color=['meiosis1','meiosis'].includes(s.division)?((j+(s.division==='meiosis'?Math.floor(i/2):i))%2?'#6b91c4':'#cf8192'):(j%2?'#6b91c4':'#cf8192');if(['copied','meiosis1'].includes(s.division)){p.line(xx-6,y-18,xx+6,y+18,color,5);p.line(xx+6,y-18,xx-6,y+18,color,5);}else p.line(xx,y-18,xx,y+18,color,6);}}if(m){p.text(175,115,'작을수록 비가 큽니다.',19);p.text(670,78,'색은 상동 염색체의 출처입니다.',20);}},"state":{"size":2,"division":"before"},"answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["염색체 4개인 가상 생물의 가능한 분배 한 예입니다. 정육면체는 표면적과 부피를 비교하며 실제 세포 모양은 다양합니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
</script></body></html>
