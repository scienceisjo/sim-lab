}

function advance(dt,l){sim.acc+=dt*RATE;const next=(Math.floor((sim.t+1e-6)/60)+1)*60;while(sim.acc>=DT&&!sim.ended){sim.acc-=DT;tick(l.state);sim.t+=DT;if(Math.abs(sim.t-Math.round(sim.t/60)*60)<1e-6){sim.t=Math.round(sim.t/60)*60;sim.path.push({time:sim.t/60,...sim.T});if(sim.t>=next){if(sim.t>=300)sim.ended=true;sim.acc=0;l.setRunning(false);l.update();break;}}if(sim.t>=300||sim.T.lower>=95||sim.T.upper>=95){sim.ended=true;sim.path.push({time:sim.t/60,...sim.T});l.setRunning(false);l.update();}}}

 assumptions:['냄비와 물을 몇 부분으로 나누어 온도를 계산하는 모형입니다. 정확한 조리 시간 예측에는 쓰지 않습니다.','물의 순환은 온도 차이에 따라 생기는 평균 흐름으로 단순화했습니다. 복잡한 물결과 소용돌이는 생략합니다.','물 흐름 막기는 상상 실험입니다. 실제 한천이 높은 온도에서도 굳어 있다고 가정하지 않습니다.','가림판은 복사를 잘 반사하지만 조금 데워져 다시 복사를 냅니다. 주변 공기는 20 ℃로 유지합니다.','물이 95 ℃에 이르면 관찰을 끝내며 끓음은 다루지 않습니다. 학습 온도 측정은 최대 0.2 ℃ 흔들린 뒤 반올림합니다.'],
 teacher:`<h4>교과서</h4><p>비상교육 p.82, 90, 92–94. 냄비·손잡이의 전도, 물의 대류, 불과 주변의 복사를 함께 비교합니다. p.93 몸이나 스마트 기기 색으로 표현하는 활동을 대신하지 않고 표현을 점검할 근거를 제공합니다.</p><h4>열과 흐름 계산</h4><p>물은 위아래 각 0.5 kg, 열용량 각 2090 J/K입니다. 냄비 180, 손잡이 50, 카드 20, 가림판 40 J/K. 불 약/강은 냄비로 300/600 W를 전달합니다. 냄비–물 100 W/K, 냄비–손잡이 0.6 W/K, 물 전도 0.06 W/K의 덩어리 열모형입니다. 이는 실측 장치 상수가 아닌 설명용 설정입니다. 이웃에서 빠진 열은 다른 부분에 같은 양을 더합니다.</p><p>평균 순환 고리는 du/dt=gβΔT·H/L−10u|u|, β=3e−4 K⁻¹, H/L=0.2로 계산합니다. 물 교환 열량률은 (0.06+ρcAu)ΔT, 유효 흐름 면적 A=0.0005 m²입니다. 아래가 따뜻해지면 평균 흐름이 생깁니다. 상세 유체장·운동에너지와 열의 작은 교환은 생략한 근사입니다. 물 흐름을 막으면 이동항만 0으로 하고 전도는 남깁니다.</p><h4>복사와 보존 검사</h4><p>불은 700 ℃, 끔에서는 20 ℃입니다. 검은 카드 방사율 0.95, 반사판 0.05, 불 0.9로 절대온도 4제곱 복사 교환을 계산합니다. 각 시야율 합이 1을 넘지 않게 불·카드·가림판·주변 경로를 분배합니다. 가림판이 있으면 직접 경로는 0이지만 가림판–카드 교환은 남깁니다. 불에서 공급된 열과 주변으로 나간 열을 누적하여 각 부분 열에너지 합과 대조합니다. 냄비의 나머지 주변 교환은 선형 열손실 계수로 근사합니다. DT=0.02초이며 재생 1초는 실험 15초입니다.</p><h4>보조 표현의 한계</h4><p>물 덩어리 표지는 분자가 아닙니다. 고체 입자 창에서는 입자 색과 크기를 고정합니다. 복사 화살표 길이는 양을 뜻하지 않으며 같은 넓이의 방출 비교 막대만 계산된 비를 따릅니다. 차가운 카드도 복사하지만 불보다 훨씬 작고 열의 순이동은 뜨거운 쪽에서 찬 쪽입니다.</p>`,
