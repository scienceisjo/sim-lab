const C={pan:180,handle:50,lower:2090,upper:2090,card:20,screen:40},DT=.02,RATE=15,SIGMA=5.670374419e-8,A=.002,ROOM=20;

const sim={t:0,acc:0,T:{},u:0,travel:0,input:0,loss:0,owner:null,mode:null,ended:false,path:[]};let book,msg;const rows=i=>book.rows.filter(r=>r._mission===i),four=t=>(t+273.15)**4,eff=(a,b)=>1/(1/a+1/b-1);
function radiation(s,T){const fire=s.power==='off'?20:700,f=s.power==='weak'?.05:.1,fsc=s.shield?.5:0,fc=s.shield?0:f,fs=s.shield?f:0;
 return {toCard:eff(.9,.95)*SIGMA*A*fc*(four(fire)-four(T.card)),toScreen:eff(.9,.05)*SIGMA*A*fs*(four(fire)-four(T.screen)),screenCard:eff(.05,.95)*SIGMA*A*fsc*(four(T.screen)-four(T.card)),cardRoom:.95*SIGMA*A*(1-fc-fsc)*(four(T.card)-four(ROOM)),screenRoom:.05*SIGMA*A*(1-fs-fsc)*(four(T.screen)-four(ROOM)),fireEmission:.9*SIGMA*four(fire),cardEmission:.95*SIGMA*four(T.card)};
}
function energy(){return Object.entries(C).reduce((sum,[k,c])=>sum+c*(k==='handle'?handle.reduce((a,b)=>a+b,0)/handle.length:sim.T[k]),0)-sim.input+sim.loss;}
function rewind(l){fluid=new Thermal.Pan();handle=new Float64Array(12).fill(20);micro=new Thermal.Lattice(12,3);microLast=0;Object.assign(sim,{t:0,acc:0,T:Object.fromEntries(Object.keys(C).map(k=>[k,20])),u:0,travel:0,input:0,loss:0,owner:null,mode:null,ended:false,path:[{time:0,upper:20,lower:20,handle:20,card:20}]});}
function configure(l,s){Object.assign(l.state,s);l.rewind();}
function tick(s,dt=DT){
 const T=sim.T,P=s.power==='strong'?300:s.power==='weak'?150:0,r=radiation(s,T);
 if(s.flow)sim.u=Math.max(0,sim.u+dt*(9.8*.0003*(T.lower-T.upper)*.2-10*sim.u*Math.abs(sim.u)));else sim.u=0;
 const water=fluid.step(dt,T.pan,s.flow?sim.u:0),n=handle.length,k=.6*n,hq=new Float64Array(n),panHandle=k*(T.pan-handle[0]);hq[0]+=panHandle;
 for(let i=0;i<n-1;i++){const q=k*(handle[i]-handle[i+1]);hq[i]-=q;hq[i+1]+=q;}
 let handleLoss=0;for(let i=0;i<n;i++){const q=.2/n*(handle[i]-20);hq[i]-=q;handleLoss+=q;}for(let i=0;i<n;i++)handle[i]+=dt*hq[i]/(C.handle/n);
 const airPan=.4*(T.pan-20),airCard=.2*(T.card-20),airScreen=.2*(T.screen-20);
 T.pan+=dt*(P-water.fromPan-panHandle-airPan)/C.pan;
 T.card+=dt*(r.toCard+r.screenCard-r.cardRoom-airCard)/C.card;T.screen+=dt*(r.toScreen-r.screenCard-r.screenRoom-airScreen)/C.screen;
 Object.assign(T,fluid.means());T.handle=handle[n-1];sim.travel+=sim.u*dt;
 sim.input+=(P+r.toCard+r.toScreen)*dt;sim.loss+=(water.loss+handleLoss+airPan+airCard+airScreen+r.cardRoom+r.screenRoom)*dt;
}
function advance(dt,l){sim.acc+=dt*RATE;const next=(Math.floor((sim.t+1e-6)/60)+1)*60;while(sim.acc>=DT&&!sim.ended){sim.acc-=DT;tick(l.state);sim.t+=DT;if(Math.abs(sim.t-Math.round(sim.t/60)*60)<1e-6){sim.t=Math.round(sim.t/60)*60;sim.path.push({time:sim.t/60,...sim.T});if(sim.t>=next){if(sim.t>=300)sim.ended=true;sim.acc=0;l.setRunning(false);l.update();break;}}if(sim.t>=300||Math.max(...fluid.T)>=95){sim.ended=true;sim.path.push({time:sim.t/60,...sim.T});l.setRunning(false);l.update();}}}
Lab.init({id:'heat-three-ways',version:2,title:'전도·대류·복사',subject:'phys',unit:'열의 이동',grade:'중1',updated:'2026-09-27',board:{w:960,h:600},state:{power:'strong',flow:true,shield:false,focus:'all'},animate:true,
 viewLabels:{scene:'장면 보기',model:'입자·열 흐름'},sceneDescription:'보기 단추로 온도색과 입자·열 흐름 설명을 켜거나 끕니다.',
 sceneNote:'색은 그 부분의 온도 표시이며 실제 색이 아닙니다. 물속 점은 분자가 아닌 물 덩어리입니다. 입자 확대창의 열운동은 재생을 멈춰도 계속됩니다.',
 assumptions:['물은 위치별 216칸, 손잡이는 12부분으로 나누어 열의 이동을 계산합니다. 정확한 조리 시간 예측에는 쓰지 않습니다.','물 덩어리는 가운데에서 데워져 상승하고 벽 쪽에서 하강합니다. 순환 경로를 단순화했으며 실제 물결 전체를 계산하지는 않습니다.','물 흐름 막기는 상상 실험입니다. 실제 한천이 높은 온도에서도 굳어 있다고 가정하지 않습니다.','가림판은 복사를 잘 반사하지만 조금 데워져 다시 복사를 냅니다. 주변 공기는 20 ℃로 유지합니다.','물의 어느 부분이든 95 ℃에 이르면 관찰을 끝내며 끓음은 다루지 않습니다. 학습 온도 측정은 최대 0.2 ℃ 흔들린 뒤 반올림합니다.'],
 teacher:`<h4>교과서</h4><p>비상교육 p.82, 90, 92–94. 냄비·손잡이의 전도, 물의 대류, 불과 주변의 복사를 함께 비교합니다. p.93 몸이나 스마트 기기 색으로 표현하는 활동을 대신하지 않고 표현을 점검할 근거를 제공합니다.</p><h4>열과 흐름 계산</h4><p>물 1 kg의 열용량 4180 J/K를 18×12칸에 균등 배분합니다. 24×16 cm 단면, 부피 1 L의 깊이, 물의 열전도율 0.6 W/(m K)로 이웃 전도와 유체 이동의 열 운반을 보존형 유한체적으로 계산합니다. 가운데 아랫면과 냄비 사이 총 열전달 계수 100 W/K입니다. 손잡이는 열용량 합 50 J/K의 12칸이며 각 이웃 열전달 계수는 7.2 W/K입니다. 불의 약/강은 냄비로 150/300 W를 공급합니다. 실제 제품의 예측값이 아닌 설명용 장치입니다.</p><p>평균 유속은 du/dt=gβΔT·0.2−10u|u|, β=3e−4 K⁻¹로 계산합니다. 닫힌 두 순환의 유선함수 ψ=uW/(2π)sin(2πx/W)sin(πy/H)를 사용해 가운데 상승·벽 쪽 하강과 질량 보존을 표현합니다. 전체 유체 방정식을 푼 것은 아닙니다. 이웃 간 열교환은 한쪽에서 뺀 만큼 다른 쪽에 더하며, 표시한 위·아래 온도는 해당 반쪽 물의 평균입니다. 흐름 막기에서는 이동항만 끕니다.</p><p>고체 확대창은 이웃 간 조화 결합과 평형점 복원력의 2차원 운동을 Velocity Verlet로 적분합니다. 국소 Langevin 열저장고를 계산한 온도에 연결합니다. 미시 진동은 확대하고 느리게 표현하며 계수로 실제 금속의 전도율을 예측하지 않습니다. 입자 하나의 순간 속도를 온도로 해석하지 않습니다.</p><h4>복사와 보존 검사</h4><p>불은 700 ℃, 끔에서는 20 ℃입니다. 검은 카드 방사율 0.95, 반사판 0.05, 불 0.9로 절대온도 4제곱 복사 교환을 계산합니다. 각 시야율 합이 1을 넘지 않게 불·카드·가림판·주변 경로를 분배합니다. 가림판이 있으면 직접 경로는 0이지만 가림판–카드 교환은 남깁니다. 불에서 공급된 열과 주변으로 나간 열을 누적하여 각 부분 열에너지 합과 대조합니다. 냄비의 나머지 주변 교환은 선형 열손실 계수로 근사합니다. DT=0.02초이며 재생 1초는 실험 15초입니다.</p><h4>보조 표현의 한계</h4><p>물 덩어리 표지는 분자가 아닙니다. 고체 입자 크기는 고정하며 색은 그 부분의 평균 온도입니다. 같은 위상 사인파 대신 이웃 조화력과 복원력을 적분합니다. 연결선은 이웃 상호작용의 표지입니다. 금속에서는 자유 전자도 전도에 기여하지만 이 확대창에는 나타내지 않습니다. 복사 화살표 길이는 양을 뜻하지 않으며 같은 넓이의 방출 비교 막대만 계산된 비를 따릅니다. 차가운 카드도 복사하지만 불보다 훨씬 작고 열의 순이동은 뜨거운 쪽에서 찬 쪽입니다.</p>`,
