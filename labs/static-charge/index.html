<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>닿지 않았는데 왜 끌려올까? · CLICK SCIENCE</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../_kit/kit.css"><style>.rd{gap:12px;align-items:start}.rd>span{flex:0 0 28%}.rd b{overflow-wrap:anywhere;max-width:68%}.lab-panel a.abtn{display:block;text-decoration:none;text-align:center}.record-axes[hidden]{display:none}</style></head><body><script src="../_kit/kit.js"></script><script src="../_kit/explorer.js"></script><script>
'use strict';
Explorer.start({"id":"static-charge","title":"닿지 않았는데 왜 끌려올까?","unit":"전기와 자기","subject":"phys","codes":["9과14-01"],"core":"전자 이동과 도체 내부 전하 재배치로 대전과 정전기 유도를 구별한다.","observation":true,"controls":[{"key":"rod","label":"막대의 전하","options":[["negative","음전하"],["positive","양전하"]],"value":"negative"},{"key":"stage","label":"금속구와 막대","options":[["far","멀리 두기"],["near","가까이 두기"],["touch","접촉 후 떼기"]],"value":"far"}],"outputs":[{"key":"distribution","label":"금속구의 전하","numeric":false},{"key":"force","label":"상호작용","numeric":false}],"evaluate":s=>({distribution:s.stage==='far'?'전체적으로 중성입니다.':s.stage==='near'?'가까운 쪽은 반대 전하, 전체는 중성입니다.':s.rod==='negative'?'전자를 받아 음전하를 띱니다.':'전자를 잃어 양전하를 띱니다.',force:s.stage==='far'?'멀리 있어 이 그림에서는 힘을 생략합니다.':s.stage==='near'?'분극된 금속구가 막대에 끌립니다.':'같은 종류 전하끼리 밀어냅니다.'}),"rule":"절연 받침 위 도체와 대전 막대. 유도에서 원자핵 이동·전하 생성 없음. 접촉은 같은 부호로 대전되는 표준 사례만 정성적으로 다룬다. 힘 크기 수치 없음.","limit":"금속구 속에서 움직일 수 있는 전자만 재배치합니다. 그림의 + 표지는 움직이지 않는 원자핵 쪽의 양전하를 뜻합니다.","prompt":"가까이 두기와 접촉 후 떼기를 비교하세요. 전체 전하까지 바뀌었나요?","challenge":{"title":"전체는 중성인 유도","text":"음전하 막대를 가까이 두되 접촉하지 않은 상태를 기록하세요.","check":s=>s.rod==='negative'&&s.stage==='near'},"conclusion":"접촉 없는 유도에서는 전하가 {재배치됩니다|새로 생깁니다}. 금속 내부에서 주로 이동하는 것은 {전자입니다|원자핵입니다}.","quiz":[{"kind":"적용","question":"중성 금속구가 끌려오면 전체가 양전하라는 뜻인가요?","options":["반드시 그렇습니다.","전하 재배치만으로도 끌릴 수 있습니다.","전자는 존재하지 않습니다."],"answer":1,"feedback":["전체 전하와 분포는 다릅니다.","가까운 쪽과 먼 쪽을 구별합니다.","전자 이동으로 설명합니다."]},{"kind":"적용","question":"마찰로 대전될 때 원소가 달라지나요?","options":["양성자가 모두 이동합니다.","새 원소가 만들어집니다.","전자 이동으로 전하가 달라집니다."],"answer":2,"feedback":["원자핵은 옮겨 다니지 않습니다.","대전은 핵반응이 아닙니다.","전자 수 변화를 추적합니다."]}],"caption":(s,v)=>v.distribution,"describe":(s,v)=>v.distribution+' '+v.force,"draw":function draw(p,s,v,m){const rx=s.stage==='far'?130:285;p.box(rx-45,180,70,210,s.rod==='negative'?'#86b4e6':'#e7a0a0');p.circle(590,285,130,'#dbe5ee','#768ba0');p.box(570,414,40,45,'#c8ad8e');if(m){const e=s.stage==='near'?(s.rod==='negative'?1:-1):0;for(let i=0;i<6;i++){const y=215+(i%3)*60,x=535+Math.floor(i/3)*100;p.text(x,y,'+',28,'#b23a30');}const electrons=s.stage==='touch'?(s.rod==='negative'?8:4):6;for(let i=0;i<electrons;i++){const y=i<6?245+(i%3)*60:285,x=i<6?565+Math.floor(i/3)*90+e*25:(i===6?480:700);p.text(x,y,'−',28,'#2e5f8f');}for(let i=0;i<3;i++)p.text(rx-10,225+i*55,s.rod==='negative'?'−':'+',28);if(s.stage==='touch')p.text(810,280,s.rod==='negative'?'전자 유입':'전자 유출',20);}p.text(590,95,'절연 받침 위 금속구');},"state":{"rod":"negative","stage":"far"},"measure":"distribution","answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["금속구 속에서 움직일 수 있는 전자만 재배치합니다. 그림의 + 표지는 움직이지 않는 원자핵 쪽의 양전하를 뜻합니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
</script></body></html>
