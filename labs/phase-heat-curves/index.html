<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>상태 변화와 열에너지 · CLICK SCIENCE</title><link rel="stylesheet" href="../_kit/kit.css"><link rel="icon" href="data:,"></head><body><script src="../_kit/kit.js"></script><script>
'use strict';
const CW=4.187,LF=334,LV=2257,SCENES={lauric:'로르산 식히기',boil:'물 가열하기',freeze:'물 얼리기',melt:'얼음 녹이기',jar:'항아리 냉장고',store:'과일 창고'};
const life=s=>['jar','store'].includes(s.scene),limit=s=>life(s)?43200:s.scene==='boil'?1320:1800;
function iceState(H,m,glass=0){const L=m*LF;return H<0?{T:H/(m*2.1+glass),f:0}:H<=L?{T:0,f:H/L}:{T:(H-L)/(m*CW+glass),f:1};}
function createRun(s){s={...s};let v;if(s.scene==='lauric')v=[1800+40*(60.5-43.9)];if(s.scene==='boil')v=[0];if(s.scene==='freeze')v=[20*LF+(20*CW+20)*20];if(s.scene==='melt')v=[-(20*2.1+20)*18,200*CW*30];if(s.scene==='jar')v=[4000*35,10000*35,s.wet?300:0];if(s.scene==='store')v=[120000*5,s.barrels*5000*(LF+CW*5)];const e={s,v,t:0,acc:0,external:0,initial:0,owner:null,mode:null,path:[],boilAt:null,stopped:false};e.initial=energy(e);e.path.push(sample(e));return e;}
function energy(e){return e.s.scene==='jar'?e.v[0]+e.v[1]:e.v.reduce((a,b)=>a+b,0);}
function stateOf(e){const s=e.s,v=e.v,k=s.scene;if(k==='lauric'){const H=v[0],f=Math.min(1,Math.max(0,H/1800));return {T:H<0?43.9+H/40:H>1800?43.9+(H-1800)/40:43.9,f,other:20,mass:10,state:f===0?'고체':f===1?'액체':'액체와 고체',q:-40*.17/60*((H<0?43.9+H/40:H>1800?43.9+(H-1800)/40:43.9)-20)};}
 if(k==='boil'){const threshold=(33*CW+42)*(100-25.2),T=Math.min(100,25.2+v[0]/(33*CW+42)),mass=Math.max(0,33-Math.max(0,v[0]-threshold)/LV);return {T,f:mass/33,other:25,mass,state:mass<=0?'액체 없음':T<100?'액체':'액체와 기체',q:s.power*(1-Math.exp(-e.t/90))-.3*(T-25)};}
 if(k==='freeze'||k==='melt'){const a=iceState(v[0],20,20),other=k==='freeze'?-21:v[1]/(200*CW);return {...a,other,mass:20,state:a.f===0?'고체':a.f===1?'액체':'액체와 고체',q:(k==='freeze'?.4:.5)*(other-a.T)};}
 if(k==='jar'){const soil=v[0]/4000,T=v[1]/10000;return {T,other:soil,mass:Math.max(0,v[2]),f:Math.max(0,v[2])/300,state:v[2]>1e-7?'흙에 물이 남음':'흙의 물이 마름',q:3*(soil-T)};}
 const m=s.barrels*5000,a=m?iceState(v[1],m):{T:null,f:0},T=v[0]/120000;return {T,other:a.T,mass:m,f:a.f,state:m?(a.f===1?'물통의 물':a.f===0?'물통의 얼음':'물과 얼음'):'물통 없음',q:m?15*s.barrels*(a.T-T):0};
}
function saturation(T){return .61094*Math.exp(17.625*T/(T+243.04));}
function rates(e,dt){const s=e.s,a=stateOf(e);if(['lauric','boil','freeze'].includes(s.scene))return {v:[a.q],external:a.q};if(s.scene==='melt')return {v:[a.q,-a.q],external:0};if(s.scene==='jar'){const soil=a.other,dm=s.wet&&s.porous?Math.min(Math.max(0,e.v[2])/dt,.004*Math.max(0,saturation(soil)-.3*saturation(35))):0,qs=2*(35-soil),qi=.3*(35-a.T),exchange=3*(a.T-soil),evap=dm*2430;return {v:[qs+exchange-evap,qi-exchange,-dm],external:qs+qi-evap};}const wall=4*(-10-a.T);return {v:[wall+a.q,-a.q],external:wall};}
function advance(e,dt){const a=rates(e,dt),mid={...e,t:e.t+dt/2,v:e.v.map((v,i)=>v+a.v[i]*dt/2)},b=rates(mid,dt);e.v=e.v.map((v,i)=>v+b.v[i]*dt);e.external+=b.external*dt;e.t+=dt;if(Math.abs(e.t-Math.round(e.t))<1e-7)e.t=Math.round(e.t);if(e.s.scene==='jar'&&e.v[2]<1e-12)e.v[2]=0;const r=stateOf(e);if(e.s.scene==='boil'&&r.T===100&&e.boilAt==null)e.boilAt=e.t;if(e.s.scene==='boil'&&r.mass===0){const max=(33*CW+42)*(100-25.2)+33*LV,over=e.v[0]-max;e.v[0]=max;e.external-=over;e.stopped=true;}}
function sample(e){const a=stateOf(e);return {minutes:e.t/60,T:a.T,other:a.other,f:a.f,mass:a.mass};}
let sim,previous=null,book,message;const groups={};const rows=i=>book.rows.filter(r=>r._mission===i);
function rewind(l){if(sim&&sim.t>0)previous=sim.s.scene===l.state.scene?{scene:sim.s.scene,power:sim.s.power,path:sim.path.map(x=>({...x}))}:null;sim=createRun(l.state);for(const [k,g]of Object.entries(groups))g.style.display=k===l.state.scene?'':'none';}
function configure(l,s){Object.assign(l.state,s);l.rewind();}
function step(dt,l){sim.acc+=dt*(life(sim.s)?600:30);const h=life(sim.s)?1:.1;while(sim.acc>=h&&sim.t<limit(sim.s)&&!sim.stopped){sim.acc-=h;advance(sim,h);const interval=life(sim.s)?600:sim.s.scene==='lauric'?30:sim.s.scene==='boil'?120:60;if(sim.t-sim.path.at(-1).minutes*60>=interval-1e-7)sim.path.push(sample(sim));}if(sim.t>=limit(sim.s)||sim.stopped){l.setRunning(false);l.update();}}

 sceneNote:'실험은 재생 1초가 30초, 생활 장면은 10분입니다. 그래프는 계산한 모형 온도입니다. 교과서 측정값의 점들을 그대로 연결한 그래프가 아닙니다. 생활 장치의 수치는 설명용 가정입니다.',
 assumptions:['물질 안의 온도는 고르다고 가정합니다. 상태가 바뀌는 동안에도 열에너지가 드나듭니다.','물은 일정한 기압에서 끓고 수증기는 열린 플라스크 밖으로 나갑니다. 불을 세게 해도 끓는 동안의 온도는 같습니다.','얼음을 녹이는 주변 물도 식습니다. 한제의 온도는 일정하게 유지된다고 가정합니다.','항아리는 덥고 건조한 곳에 있습니다. 흙의 물이 마르거나 벽이 막히면 증발 냉각이 멈춥니다.','창고의 물통은 물이 얼며 열을 내놓습니다. 영원히 따뜻하게 만드는 장치는 아닙니다. 학습 온도계만 최대 0.2 ℃ 흔들립니다.'],
 teacher:`<h4>교과서와 범위</h4><p>비상교육 p.112–113, 135–149, 153. 로르산 30초 기록, 물 100 mL 플라스크의 약 1/3·2분 기록, 한제 얼음:소금=3:1·약 −21 ℃, 얼음 녹이는 주변 물, 항아리·과일 창고를 연결합니다. 녹는점·끓는점의 정의, 양에 따른 온도 상승 비교, 과냉각은 기본 활동에서 다루지 않습니다.</p><h4>엔진 (중학교 범위 밖)</h4><p>엔탈피 구간별 온도와 상태 비율을 계산하고 열전달률을 중점법으로 적분합니다. 화살표 길이는 같은 장면에서 열전달률에 비례하며, 장면마다 표시 배율이 달라 서로 다른 장면의 길이를 직접 비교하지 않습니다. 로르산 10 g, 잠열 180 J/g, 시료와 시험관의 유효 열용량 40 J/K, K=40×0.17/60 W/K, 주변 20 ℃입니다. 60.5 ℃에서 시작하여 응고 중 43.9 ℃. 물 가열은 33 g·비열 4.187 J/(g K)·유리 42 J/K, P=28/33/60 W, 가열판 지연 90초, 주변 25 ℃·K=0.3 W/K. 100 ℃에서 남는 열을 2257 J/g로 나누어 기화량을 구합니다. 액체가 모두 기화하면 멈춥니다. 모형 맞춤값으로 교과서 실제 측정값과 조금 다릅니다.</p><p>얼리기/녹이기는 물 20 g, 물/얼음 비열 4.187/2.1, 유리 20 J/K, 잠열 334 J/g. 얼리기는 처음 20 ℃·주변 −21 ℃·K=0.4 W/K. 녹이기는 얼음 −18 ℃, 주변 물 200 g·30 ℃·K=0.5 W/K. 두 계가 주고받는 열은 반대 부호이며 에너지 합이 보존됩니다.</p><p>항아리는 바깥 35 ℃·상대습도 30%, 흙/내부 유효 열용량 4000/10000 J/K. 바깥–흙/흙–내부/바깥–내부 K=2/3/0.3 W/K. 처음 물 300 g, 증발율 0.004×max[p포화(T흙)−0.3p포화(35),0] g/s, 기화열 2430 J/g. Magnus 포화 압력 근사, 물이 줄어도 흙 고체가 지배하는 유효 열용량은 일정하다고 근사합니다. 실제 지역의 습도·바람·일사·재료별 성능을 보정한 값이 아닙니다.</p><p>창고 처음 5 ℃, 밤 −10 ℃, 방 유효 열용량 120000 J/K, 외벽 K=4 W/K. 물통당 물 5 kg·열전달 15 W/K. 물이 얼 때 방으로 들어오는 열과 물통에서 나가는 열을 함께 계산합니다. 실험 DT=0.1초, 생활 1초, 그래프 간격 로르산 30초·가열 물 120초·기타 실험 60초·생활 600초. 온도 센서는 물 높이의 중간을 따라 배치한 이상적 측정입니다. 장치 그림은 단면 도해이며 물 높이를 실제 부피 눈금으로 읽지 않습니다.</p><h4>생활 설계</h4><p>물의 증발로 주변에서 열을 흡수하는 항아리는 p.153 고흡수성 수지 냉각 집과 연결할 수 있습니다. 수지는 물을 담아 두는 재료이며, 언제나 냉각 시간이 2~3배라는 보편적인 수치를 만들지 않습니다. 얼음주머니는 융해 때 주변에서 열을 흡수하고, 물통·손난로의 응고는 주변에 열을 내놓는 예입니다. 에어컨·히트 파이프·드라이아이스 포장은 같은 개념의 생활 자료로 연결하며 실제 제품 성능은 계산하지 않습니다.</p>`,
