'use strict';
Explorer.start({"id":"body-systems","title":"먹은 물질과 들이마신 산소는 어디서 만날까?","unit":"동물과 에너지","subject":"life","codes":["9과13-01","9과13-02","9과13-04","9과13-05"],"core":"소화·호흡·순환·배설은 세포가 에너지를 얻고 노폐물을 내보내는 과정으로 연결된다.","observation":true,"controls":[{"key":"substance","label":"추적할 물질","options":[["food","녹말의 소화 산물"],["oxygen","산소"],["co2","이산화 탄소"],["urea","요소"]],"value":"food"},{"key":"view","label":"보는 방법","options":[["route","물질의 이동"],["circulation","혈액의 순환"]],"value":"route"}],"outputs":[{"key":"route","label":"이동 경로","numeric":false},{"key":"role","label":"과정의 의미","numeric":false}],"evaluate":s=>({route:s.view==='circulation'?'우심실 → 폐 → 좌심방 → 좌심실 → 온몸 → 우심방':{food:'입·소장 등에서 소화 → 소장 흡수 → 혈액 → 세포',oxygen:'폐포 → 혈액 → 심장 → 온몸의 세포',co2:'세포 → 혈액 → 심장 → 폐포 → 몸 밖',urea:'간에서 생성 → 혈액 → 콩팥 → 오줌 → 몸 밖'}[s.substance],role:{food:'녹말은 아밀레이스 등의 소화를 거쳐 흡수 가능한 작은 물질이 됩니다.',oxygen:'세포호흡에 쓰이며 혈액이 운반합니다.',co2:'세포호흡으로 생기며 폐를 통해 나갑니다.',urea:'소화되지 않은 찌꺼기와 다른 대사 노폐물입니다.'}[s.substance]}),"rule":"기관계 사이 물질 이동을 대표 경로로 단순화. 소장흡수혈류에서 간문맥 경유 등은 그림에 생략하되 직접 전신으로 연결되는 해부 도해로 주장하지 않는다. 폐순환과 체순환은 이어진 폐쇄 순환.","limit":"구조를 나란히 펼친 경로도이며 실제 기관의 위치·크기·이동 시간은 아닙니다. 세부 혈관은 생략했습니다.","prompt":"물질마다 들어오고 나가는 기관을 바꾸어 보세요. 폐동맥도 심장에서 나가는 혈관입니다.","challenge":{"title":"배설과 배변 구별하기","text":"요소의 물질 이동을 선택해 기록하세요.","check":s=>s.substance==='urea'&&s.view==='route'},"conclusion":"산소와 소화 산물은 혈액을 통해 {세포로|대장으로만} 이동합니다. 요소를 오줌으로 내보내는 것은 {배설|배변}입니다.","quiz":[{"kind":"적용","question":"동맥은 언제나 산소가 많은 혈액인가요?","options":["항상 그렇습니다.","동맥은 심장에서 나가는 방향으로 구별합니다.","동맥은 혈액이 없습니다."],"answer":1,"feedback":["폐동맥을 생각해 보세요.","폐동맥에는 산소가 적은 혈액이 흐릅니다.","혈액이 흐릅니다."]},{"kind":"적용","question":"소화와 세포호흡의 관계는?","options":["위가 모든 에너지를 직접 만듭니다.","둘은 연결되지 않습니다.","소화로 얻은 영양소가 세포호흡에 쓰입니다."],"answer":2,"feedback":["온몸의 세포에서 에너지를 얻습니다.","기관계는 연결됩니다.","산소와 영양소가 세포에 공급됩니다."]}],"caption":(s,v)=>s.view==='circulation'?'폐순환과 체순환은 이어집니다.':'물질별 이동을 이어서 보세요.',"describe":(s,v)=>v.route+'입니다. '+v.role,"draw":function draw(p,s,v,m){const labels=s.view==='circulation'?['오른 심장','폐','왼 심장','온몸']:({food:['소화관','소장 흡수','혈액','세포'],oxygen:['폐포','혈액','심장','세포'],co2:['세포','혈액','폐포','몸 밖'],urea:['간','혈액','콩팥','몸 밖']})[s.substance];p.flow(labels);if(m){if(s.view==='circulation')p.path([[810,335],[810,410],[150,410],[150,335]],'#a06470',4);p.text(480,110,s.view==='circulation'?'심장을 중심으로 두 순환을 이어 봅니다.':'화살표는 선택한 물질의 이동입니다.',24);p.text(480,440,'경로의 길이는 실제 이동 거리와 다릅니다.',21);}},"state":{"substance":"food","view":"route"},"measure":"route","answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["구조를 나란히 펼친 경로도이며 실제 기관의 위치·크기·이동 시간은 아닙니다. 세부 혈관은 생략했습니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
