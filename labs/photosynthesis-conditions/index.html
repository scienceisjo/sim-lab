'use strict';
Explorer.start({"id":"photosynthesis-conditions","title":"빛만 세게 하면 계속 더 잘될까?","unit":"식물과 에너지","subject":"life","codes":["9과12-01"],"core":"광합성을 비교하려면 빛·이산화 탄소 등 조건을 통제하며 부족한 요인이 결과를 제한할 수 있다.","observation":true,"controls":[{"key":"light","label":"빛의 조건","options":[["dark","빛 없음"],["weak","약한 빛"],["strong","충분한 빛"]],"value":"dark"},{"key":"carbon","label":"이산화 탄소","options":[["absent","공급 없음"],["limited","제한된 공급"],["enough","충분한 공급"]],"value":"enough"}],"outputs":[{"key":"result","label":"광합성의 조건 해석","numeric":false}],"evaluate":s=>({result:s.light==='dark'?'빛이 없어 광합성이 일어나지 않습니다.':s.carbon==='absent'?'CO₂ 공급이 없어 지속적인 광합성이 어렵습니다.':s.light==='weak'?'빛이 제한 요인이 될 수 있습니다.':s.carbon==='limited'?'빛을 늘려도 CO₂가 제한 요인이 될 수 있습니다.':'다른 조건도 적절하면 광합성이 활발할 수 있습니다.'}),"rule":"광합성에 필요한 입력과 제한 요인을 정성적으로 비교. 온도·식물종·물 공급은 적절하고 같다고 가정. 무CO₂는 저장CO₂를 사용한 일시반응 이후 지속과정을 뜻한다. 광합성량·기포수를 실제측정처럼 생성하지 않는다.","limit":"실제 광합성 속도를 예측하지 않는 조건 모형입니다. 충분한 빛도 과도한 강광을 뜻하지 않습니다. 호흡은 별도로 계속 일어납니다.","prompt":"CO₂ 조건을 고정하고 빛만 바꾸세요. 빛이 충분할 때도 다른 조건을 확인하세요.","challenge":{"title":"빛 외의 제한 요인","text":"충분한 빛과 제한된 CO₂ 공급을 선택해 기록하세요.","check":s=>s.light==='strong'&&s.carbon==='limited'},"conclusion":"광합성을 비교할 때 조사하지 않는 조건은 {같게 둡니다|함께 바꿉니다}. 빛이 충분해도 다른 요인이 광합성을 {제한할 수 있습니다|절대로 제한하지 않습니다}.","quiz":[{"kind":"적용","question":"산소 기포 수로 광합성을 비교할 때 필요한 것은?","options":["측정 시간과 식물 양 등 조건을 같게 둡니다.","측정 시간을 매번 다르게 합니다.","물 온도는 어떤 값이어도 무관합니다."],"answer":0,"feedback":["공정한 비교를 설계합니다.","시간이 다르면 직접 비교하기 어렵습니다.","온도도 영향을 줍니다."]},{"kind":"적용","question":"어둠 속 식물의 에너지 과정은?","options":["호흡도 반드시 멈춥니다.","광합성이 멈춰도 호흡은 계속될 수 있습니다.","CO₂ 없이 양분이 무한히 생깁니다."],"answer":1,"feedback":["호흡과 광합성을 구별합니다.","저장 양분을 사용할 수 있습니다.","재료와 에너지가 필요합니다."]}],"caption":(s,v)=>v.result,"describe":(s,v)=>v.result,"draw":function draw(p,s,v,m){p.line(480,420,480,210,'#428961',13);p.ellipse(420,280,85,40,'#76b27a');p.ellipse(540,340,85,40,'#76b27a');p.circle(160,170,40,s.light==='dark'?'#a5afb7':'#e4b94f');if(m){if(s.light!=='dark')p.arrow(205,195,380,260,'#d8b54c',s.light==='strong'?9:3);if(s.carbon!=='absent')p.arrow(800,250,600,290,'#5c94bf',s.carbon==='enough'?9:3);p.text(780,185,'CO₂ 공급',25);p.text(480,455,'화살표 굵기는 단계 구별이며 측정값이 아닙니다.',19);}},"state":{"light":"dark","carbon":"enough"},"measure":"result","answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["실제 광합성 속도를 예측하지 않는 조건 모형입니다. 충분한 빛도 과도한 강광을 뜻하지 않습니다. 호흡은 별도로 계속 일어납니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
</script></body></html>
