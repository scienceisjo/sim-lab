'use strict';
Explorer.start({"id":"cell-organization","title":"세포의 구조는 하는 일과 어떻게 연결될까?","unit":"생물의 구성과 다양성","subject":"life","codes":["9과02-01","9과02-02"],"core":"세포의 구조와 기능을 연결하고 세포에서 개체까지의 구성 단계를 비교한다.","observation":true,"controls":[{"key":"sample","label":"세포 표본","options":[["leaf","잎의 광합성 세포"],["root","뿌리 세포"],["animal","동물의 일반 세포"],["nerve","신경세포"],["red","성숙한 사람 적혈구"]],"value":"leaf"},{"key":"level","label":"보는 범위","options":[["cell","세포 확대"],["system","개체 안의 구성"]],"value":"cell"}],"outputs":[{"key":"structures","label":"주요 구조","numeric":false},{"key":"function","label":"기능과 연결","numeric":false}],"evaluate":s=>({structures:s.sample==='red'?'세포막이 있고 핵과 미토콘드리아가 없습니다.':['leaf','root'].includes(s.sample)?'세포벽·세포막·핵·미토콘드리아'+(s.sample==='leaf'?'·엽록체':''):'세포막·핵·미토콘드리아',function:{leaf:'엽록체에서 광합성이 일어납니다.',root:'엽록체가 없어도 살아 있는 식물 세포입니다.',animal:'여러 구조가 함께 생명 활동에 관여합니다.',nerve:'긴 돌기로 다른 세포와 신호를 주고받습니다.',red:'오목하고 유연한 모양이 산소 운반에 알맞습니다.'}[s.sample]}),"rule":"대표적인 진핵세포 구조를 비교. 성숙한 사람 적혈구 예외 명시. 식물: 세포→조직→조직계→기관→개체, 동물: 세포→조직→기관→기관계→개체. 상대 크기·개수는 실제 세포 측정값이 아니다.","limit":"대표적인 세포 모형입니다. 모든 식물 세포에 엽록체가 있는 것은 아니며, 적혈구의 설명은 성숙한 사람 적혈구에 한합니다.","prompt":"잎과 뿌리, 일반 동물 세포와 적혈구를 비교하세요.","challenge":{"title":"엽록체 없는 식물 세포","text":"뿌리 세포를 확대해 관찰하고 기록하세요.","check":s=>s.sample==='root'&&s.level==='cell'},"conclusion":"뿌리 세포는 엽록체가 없어도 {식물 세포입니다|동물 세포입니다}. 세포의 구조는 기능과 {관련됩니다|무관합니다}.","quiz":[{"kind":"적용","question":"모든 식물 세포가 광합성하나요?","options":["식물 세포에는 반드시 엽록체가 있습니다.","엽록체가 없는 뿌리 세포도 있습니다.","뿌리는 세포로 되어 있지 않습니다."],"answer":1,"feedback":["세포 역할에 따라 다릅니다.","구조와 기능을 연결하세요.","뿌리도 세포로 구성됩니다."]},{"kind":"적용","question":"세포와 기관의 관계는?","options":["기관 하나가 언제나 세포 하나입니다.","세포는 기관 밖에만 있습니다.","세포가 조직을 이루고 조직들이 기관을 이룹니다."],"answer":2,"feedback":["여러 세포가 함께 구성합니다.","기관은 세포로 이루어집니다.","구성 단계가 이어집니다."]}],"caption":(s,v)=>v.function,"describe":(s,v)=>v.structures+' '+v.function,"draw":function draw(p,s,v,m){if(s.level==='system'){p.flow(['세포','조직',...(['leaf','root'].includes(s.sample)?['조직계','기관']:['기관','기관계']),'개체']);p.text(480,395,'부분이 모여 서로 연결되어 일합니다.',23);return;}const plant=['leaf','root'].includes(s.sample);if(s.sample==='nerve'){p.path([[440,290],[810,290]],'#a89cc7',18);for(let i=0;i<4;i++)p.line(340,270,150,130+i*90,'#a89cc7',9);}if(plant)p.box(285,110,350,340,'#deedd7','#78a166');if(plant)p.box(294,119,332,322,'#e7e5f5','#768faa');else p.ellipse(460,280,180,140,s.sample==='red'?'#e29898':'#e7e5f5','#768faa');if(s.sample==='red'){p.ellipse(460,280,95,55,'#efc2c2');return;}if(m){p.circle(425,270,42,'#9f87c1');p.text(425,270,'핵',22,'white');for(let i=0;i<3;i++)p.ellipse(385+i*65,365,20,10,'#d59b67');if(s.sample==='leaf')for(let i=0;i<4;i++)p.ellipse(355+i*64,188,20,11,'#579d69');p.text(750,180,plant?'세포벽이 있습니다.':'세포벽은 없습니다.',19);p.text(750,245,s.sample==='leaf'?'엽록체가 있습니다.':'엽록체는 없습니다.',19);p.text(745,365,'미토콘드리아',19);p.line(580,360,645,360,'#9b795b',2);}},"state":{"sample":"leaf","level":"cell"},"measure":"structures","answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["대표적인 세포 모형입니다. 모든 식물 세포에 엽록체가 있는 것은 아니며, 적혈구의 설명은 성숙한 사람 적혈구에 한합니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
