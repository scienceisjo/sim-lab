'use strict';
Explorer.start({"id":"radiation-balance","title":"받는 에너지와 나가는 에너지가 달라지면?","unit":"날씨와 기후변화","subject":"earth","codes":["9과17-01"],"core":"복사 평형은 들어오는 에너지와 나가는 에너지의 균형이며 온실효과는 지표 복사의 흡수·재방출과 관련된다.","controls":[{"key":"absorption","label":"대기의 지표 복사 흡수 비율","min":0,"max":1,"step":0.1,"unit":"","value":0.8},{"key":"albedo","label":"태양빛 반사 비율","min":0.1,"max":0.5,"step":0.1,"unit":"","value":0.3}],"outputs":[{"key":"surface","label":"평형 지표 온도","unit":"℃","digits":1,"noise":0},{"key":"incoming","label":"흡수한 태양 에너지","unit":"W/m²","digits":1,"noise":0},{"key":"outgoing","label":"우주로 나가는 에너지","unit":"W/m²","digits":1,"noise":0}],"measure":"surface","evaluate":s=>{const incoming=1361*(1-s.albedo)/4;return{surface:Math.pow(incoming/(5.670374419e-8*(1-s.absorption/2)),.25)-273.15,incoming,outgoing:incoming};},"rule":"태양상수1361 W/m², 전지구 평균 /4, 지표흑체·대기단층회색모형. 대기는 태양빛 투명, 지표IR 흡수율 ε. 대기 위아래 같은 복사, σTs⁴=Q/(1−ε/2). 평형 TOA유출=유입. 대류·수증기피드백·구름·해양 생략. 수치 지구 예측 아님.","limit":"대기를 한 층으로 놓은 단순 평형 모형입니다. 손잡이는 실제 이산화 탄소 농도가 아니며 실제 지구의 기온 예측값이 아닙니다.","prompt":"반사 비율은 같게 두고 대기의 흡수를 늘려 보세요. 평형에 도달한 온도를 비교합니다.","challenge":{"title":"대기의 흡수가 없는 비교 모형","text":"대기 흡수 0, 반사 비율 0.3에서 기록하세요.","check":s=>s.absorption===0&&Math.abs(s.albedo-.3)<1e-8},"conclusion":"온실효과는 주로 지표의 복사를 대기가 {흡수·재방출|거울처럼만 반사}하는 과정입니다. 새 평형에서는 우주로 나가는 양과 들어오는 양이 {같습니다|계속 다릅니다}.","quiz":[{"kind":"적용","question":"평형 온도가 높아졌는데 에너지가 영원히 쌓이나요?","options":["새 평형에서 유입과 유출이 다시 같습니다.","영원히 무한히 쌓입니다.","태양이 없어집니다."],"answer":0,"feedback":["과도 과정과 새 평형을 구별합니다.","온도가 올라가면 방출도 달라집니다.","유입이 유지됩니다."]},{"kind":"적용","question":"온실효과와 오존층 파괴는 같은 원리인가요?","options":["완전히 같습니다.","복사 에너지와 자외선 흡수의 다른 현상입니다.","대기가 전혀 관여하지 않습니다."],"answer":1,"feedback":["다른 현상입니다.","관여하는 빛과 과정이 다릅니다.","둘 다 대기와 관련되지만 구별해야 합니다."]}],"caption":(s,v)=>'새 평형의 지표 온도는 '+v.surface.toFixed(1)+' ℃입니다.',"describe":(s,v)=>`평형 ${v.surface.toFixed(1)} ℃, 유입과 유출 각각 ${v.incoming.toFixed(1)} W/m²입니다.`,"draw":function draw(p,s,v,m){p.box(75,355,810,95,'#c7dac4');p.box(75,170,810,45,'#d1e4f1');p.text(175,405,'지표',25);p.text(175,140,'대기 한 층',23);if(m){p.arrow(320,90,320,345,'#e0b038',8);const upward=v.incoming/(1-s.absorption/2);p.arrow(480,345,480,220,'#d56c5b',upward/30);if(s.absorption>0)p.arrow(610,215,610,345,'#d56c5b',s.absorption*upward/60);p.arrow(750,170,750,85,'#d56c5b',v.outgoing/30);p.text(415,465,'주황은 태양빛, 붉은색은 지표·대기의 복사입니다.',20);}},"state":{"absorption":0.8,"albedo":0.3},"answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["대기를 한 층으로 놓은 단순 평형 모형입니다. 손잡이는 실제 이산화 탄소 농도가 아니며 실제 지구의 기온 예측값이 아닙니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
