<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>폐가 공기를 밀어 넣는 걸까? · CLICK SCIENCE</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../_kit/kit.css"><style>.rd{gap:12px;align-items:start}.rd>span{flex:0 0 28%}.rd b{overflow-wrap:anywhere;max-width:68%}.lab-panel a.abtn{display:block;text-decoration:none;text-align:center}.record-axes[hidden]{display:none}</style></head><body><script src="../_kit/kit.js"></script><script src="../_kit/explorer.js"></script><script>
'use strict';
Explorer.start({"id":"breathing-model","title":"폐가 공기를 밀어 넣는 걸까?","unit":"동물과 에너지","subject":"life","codes":["9과13-03"],"core":"가로막과 갈비뼈 운동에 따른 가슴 공간 변화가 압력 차이를 만들고 공기가 이동한다.","observation":true,"controls":[{"key":"phase","label":"호흡 단계","options":[["inhale","들이쉬는 동안"],["rest","이동이 멈춘 때"],["exhale","내쉬는 동안"]],"value":"inhale"},{"key":"view","label":"관찰 표현","options":[["body","몸의 모형"],["bottle","병과 고무막 모형"]],"value":"body"}],"outputs":[{"key":"pressure","label":"폐 안팎 압력 비교","numeric":false},{"key":"air","label":"공기의 이동","numeric":false}],"evaluate":s=>({pressure:s.phase==='inhale'?'안쪽이 바깥보다 조금 낮습니다.':s.phase==='exhale'?'안쪽이 바깥보다 조금 높습니다.':'안팎 압력이 같습니다.',air:s.phase==='inhale'?'바깥에서 폐 안으로 들어옵니다.':s.phase==='exhale'?'폐에서 바깥으로 나갑니다.':'순이동이 없습니다.'}),"rule":"호흡 과정의 대표 세 단계. 폐가 스스로 근육으로 팽창한다고 묘사하지 않는다. 풍선–병 모형의 고무막은 가로막에 대응하나 병 벽은 갈비뼈의 운동을 재현하지 않는다. 정량 압력·부피는 제공하지 않는다.","limit":"병 모형의 딱딱한 벽은 실제 갈비뼈 운동을 보여 주지 못합니다. 실제 가로막은 둥근 돔 모양입니다.","prompt":"몸의 모형과 병 모형에서 닮은 점과 다른 점을 비교하세요.","challenge":{"title":"들이쉬는 순간 설명하기","text":"몸의 모형에서 들이쉬는 동안을 관찰하고 기록하세요.","check":s=>s.phase==='inhale'&&s.view==='body'},"conclusion":"들이쉴 때 가슴 공간은 {커집니다|작아집니다}. 공기는 압력이 상대적으로 {낮은 쪽으로|높은 쪽으로} 이동합니다.","quiz":[{"kind":"적용","question":"폐 자체가 근육처럼 수축해 공기를 빨아들이나요?","options":["가로막 등 호흡 근육이 공간과 압력을 바꿉니다.","폐가 전부 근육 펌프입니다.","공기는 압력과 무관하게 움직입니다."],"answer":0,"feedback":["주변 구조의 운동을 연결합니다.","폐 자체의 능동 수축으로 설명하지 않습니다.","압력 차이를 봅니다."]},{"kind":"적용","question":"병 모형의 한계는?","options":["아무 한계가 없습니다.","병 벽은 갈비뼈 운동을 보여 주지 못합니다.","공기의 존재를 가정하지 않습니다."],"answer":1,"feedback":["실제 몸과 다른 점을 살펴보세요.","대응과 한계를 함께 봅니다.","풍선에도 공기가 있습니다."]}],"caption":(s,v)=>v.air,"describe":(s,v)=>v.pressure+' '+v.air,"draw":function draw(p,s,v,m){const a=s.phase==='inhale'?1.2:s.phase==='exhale'?.8:1;p.box(290,100,380,340,'#e9edf4','#798c9d');p.path([[480,75],[480,195],[410,240]],'#8f9dba',14);p.line(480,195,550,240,'#8f9dba',14);p.ellipse(403,290,65*a,95*a,'#dfb1b5');p.ellipse(557,290,65*a,95*a,'#dfb1b5');const h=s.phase==='inhale'?435:s.phase==='exhale'?365:400;p.path(Array.from({length:51},(_,i)=>[300+i*7.2,h-(s.view==='body'?45:0)*Math.sin(i*Math.PI/50)]),'#5b7ca0',6);if(m){if(s.phase!=='rest')p.arrow(730,s.phase==='inhale'?115:240,730,s.phase==='inhale'?240:115,'#3987b4',7);p.text(180,330,'가로막',22);p.line(225,350,320,h,'#8a9bad',2);p.text(770,365,s.phase==='inhale'?'공간이 커집니다.':s.phase==='exhale'?'공간이 작아집니다.':'압력이 같습니다.',20);}},"state":{"phase":"inhale","view":"body"},"measure":"pressure","answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["병 모형의 딱딱한 벽은 실제 갈비뼈 운동을 보여 주지 못합니다. 실제 가로막은 둥근 돔 모양입니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
</script></body></html>
