.399,r=Math.sqrt((i+.5)/280);let x,y;if(s.object==='cluster'){x=480+150*r*Math.cos(a);y=275+150*r*Math.sin(a);}else if(s.view==='face'){x=480+320*r*Math.cos(a);y=275+160*r*Math.sin(a);}else if(s.view==='edge'){x=480+350*r*Math.cos(a);y=275+28*r*Math.sin(a);}else{x=65+(i*71)%830;y=275+50*Math.sin(a)*r;}p.circle(x,y,1.5+(i%3)*.6,'#d7e0e9');}if(s.object==='galaxy'&&s.view!=='inside')p.ellipse(480,275,65,s.view==='face'?40:32,'#d7cdb1');}if(m&&s.object==='galaxy'){p.circle(s.view==='inside'?480:650,275,6,'#e0b455');p.text(680,420,s.view==='inside'?'은하수 띠를 관찰합니다.':'태양계는 중심 밖에 있습니다.',20,'#e5edf5');}},"state":{"view":"face","object":"galaxy"},"measure":"structure","answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["별 수와 밝기·거리·나선팔 모양은 실제 측량도가 아닙니다. 은하수 띠의 개념을 보여 주는 모형입니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
