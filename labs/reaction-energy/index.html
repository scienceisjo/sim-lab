Explorer.start({temperatureColor:true,"id":"reaction-energy","title":"반응할 때 주변은 따뜻해질까?","unit":"화학 반응의 규칙성","subject":"chem","codes":["9과16-06"],"core":"발열 반응은 주변으로 에너지를 전달하고 흡열 반응은 주변에서 에너지를 받는다.","controls":[{"key":"reaction","label":"반응의 종류","options":[["release","발열 반응 모형"],["absorb","흡열 반응 모형"]],"value":"release"},{"key":"amount","label":"반응한 양의 배수","min":1,"max":3,"step":1,"unit":"배","value":1},{"key":"water","label":"주변 물의 질량","min":100,"max":300,"step":100,"unit":"g","value":100}],"outputs":[{"key":"temperature","label":"주변 물의 온도","unit":"℃","digits":2,"noise":0.03},{"key":"heat","label":"주변이 받은 열","unit":"J","digits":0,"noise":0}],"measure":"temperature","repeat":true,"evaluate":s=>{const heat=(s.reaction==='release'?1:-1)*420*s.amount;return{heat,temperature:20+heat/(4.2*s.water)};},"rule":"실제 반응물 데이터가 아닌 명시적 열량계 모형. 반응 1단위당 주변으로 ±420 J, 물 비열 4.2 J/(g·℃), 외부 열손실 없음. ΔT=Q/(mc). 물의 상태 변화 없음.","limit":"특정 화학 물질의 실제 반응열이 아닙니다. 반응과 주변 사이 에너지 이동을 비교하는 열량계 모형입니다.","prompt":"반응과 주변을 나누어 보세요. 화살표가 어느 쪽으로 향하나요?","challenge":{"title":"주변에서 열을 받는 반응","text":"흡열 반응 2배, 물 100 g에서 세 번 기록하고 주변 온도를 살펴보세요.","check":s=>s.reaction==='absorb'&&s.amount===2&&s.water===100},"conclusion":"발열 반응에서 주변 물의 온도는 {높아집니다|낮아집니다}. 흡열 반응은 주변의 열에너지를 {받습니다|내보냅니다}.","quiz":[{"kind":"적용","question":"흡열 반응에서 주변 물이 차가워진 까닭은?","options":["차가움이라는 물질이 나왔습니다.","에너지가 사라졌습니다.","주변의 에너지가 반응 쪽으로 전달됐습니다."],"answer":2,"feedback":["열은 물질이 아닙니다.","계와 주변을 합쳐 에너지를 따집니다.","이동 방향을 봅니다."]},{"kind":"적용","question":"온도 변화가 작으면 항상 반응열도 작나요?","options":["주변 물의 양 등 조건도 확인해야 합니다.","항상 그렇습니다.","물의 질량은 아무 영향이 없습니다."],"answer":0,"feedback":["같은 열도 물이 많으면 온도 변화가 작습니다.","비교 조건이 필요합니다.","열용량이 달라집니다."]}],"caption":(s,v)=>'반응과 주변을 합쳐 에너지를 생각합니다.',"describe":(s,v)=>`주변이 받은 열은 ${v.heat} J, 물의 온도는 ${v.temperature.toFixed(2)} ℃입니다.`,"draw":function draw(p,s,v,m){p.box(100,135,270,265,'#ede5fa');p.box(580,135,270,265,m?Thermal.tint(v.temperature):'#dceefa');p.text(235,250,'반응하는 물질',27);p.text(715,240,'주변의 물',27);p.text(715,305,v.temperature.toFixed(2)+' ℃',32);if(m){if(v.heat>0)p.arrow(380,260,565,260,'#d48622',7);else p.arrow(565,260,380,260,'#d48622',7);p.text(477,325,Math.abs(v.heat)+' J',20);}p.text(480,443,'물질 이동이 아닌 에너지 전달입니다.',21);},"state":{"reaction":"release","amount":1,"water":100},"answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["특정 화학 물질의 실제 반응열이 아닙니다. 반응과 주변 사이 에너지 이동을 비교하는 열량계 모형입니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
