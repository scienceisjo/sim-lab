<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>어느 은하에서 보아도 멀어질까? · CLICK SCIENCE</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../_kit/kit.css"><style>.rd{gap:12px;align-items:start}.rd>span{flex:0 0 28%}.rd b{overflow-wrap:anywhere;max-width:68%}.lab-panel a.abtn{display:block;text-decoration:none;text-align:center}.record-axes[hidden]{display:none}</style></head><body><script src="../_kit/kit.js"></script><script src="../_kit/explorer.js"></script><script>
'use strict';
Explorer.start({"id":"expanding-space","title":"어느 은하에서 보아도 멀어질까?","unit":"별과 우주","subject":"earth","codes":["9과15-02","9과15-03"],"core":"공간의 팽창 모형에서는 은하 사이 거리가 늘어나며 특정 은하를 팽창 중심으로 정할 수 없다.","controls":[{"key":"scale","label":"공간의 늘어난 비율","min":1,"max":2,"step":0.1,"unit":"배","value":1.5},{"key":"observer","label":"기준 은하","options":[["A","은하 A"],["B","은하 B"],["C","은하 C"]],"value":"A"}],"outputs":[{"key":"AB","label":"A–B 거리","unit":"모형 단위","digits":2,"noise":0},{"key":"AC","label":"A–C 거리","unit":"모형 단위","digits":2,"noise":0},{"key":"BC","label":"B–C 거리","unit":"모형 단위","digits":2,"noise":0}],"measure":"AB","evaluate":s=>({AB:2*s.scale,AC:Math.sqrt(13)*s.scale,BC:3*s.scale}),"rule":"은하좌표 A(0,0), B(2,0), C(2,3). 모든 좌표차에 척도a를 곱하고 관측자 위치를 뺀다. 세 거리모두 a배. 은하 자체 크기는 고정. 팽창 속도법칙·적색편이는 교육범위밖이라 제시하지 않는다. 은하는 별·성간물질의 거대집단, 성운·성단과 구별.","limit":"우주 전체를 평면에 펼친 모형입니다. 종이의 가장자리와 그림의 중심은 실제 우주의 끝이나 중심이 아닙니다. 은하 자체 크기는 늘리지 않습니다.","prompt":"기준 은하를 바꾸고, 서로의 거리가 어떻게 달라지는지 비교하세요.","challenge":{"title":"다른 은하에서 보기","text":"기준 은하 B, 늘어난 비율 2배에서 기록하세요.","check":s=>s.observer==='B'&&s.scale===2},"conclusion":"공간이 팽창하면 은하 사이 거리는 {늘어납니다|모두 같습니다}. 기준 은하를 바꿔도 하나를 특별한 중심이라고 {할 수 없습니다|해야 합니다}.","quiz":[{"kind":"적용","question":"이 모형에서 은하 그림 자체를 함께 키우지 않는 까닭은?","options":["은하 사이 거리 변화와 은하 자체 팽창은 다르기 때문입니다.","은하에 별이 없기 때문입니다.","우주의 가장자리만 늘기 때문입니다."],"answer":0,"feedback":["국소적으로 묶인 계와 공간 팽창을 구별합니다.","은하는 많은 별을 포함합니다.","가장자리 팽창 모형이 아닙니다."]},{"kind":"적용","question":"성운과 성단의 구별은?","options":["모두 태양계 행성입니다.","성운은 성간 기체·먼지, 성단은 별의 집단입니다.","성단은 항상 별 하나입니다."],"answer":1,"feedback":["태양계보다 큰 별 관련 구조입니다.","은하 안의 다양한 구조를 구별합니다.","여러 별의 집단입니다."]}],"caption":(s,v)=>'기준 은하 '+s.observer+'에서도 같은 거리 비를 비교합니다.',"describe":(s,v)=>`A–B ${v.AB}, A–C ${v.AC.toFixed(2)}, B–C ${v.BC} 모형단위입니다.`,"draw":function draw(p,s,v,m){const coords={A:[0,0],B:[2,0],C:[2,3]},o=coords[s.observer],pos=Object.fromEntries(Object.entries(coords).map(([k,[x,y]])=>[k,[480+(x-o[0])*s.scale*22,270-(y-o[1])*s.scale*22]]));p.box(35,70,890,400,'#132a40');if(m)for(const [a,b]of [['A','B'],['A','C'],['B','C']])p.line(...pos[a],...pos[b],'#497295',2,[5,6]);for(const [k,[x,y]]of Object.entries(pos)){p.ellipse(x,y,15,7,'#b7cce1');p.circle(x,y,4,k===s.observer?'#f3cc62':'#edf2fa');p.text(x,y+30,k,20,k===s.observer?'#f3cc62':'#e4edf5');}},"state":{"scale":1.5,"observer":"A"},"answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["우주 전체를 평면에 펼친 모형입니다. 종이의 가장자리와 그림의 중심은 실제 우주의 끝이나 중심이 아닙니다. 은하 자체 크기는 늘리지 않습니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
