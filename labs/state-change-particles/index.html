const syringe=s=>s.phase==='gas'?20/s.press:20;
function changeValue(s){const d=CHANGES[s.change],f=s.changed/N;return {volume:(1-f)*d.v0+f*d.v1,from:N-s.changed,to:s.changed,mass:1};}
function bagValue(hot){const air=30*1.999/(R*293.15),acetone=.79/58.0791;return {volume:hot?2000*acetone/(acetone+air):1,pressure:hot?(acetone+air)*R*333.15/2:30,mass:266.1,air,acetone};}
const exp={stage:'before',owner:null,mode:null,before:false,dew:0,dewOwner:null};let message;const books={},parts={};const rows=(k,i)=>books[k].rows.filter(r=>r._mission===i);
function refresh(l){for(const [k,v]of Object.entries(parts))v.style.display=k===l.state.scene?'':'none';}

function action(l,what){if(l.state.scene==='bag'){if(what==='warm'&&exp.stage==='before'){exp.stage='bath';exp.owner=l.mi;exp.mode=l.mode;}else if(what==='out'&&exp.stage==='bath')exp.stage='wet';else if(what==='wipe'&&exp.stage==='wet')exp.stage='dry';}else if(l.state.scene==='dew'){if(what==='cold'){exp.dew=1;exp.dewOwner=l.mi;}if(what==='collect'&&exp.dew===1)exp.dew=2;if(what==='paper'&&exp.dew===2){exp.dew=3;if(l.mi===5&&exp.dewOwner===5)l.complete(5);}}l.update();}
function record(l){const s=l.state;if(s.scene==='syringe')books.compress.add({phase:s.phase,press:s.press,volume:syringe(s)});
 if(s.scene==='change'){if(l.mi===2&&l.prediction==null){message.textContent='먼저 예상을 고르세요.';return;}const v=changeValue(s);books.change.add({...v,change:s.change,changed:s.changed,visible:l.modelVisible,pred:l.prediction!=null});}
 if(s.scene==='bag'){if(!['before','dry'].includes(exp.stage)){message.textContent='중탕에서 꺼낸 뒤 겉의 물기를 닦고 재세요.';return;}if(exp.stage==='before'){exp.before=true;exp.owner=l.mi;exp.mode=l.mode;}if(exp.stage==='dry'&&(exp.owner!==l.mi||exp.mode!=='learn'||!exp.before)){message.textContent='이 미션에서 처음부터 기화 전 질량을 먼저 재세요.';return;}const b=bagValue(exp.stage==='dry');books.bag.add({stage:exp.stage,volume:b.volume,mass:+l.measure('bag',b.mass,{amplitude:.04,fresh:true}).toFixed(2),count:N});}}

function makeCloud(n,w,h){let seed=509;const rng=()=>{seed=(1664525*seed+1013904223)>>>0;return seed/4294967296;};const ps=[];while(ps.length<n){const p={x:6+rng()*(w-12),y:6+rng()*(h-12),vx:35*(rng()-.5),vy:35*(rng()-.5)};if(ps.every(q=>Math.hypot(p.x-q.x,p.y-q.y)>11))ps.push(p);}return {ps,w,h,acc:0,last:0};}
function advanceCloud(e,dt){e.acc+=dt;while(e.acc>=1/120){e.acc-=1/120;for(const p of e.ps){p.x+=p.vx/120;p.y+=p.vy/120;wall(p,e);}for(let i=0;i<e.ps.length;i++)for(let j=i+1;j<e.ps.length;j++){const p=e.ps[i],q=e.ps[j],dx=q.x-p.x,dy=q.y-p.y,r=Math.hypot(dx,dy);if(r>0&&r<10){const nx=dx/r,ny=dy/r,ov=(10-r)/2,v=(q.vx-p.vx)*nx+(q.vy-p.vy)*ny;p.x-=nx*ov;p.y-=ny*ov;q.x+=nx*ov;q.y+=ny*ov;if(v<0){p.vx+=v*nx;p.vy+=v*ny;q.vx-=v*nx;q.vy-=v*ny;}}}e.ps.forEach(p=>wall(p,e));}}
function wall(p,e){for(const [k,v,m]of [['x','vx',e.w],['y','vy',e.h]]){if(p[k]<5){p[k]=5;p[v]=Math.abs(p[v]);}if(p[k]>m-5){p[k]=m-5;p[v]=-Math.abs(p[v]);}}}

 sceneNote:'입자 창은 배열과 이동을 설명하는 도해입니다. 고체는 진동, 액체·기체는 탄성 원판으로 단순화하며 실제 분자 간 인력은 계산하지 않습니다. 상태 창의 확대율과 실제 부피 눈금은 다릅니다. 변한 양 슬라이더는 시간이 아닙니다.',
 assumptions:['고체와 액체는 잘 압축되지 않는 성질을 부피가 일정한 모형으로 나타냅니다. 공기는 같은 온도로 천천히 누릅니다.','대표 입자 40개로 같은 물질의 양을 나타냅니다. 상태가 바뀌어도 각 표지의 크기·질량은 같습니다. 온도색은 같은 온도에서 같습니다.','상태 변화 창은 알맞은 조건에서 변한 양을 고르는 관찰 단면입니다. 실제 변화 속도를 예측하지 않습니다.','아세톤은 밀봉한 주머니와 단단한 바깥 장치 전체를 잽니다. 물기를 닦고 같은 바깥 환경에서 잽니다.','흰 김은 작은 액체 물방울입니다. 수증기와 이산화 탄소 기체 자체는 눈에 보이지 않습니다.'],
 teacher:`<h4>교과서</h4><p>비상교육 p.121–134. p.122–125 세 상태·압축·입자, p.126 얼음과 드라이아이스 주머니, p.127 응축수 확인, p.128 여섯 변화, p.130–132 닫힌 장치의 질량과 부피입니다. 열에너지 출입·온도 곡선은 다음 실험실로 분리합니다. 과자·이쑤시개 입자 모형(p.125)은 실물 활동으로 연결합니다.</p><h4>정량 모형 (중학교 범위 밖)</h4><p>주사기 처음 20 mL, 압력 비 1–2, 등온 이상 기체 V=20/압력비. 고체·액체는 비압축성 근사입니다. 상태 변화는 물질 1 g, 각 상 질량비로 부피를 합합니다. 물/얼음 0 ℃ 밀도 0.99987/0.917 g/mL, 물 100 ℃ 0.95865 g/mL, 드라이아이스 약 1.56 g/mL. 수증기는 100 ℃, CO₂는 −78.5 ℃, 각각 1기압에서 이상 기체 V=nRT/P를 사용합니다. 실제 포화증기의 부피와 약간 다를 수 있는 근사입니다. 부피 막대는 같은 변화에서 같은 눈금을 쓰지만 두 입자 창의 확대율은 서로 다릅니다. 물이 얼면 부피가 증가합니다. 대표 표지의 배열은 물의 분자 구조 자체가 아닙니다.</p><p>아세톤 1 mL=0.79 g 근사, 분자량 58.0791, 바깥 장치 2 L. 처음 20 ℃·주머니 밖 공기 30 kPa. 충분히 데워 60 ℃가 되면 아세톤 기체와 바깥 공기의 압력이 같고 각 몰수는 보존됩니다. V주머니=2 L×n아세톤/(n아세톤+n공기). 기화 전후 장치 총 질량은 266.1 g입니다. NIST Antoine 식으로 구한 아세톤 포화 증기압은 20 ℃에서 24.604 kPa, 60 ℃에서 114.963 kPa입니다. 처음 30 kPa에서는 액체, 최종 52.915 kPa에서는 기체로 두는 끝 상태가 이 조건과 맞습니다. 이상적인 얇고 유연한 밀봉 주머니, 장치 외피 부피·외부 부력 일정, 측정 때 외피는 기준 환경이라는 가정입니다. 실제 장치 건조 시간·누설·저울 열대류는 생략합니다.</p><h4>그림과 측정</h4><p>고체는 고정 자리의 작은 진동, 액체·기체 표시층은 같은 질량의 탄성 원판 충돌·벽 반사, DT=1/120초로 자리를 옮깁니다. 실제 분자 간 인력을 재현한 액체 분자 동역학은 아닙니다. 변한 양을 입력하므로 스스로 상전이가 발생하는 계산이라고 주장하지 않습니다. 기체 사이에 공기를 채우지 않습니다. 크기 비교를 강제 상한으로 잘라 실제 부피라고 표시하지 않고 계산 부피를 별도로 읽습니다. 학습 저울에만 ±0.04 g, 모형 수치·입자 수는 동일합니다.</p><p>시계 접시와 지시약은 절차와 물질 확인을 위한 정성 장면입니다. 응축 속도나 지시약 반응량은 계산하지 않습니다. 물방울 수를 분자 수처럼 세지 않습니다.</p><h4>물성 확인 자료</h4><p><a href="https://www.usgs.gov/water-science-school/science/water-density">USGS 물의 밀도</a>, <a href="https://webbook.nist.gov/cgi/cbook.cgi?ID=C67641&Mask=4">NIST 아세톤</a>, <a href="https://www.airgas.com/msds/001091.pdf">Airgas 드라이아이스 물성</a>. 물성 정량식은 학생 기본 화면에 요구하지 않습니다.</p>`,

 {kind:'찾아내기',title:'상태가 달라져도 같은 물질',text:'관찰 결과를 정리하세요.',sentence:'같은 물질이 상태 변화할 때 입자의 종류와 수는 {그대로이고|바뀌고}, 부피는 {변할 수 있습니다|항상 같습니다}. 물이 얼면 부피는 {늘어납니다|줄어듭니다}. 하얀 김은 {액체 물방울입니다|수증기 자체입니다}.',blanks:[0,0,0,0]}
