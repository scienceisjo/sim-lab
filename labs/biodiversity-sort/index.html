<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>닮았다는 이유만으로 같은 무리일까? · CLICK SCIENCE</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../_kit/kit.css"><style>.rd{gap:12px;align-items:start}.rd>span{flex:0 0 28%}.rd b{overflow-wrap:anywhere;max-width:68%}.lab-panel a.abtn{display:block;text-decoration:none;text-align:center}.record-axes[hidden]{display:none}</style></head><body><script src="../_kit/kit.js"></script><script src="../_kit/explorer.js"></script><script>
'use strict';
Explorer.start({"id":"biodiversity-sort","title":"닮았다는 이유만으로 같은 무리일까?","unit":"생물의 구성과 다양성","subject":"life","codes":["9과02-03","9과02-04","9과02-05"],"core":"생물은 세포와 영양 방식 등의 근거로 분류하며 같은 종 안에도 변이가 있다.","observation":true,"controls":[{"key":"organism","label":"관찰 대상","options":[["bacteria","세균"],["amoeba","아메바"],["mushroom","버섯"],["bean","강낭콩"],["cat","고양이"]],"value":"bacteria"},{"key":"evidence","label":"관찰 기준","options":[["cell","세포"],["nutrition","양분 얻기"],["variation","같은 종의 변이"]],"value":"cell"}],"outputs":[{"key":"kingdom","label":"5계 분류","numeric":false},{"key":"evidenceText","label":"관찰 근거","numeric":false}],"evaluate":s=>({kingdom:{bacteria:'원핵생물계',amoeba:'원생생물계',mushroom:'균계',bean:'식물계',cat:'동물계'}[s.organism],evidenceText:s.evidence==='cell'?({bacteria:'뚜렷한 핵막이 없는 단세포입니다.',amoeba:'핵이 있는 단세포입니다.',mushroom:'핵과 세포벽이 있고 엽록체는 없습니다.',bean:'핵과 세포벽이 있고 광합성 조직이 있습니다.',cat:'핵이 있고 세포벽은 없습니다.'}[s.organism]):s.evidence==='nutrition'?({bacteria:'종에 따라 양분을 얻는 방법이 다릅니다.',amoeba:'먹이를 세포 안으로 들여옵니다.',mushroom:'유기물을 분해해 양분을 흡수합니다.',bean:'광합성으로 양분을 만듭니다.',cat:'다른 생물을 먹어 양분을 얻습니다.'}[s.organism]):'같은 종의 개체 사이에도 특징의 차이가 있습니다.'}),"rule":"교육과정에 지정된 5계 모형. 세균의 영양 방식은 다양하다. 같은 종의 변이는 종류가 새로 생겼다는 뜻이 아니다. 생물학적 종 개념은 유성생식 생물에서 적용 한계가 있다.","limit":"대표 표본으로 5계를 비교합니다. 생물학적 종 개념을 세균 같은 무성생식 생물에 그대로 적용하지 않습니다.","prompt":"겉모습 대신 세포와 양분 얻는 방법을 근거로 비교하세요.","challenge":{"title":"버섯을 식물과 구별하기","text":"버섯의 양분 얻기를 관찰하여 기록하세요.","check":s=>s.organism==='mushroom'&&s.evidence==='nutrition'},"conclusion":"버섯은 광합성하는 식물 대신 {균계|식물계}에 속합니다. 같은 종 안의 특징 차이를 {변이|멸종}라고 합니다.","quiz":[{"kind":"적용","question":"같은 종의 고양이 털 색이 다르면?","options":["모두 다른 계입니다.","변이일 수 있습니다.","한쪽은 생물이 아닙니다."],"answer":1,"feedback":["색 하나로 계를 나누지 않습니다.","종 안에서도 차이가 있습니다.","둘 다 생물입니다."]},{"kind":"적용","question":"생물다양성 보전에 도움이 되는 것은?","options":["서식지를 다양하게 보전합니다.","한 종만 남깁니다.","모든 서식지를 같게 만듭니다."],"answer":0,"feedback":["여러 생물의 살아갈 조건을 지킵니다.","종 다양성이 줄어듭니다.","서로 다른 생물의 조건을 없앨 수 있습니다."]}],"caption":(s,v)=>v.kingdom+'의 특징을 관찰합니다.',"describe":(s,v)=>v.evidenceText,"draw":function draw(p,s,v,m){const names=['세균','아메바','버섯','강낭콩','고양이'],ids=['bacteria','amoeba','mushroom','bean','cat'];ids.forEach((id,i)=>{const x=110+i*185;p.box(x-65,150,130,215,s.organism===id?'#d8eddf':'#edf2f7',s.organism===id?'#428260':undefined);if(id==='mushroom'){p.box(x-10,244,20,65,'#c1aa86');p.ellipse(x,244,45,25,'#b57561');}else if(id==='bean'){p.line(x,315,x,220,'#41875c',7);p.ellipse(x-20,240,26,15,'#68a16b');p.ellipse(x+20,266,26,15,'#68a16b');}else if(id==='cat'){p.circle(x,254,40,'#d2ac78');p.path([[x-35,227],[x-25,200],[x-10,218],[x+10,218],[x+25,200],[x+35,227]],'#b58b59',5);}else p.ellipse(x,252,40,25,id==='bacteria'?'#9ecdb6':'#b2a4ce');p.text(x,396,names[i],23);});if(m)p.text(480,95,'세포 · 양분 · 변이를 근거로 분류합니다.',24);},"state":{"organism":"bacteria","evidence":"cell"},"measure":"kingdom","answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["대표 표본으로 5계를 비교합니다. 생물학적 종 개념을 세균 같은 무성생식 생물에 그대로 적용하지 않습니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
</script></body></html>
