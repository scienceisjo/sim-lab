<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>지구가 움직이면 하늘은 어떻게 보일까? · CLICK SCIENCE</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../_kit/kit.css"><style>.rd{gap:12px;align-items:start}.rd>span{flex:0 0 28%}.rd b{overflow-wrap:anywhere;max-width:68%}.lab-panel a.abtn{display:block;text-decoration:none;text-align:center}.record-axes[hidden]{display:none}</style></head><body><script src="../_kit/kit.js"></script><script src="../_kit/explorer.js"></script><script>
'use strict';
Explorer.start({"id":"earth-sky","title":"지구가 움직이면 하늘은 어떻게 보일까?","unit":"태양계","subject":"earth","codes":["9과07-03"],"core":"지구 자전의 반대 방향으로 하늘이 겉보기 운동하며 공전하면 한밤중에 보는 먼 배경 방향이 달라진다.","controls":[{"key":"rotation","label":"지구의 자전 각","min":0,"max":360,"step":30,"unit":"°","value":0},{"key":"orbit","label":"지구의 공전 위치","min":0,"max":330,"step":30,"unit":"°","value":0}],"outputs":[{"key":"apparent","label":"별의 겉보기 회전각","unit":"°","digits":0,"noise":0},{"key":"midnight","label":"한밤중 배경 방향","unit":"°","digits":0,"noise":0}],"measure":"apparent","evaluate":s=>({apparent:-s.rotation,midnight:s.orbit}),"rule":"북극 위에서 내려다본 2D 좌표. 공전 위치 e=(cosθ,sinθ); 한밤중 바깥 방향은 태양→지구 방향 θ. 자전+φ에 대해 관측자 좌표의 먼별각은 −φ. 360°는 같은 방향. 위도별 일주운동·황도좌표·계절 온도는 다루지 않는다.","limit":"북극 위에서 본 공간 모형입니다. 원 밖의 별 표지는 실제 별자리 모양이나 거리를 나타내지 않습니다.","prompt":"공전 위치는 그대로 두고 자전만 바꾸세요. 다음에는 자전 각을 두고 공전 위치를 바꾸세요.","challenge":{"title":"반년 뒤의 한밤중","text":"공전 위치 180°, 자전 각 0°를 놓고 기록하세요.","check":s=>s.orbit===180&&s.rotation===0},"conclusion":"지구 자전 때문에 별은 반대 방향으로 {도는 것처럼 보입니다|실제로 하루에 지구를 돕니다}. 계절별 별자리 차이는 지구의 {공전|매일의 기온}과 관련됩니다.","quiz":[{"kind":"적용","question":"별이 하루 동안 움직여 보이는 주된 이유는?","options":["지구의 자전입니다.","우주 전체가 하루에 팽창하기 때문입니다.","달의 그림자 때문입니다."],"answer":0,"feedback":["관측자가 움직입니다.","현상의 시간 척도와 원인이 다릅니다.","식과 별의 운동은 다릅니다."]},{"kind":"적용","question":"한밤중에 보는 배경 별이 계절마다 다른 이유는?","options":["별들이 계절마다 사라집니다.","공전하며 밤쪽으로 바라보는 방향이 바뀝니다.","별빛이 매번 멈춥니다."],"answer":1,"feedback":["보는 방향을 생각하세요.","태양 반대쪽 방향을 비교합니다.","관측 방향이 달라집니다."]}],"caption":(s,v)=>'우주에서의 운동과 관측자의 시점을 구별하세요.',"describe":(s,v)=>`자전 ${s.rotation}°에 겉보기 회전 ${v.apparent}°, 한밤중 배경 방향 ${v.midnight}°입니다.`,"draw":function draw(p,s,v,m){const a=s.orbit*Math.PI/180,x=300+145*Math.cos(a),y=280-145*Math.sin(a);p.circle(300,280,145,'#f1f5f9','#b4c7d9');p.circle(300,280,28,'#e5ae46');p.circle(x,y,20,'#427bb4');for(let i=0;i<4;i++){const b=i*Math.PI/2;p.text(300+205*Math.cos(b),280-175*Math.sin(b),'배경 '+(i+1),20);}if(m){p.arrow(x,y,x+65*Math.cos(a),y-65*Math.sin(a),'#367cbb');p.circle(735,280,60,'#437eb4');const b=s.rotation*Math.PI/180;p.arrow(735,280,735+95*Math.cos(b),280-95*Math.sin(b),'#da8456');p.text(735,113,'관측자 방향',23);p.text(735,425,'별의 겉보기 각 '+v.apparent+'°',20);}},"state":{"rotation":0,"orbit":0},"answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["북극 위에서 본 공간 모형입니다. 원 밖의 별 표지는 실제 별자리 모양이나 거리를 나타내지 않습니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
</script></body></html>
