'use strict';
Explorer.start({"id":"electrical-energy","title":"같은 시간 켜면 같은 에너지를 쓸까?","unit":"전기와 자기","subject":"phys","codes":["9과14-03"],"core":"소비 전력은 에너지 전환의 빠르기를 나타내며 같은 시간에도 사용하는 에너지가 다를 수 있다.","controls":[{"key":"power","label":"소비 전력","options":[[10,"10 W 장치"],[20,"20 W 장치"],[40,"40 W 장치"]],"value":10},{"key":"time","label":"작동 시간","min":0,"max":60,"step":10,"unit":"s","value":30}],"outputs":[{"key":"energy","label":"전환한 에너지","unit":"J","digits":0,"noise":0},{"key":"meaning","label":"관찰 해석","numeric":false}],"measure":"energy","evaluate":s=>({energy:s.power*s.time,meaning:'같은 시간에 전력이 큰 장치가 더 많은 에너지를 전환합니다.'}),"rule":"일정 소비전력 P의 이상장치 E=Pt 내부 계산. 소비전력 정량계산을 미션·퀴즈에서 요구하지 않고 같은시간에너지전환량비교. 효율과 밝기는 별개, 광효율 동일가정하지않음.","limit":"작동 중 전력이 일정하다고 가정합니다. 전력이 크다는 것만으로 밝기나 효율이 높다고 단정하지 않습니다.","prompt":"시간을 같게 두고 전력만 바꾸어 에너지 막대를 비교하세요.","challenge":{"title":"같은 시간으로 공정하게 비교하기","text":"40 W 장치를 30초 사용한 상태로 기록하세요.","check":s=>s.power===40&&s.time===30},"conclusion":"같은 시간에 소비 전력이 크면 전환한 에너지는 {많습니다|항상 같습니다}. 소비 전력만으로 효율을 {단정할 수 없습니다|정확히 알 수 있습니다}.","quiz":[{"kind":"적용","question":"10 W와 20 W 장치를 같은 시간 쓰면?","options":["20 W 장치가 더 많은 에너지를 사용합니다.","항상 같은 에너지를 씁니다.","10 W가 무조건 더 밝습니다."],"answer":0,"feedback":["전환의 빠르기를 비교합니다.","전력 차이가 있습니다.","밝기와 효율은 별도입니다."]},{"kind":"적용","question":"전기를 아끼는 방법을 판단할 때는?","options":["전력만 보고 시간은 무시합니다.","사용 시간과 필요한 기능·효율을 함께 봅니다.","전류가 모두 사라지는지 봅니다."],"answer":1,"feedback":["시간도 중요합니다.","같은 필요를 만족시키는 조건을 비교합니다.","전하 보존과 에너지 전환을 구별합니다."]}],"caption":(s,v)=>'작동 시간 '+s.time+'초 동안의 에너지입니다.',"describe":(s,v)=>`${s.power} W, ${s.time}초에서 ${v.energy} J가 전환됩니다.`,"draw":function draw(p,s,v,m){p.box(120,160,240,250,'#e8edf5','#7893ad');p.circle(240,270,50,'#ead295');p.text(240,355,s.power+' W',30);if(m){p.bar(500,235,'전환한 에너지',v.energy,2400,'#d6a142',' J');p.text(665,345,'같은 눈금으로 비교합니다.',20);p.arrow(385,275,475,275,'#c39849',5);}},"state":{"power":10,"time":30},"answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["작동 중 전력이 일정하다고 가정합니다. 전력이 크다는 것만으로 밝기나 효율이 높다고 단정하지 않습니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
