<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>어떤 성질로 나눌 수 있을까? · CLICK SCIENCE</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../_kit/kit.css"><style>.rd{gap:12px;align-items:start}.rd>span{flex:0 0 28%}.rd b{overflow-wrap:anywhere;max-width:68%}.lab-panel a.abtn{display:block;text-decoration:none;text-align:center}.record-axes[hidden]{display:none}</style></head><body><script src="../_kit/kit.js"></script><script src="../_kit/explorer.js"></script><script>
'use strict';
Explorer.start({"id":"mixture-separation","title":"어떤 성질로 나눌 수 있을까?","unit":"물질의 특성","subject":"chem","codes":["9과08-02","9과08-03"],"core":"혼합물은 성분의 크기·용해·끓는 성질 차이를 이용해 분리한다.","observation":true,"controls":[{"key":"mixture","label":"혼합물","options":[["sand","소금물과 모래"],["water","소금물"],["liquids","물과 에탄올"]],"value":"sand"},{"key":"method","label":"분리 방법","options":[["filter","거르기"],["evaporate","증발시키기"],["distill","증류하기"]],"value":"filter"}],"outputs":[{"key":"result","label":"분리 결과","numeric":false},{"key":"reason","label":"이용한 차이","numeric":false}],"evaluate":s=>({result:s.method==='filter'?(s.mixture==='sand'?'모래가 거름종이에 남습니다.':'녹은 성분은 함께 통과합니다.'):s.method==='evaporate'?(s.mixture==='sand'?'모래와 소금이 함께 남습니다.':s.mixture==='water'?'소금이 남고 물은 흩어집니다.':'두 액체가 모두 증발합니다.'):(s.mixture==='liquids'?'에탄올이 더 많은 액체를 받습니다.':'수증기를 식혀 물을 받습니다.'),reason:s.method==='filter'?'거름종이를 통과하는지 비교합니다.':s.method==='evaporate'?'증발하는 성분을 구별합니다.':'끓는 성질 차이와 응결을 이용합니다.'}),"rule":"정성적 분리 모형. 거르기는 용해된 이온을 거르지 못한다. 단순 증류의 물–에탄올 수집액은 순수 에탄올이 아니다. 분리 효율·온도·순도 수치를 임의로 만들지 않는다.","limit":"장치를 단순화했습니다. 물과 에탄올의 단순 증류로 완전히 순수한 에탄올을 얻지는 못합니다.","prompt":"받는 액체와 남는 물질을 함께 살펴보세요.","challenge":{"title":"물을 회수하는 방법","text":"소금물에서 물을 받아 모으는 방법을 선택하고 모형을 기록하세요.","check":s=>s.mixture==='water'&&s.method==='distill'},"conclusion":"소금물의 녹은 소금은 거름종이를 {통과합니다|통과하지 못합니다}. 증류에서 기체를 식히면 {액체로 모입니다|새 원소가 됩니다}.","quiz":[{"kind":"적용","question":"소금물을 거르면 소금이 남나요?","options":["소금만 남습니다.","물만 남습니다.","녹은 소금도 물과 함께 통과합니다."],"answer":2,"feedback":["녹은 입자는 거름종이 구멍보다 작습니다.","물도 통과합니다.","거르기와 증발을 구별합니다."]},{"kind":"적용","question":"혼합물을 분리하면 반드시 새 물질이 생기나요?","options":["성분의 성질 차이를 이용하며 새 물질 생성이 필수는 아닙니다.","항상 화학 반응이 필요합니다.","모든 혼합물은 같은 방법으로 분리합니다."],"answer":0,"feedback":["성분의 특성을 이용합니다.","물리적 방법으로도 분리합니다.","성분에 따라 방법을 고릅니다."]}],"caption":(s,v)=>v.reason,"describe":(s,v)=>v.result,"draw":function draw(p,s,v,m){p.box(90,210,180,170,'#cce3f3','#7891a5');p.text(180,425,'혼합물');if(s.method==='filter'){p.line(365,185,495,185);p.line(365,185,430,290);p.line(495,185,430,290);p.box(365,330,150,85,'#cce3f3');if(m){p.circle(400,209,9,'#a78756');p.circle(430,231,9,'#a78756');p.arrow(430,290,430,330);}}else{p.box(355,200,150,180,'#cce3f3','#7891a5');p.text(430,419,'가열합니다.');if(s.method==='distill'){p.path([[485,225],[565,145],[720,245],[720,320]],'#56a8ca',12);p.box(650,320,150,100,'#b6dcf3');if(m)p.arrow(570,167,667,231,'#7955bb');}else if(m)p.arrow(430,190,430,110,'#7955bb');}if(m)p.text(480,80,'성분은 방법에 따라 다른 곳으로 이동합니다.',23);},"state":{"mixture":"sand","method":"filter"},"measure":"result","answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["장치를 단순화했습니다. 물과 에탄올의 단순 증류로 완전히 순수한 에탄올을 얻지는 못합니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
</script></body></html>
