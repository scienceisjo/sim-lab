<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>겉색이 비슷해도 같은 광물일까? · CLICK SCIENCE</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../_kit/kit.css"><style>.rd{gap:12px;align-items:start}.rd>span{flex:0 0 28%}.rd b{overflow-wrap:anywhere;max-width:68%}.lab-panel a.abtn{display:block;text-decoration:none;text-align:center}.record-axes[hidden]{display:none}</style></head><body><script src="../_kit/kit.js"></script><script src="../_kit/explorer.js"></script><script>
'use strict';
Explorer.start({"id":"mineral-tests","title":"겉색이 비슷해도 같은 광물일까?","unit":"지권의 변화","subject":"earth","codes":["9과09-02"],"core":"색만으로 광물을 확정하지 않고 굳기·조흔색·염산 반응·자성 등 여러 근거를 비교한다.","observation":true,"controls":[{"key":"mineral","label":"광물","options":[["quartz","석영"],["calcite","방해석"],["magnetite","자철석"],["hematite","적철석"]],"value":"quartz"},{"key":"test","label":"검사 방법","options":[["streak","조흔색"],["scratch","석영과 방해석 비교"],["acid","묽은 염산"],["magnet","자석"]],"value":"streak"}],"outputs":[{"key":"result","label":"관찰 결과","numeric":false}],"evaluate":s=>({result:s.test==='streak'?{quartz:'조흔색은 흰색입니다.',calcite:'조흔색은 흰색입니다.',magnetite:'조흔색은 검은색입니다.',hematite:'조흔색은 적갈색입니다.'}[s.mineral]:s.test==='scratch'?s.mineral==='quartz'?'석영은 방해석에 흠집을 냅니다.':s.mineral==='calcite'?'방해석은 석영에 흠집을 내지 못합니다.':'이 비교는 석영과 방해석으로 합니다.':s.test==='acid'?s.mineral==='calcite'?'기포가 발생합니다.':'뚜렷한 기포가 보이지 않습니다.':s.mineral==='magnetite'?'자석에 잘 끌립니다.':'이 모형에서 뚜렷이 끌리지 않습니다.'}),"rule":"대표 순수 표본의 정성적 광물 검사. 석영7,방해석3의 상대굳기만 비교. 조흔색과 표면색은 다를 수 있다. 실제 표본 불순물·혼합 광물·약한 자성 차이 생략.","limit":"대표 표본의 특징입니다. 실제 암석은 여러 광물이 섞일 수 있으며 한 검사만으로 모든 광물을 확정할 수 없습니다.","prompt":"검사를 하나씩 바꾸어 근거를 모으세요. 실제 염산 실험은 교사의 안전 지도를 받아야 합니다.","challenge":{"title":"흰색 조흔을 더 구별하기","text":"방해석에 묽은 염산 검사를 선택하고 기록하세요.","check":s=>s.mineral==='calcite'&&s.test==='acid'},"conclusion":"같은 조흔색이어도 같은 광물이라고 {단정할 수 없습니다|단정합니다}. 석영은 방해석보다 {단단합니다|무릅니다}.","quiz":[{"kind":"적용","question":"자철석을 구별하는 데 도움이 되는 검사는?","options":["자석에 끌리는지 봅니다.","맛을 봅니다.","표본 이름만 바꿉니다."],"answer":0,"feedback":["자성은 분류 근거입니다.","광물을 맛보면 안 됩니다.","관찰 근거가 필요합니다."]},{"kind":"적용","question":"표면색과 조흔색은 항상 같은가요?","options":["언제나 같습니다.","다를 수 있어 가루의 색을 따로 봅니다.","조흔색은 무게입니다."],"answer":1,"feedback":["표면색과 가루 색은 다를 수 있습니다.","여러 특성을 비교하세요.","가루의 색입니다."]}],"caption":(s,v)=>v.result,"describe":(s,v)=>v.result,"draw":function draw(p,s,v,m){const colors={quartz:'#d4d9d8',calcite:'#e6dbc4',magnetite:'#525a62',hematite:'#7e6261'};p.path([[230,350],[180,230],[275,150],[410,200],[455,340],[330,390],[230,350]],colors[s.mineral],32);p.box(560,200,275,150,'#eef3f8','#bdc9d4');p.text(700,165,{streak:'흰 조흔판',scratch:'비교 표본',acid:'묽은 염산',magnet:'자석'}[s.test],24);if(s.test==='streak')p.line(610,265,785,295,{quartz:'#fff',calcite:'#fff',magnetite:'#242c36',hematite:'#9d4b39'}[s.mineral],15);if(s.test==='acid'&&s.mineral==='calcite')for(let i=0;i<7;i++)p.circle(600+i*25,285-(i%3)*25,8,'#d5eefa','#70a1b4');if(s.test==='magnet'){p.box(610,245,75,40,'#d48383');p.box(685,245,75,40,'#7fa9d0');}if(m)p.text(480,443,'검사 결과를 기록하고 다음 근거를 모으세요.',22);},"state":{"mineral":"quartz","test":"streak"},"measure":"result","answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["대표 표본의 특징입니다. 실제 암석은 여러 광물이 섞일 수 있으며 한 검사만으로 모든 광물을 확정할 수 없습니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
</script></body></html>
