<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>공기가 만나는 방식이 날씨를 바꿀까? · CLICK SCIENCE</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../_kit/kit.css"><style>.rd{gap:12px;align-items:start}.rd>span{flex:0 0 28%}.rd b{overflow-wrap:anywhere;max-width:68%}.lab-panel a.abtn{display:block;text-decoration:none;text-align:center}.record-axes[hidden]{display:none}</style></head><body><script src="../_kit/kit.js"></script><script src="../_kit/explorer.js"></script><script>
'use strict';
Explorer.start({"id":"weather-fronts","title":"공기가 만나는 방식이 날씨를 바꿀까?","unit":"날씨와 기후변화","subject":"earth","codes":["9과17-02","9과17-04"],"core":"고기압·저기압의 공기 이동과 전선에서 따뜻한 공기의 상승을 연결한다.","observation":true,"controls":[{"key":"scene","label":"기압과 기단","options":[["high","북반구 고기압"],["low","북반구 저기압"],["cold","한랭 전선"],["warm","온난 전선"]],"value":"high"},{"key":"view","label":"기압계의 시점","options":[["top","위에서"],["side","옆에서"]],"value":"top"}],"outputs":[{"key":"motion","label":"공기 이동","numeric":false},{"key":"weather","label":"날씨 경향","numeric":false}],"evaluate":s=>({motion:{high:'하강하며 지표 부근에서 시계 방향으로 퍼집니다.',low:'지표 부근에서 반시계 방향으로 모여 상승합니다.',cold:'찬 공기가 전진해 따뜻한 공기를 들어 올립니다.',warm:'따뜻한 공기가 찬 공기 위를 타고 오릅니다.'}[s.scene],weather:{high:'대체로 구름 형성이 억제됩니다.',low:'수증기와 상승 조건이 맞으면 구름이 발달합니다.',cold:'상대적으로 좁은 곳에서 강한 비가 내릴 수 있습니다.',warm:'비교적 넓은 곳에 지속적인 비가 내릴 수 있습니다.'}[s.scene]}),"rule":"북반구 지표 기압계의 대표 흐름. 구름과 강수를 확정하지 않는다. 전선은 지표와 전선면의 교차, 따뜻한 공기가 상승. 전향력 수식 및 일기도 작성 제외.","limit":"북반구의 대표적인 경향입니다. 실제 날씨는 수증기와 지형 등 여러 조건에 따라 달라집니다.","prompt":"기압계의 두 시점을 연결하세요. 전선은 항상 옆에서 본 단면으로 나타냅니다.","challenge":{"title":"저기압의 두 시점","text":"북반구 저기압을 옆에서 보고 기록하세요.","check":s=>s.scene==='low'&&s.view==='side'},"conclusion":"저기압 중심 부근의 공기는 대체로 {상승합니다|하강합니다}. 전선에서는 상대적으로 {따뜻한 공기|찬 공기}가 위로 올라갑니다.","quiz":[{"kind":"적용","question":"고기압이면 어떤 곳이나 무조건 맑나요?","options":["항상 비가 옵니다.","대체적 경향이며 예외 조건이 있습니다.","날씨와 전혀 관계없습니다."],"answer":1,"feedback":["대표 흐름을 보세요.","실제 조건을 함께 봅니다.","공기 흐름과 관련됩니다."]},{"kind":"적용","question":"북반구 저기압의 지표 바람은?","options":["시계 방향으로 퍼집니다.","수직으로만 움직입니다.","반시계 방향으로 모여듭니다."],"answer":2,"feedback":["고기압의 대표 흐름입니다.","수평과 수직 흐름이 연결됩니다.","지표에서 수렴하고 위로 올라갑니다."]}],"caption":(s,v)=>v.weather,"describe":(s,v)=>v.motion+' '+v.weather,"draw":function draw(p,s,v,m){const low=s.scene==='low';if(['high','low'].includes(s.scene)){if(s.view==='top'){p.circle(480,280,120,'#eef3f8','#a8bed0');p.text(480,280,low?'저':'고',45);if(m)for(let i=0;i<4;i++){const a=i*Math.PI/2,r=low?165:80,R=low?95:165,b=a+(low?.6:-.6);p.arrow(480+r*Math.cos(a),280-r*Math.sin(a),480+R*Math.cos(b),280-R*Math.sin(b),'#4c8fb9',5);}}else{p.line(100,425,860,425,'#7b968b',5);if(m){p.arrow(480,low?405:125,480,low?125:405,'#528fb3',7);p.arrow(low?160:450,380,low?450:160,380,'#528fb3',5);p.arrow(low?800:510,380,low?510:800,380,'#528fb3',5);}}}else{p.box(80,100,800,330,'#f5d9d1');const steep=s.scene==='cold';p.c.fillStyle='#c1dceb';p.c.beginPath();p.c.moveTo(80,430);p.c.lineTo(steep?450:780,430);p.c.lineTo(80,steep?80:260);p.c.fill();if(m){p.arrow(steep?490:610,370,steep?290:260,steep?150:215,'#ce7a5c',7);p.text(240,370,'찬 공기',24);p.text(680,160,'따뜻한 공기',24);}}},"state":{"scene":"high","view":"top"},"measure":"motion","answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["북반구의 대표적인 경향입니다. 실제 날씨는 수증기와 지형 등 여러 조건에 따라 달라집니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
</script></body></html>
