Explorer.start({"id":"electric-circuit","title":"전류는 전구를 지나면 줄어들까?","unit":"전기와 자기","subject":"phys","codes":["9과14-02","9과14-03"],"core":"전압과 저항이 전류를 정하며 전류는 직렬 회로에서 이어지고 병렬 회로의 가지에서 나뉜다.","animate":true,"controls":[{"key":"voltage","label":"전지 전압","min":1,"max":6,"step":1,"unit":"V","value":3},{"key":"resistance","label":"각 저항","min":5,"max":20,"step":5,"unit":"Ω","value":10},{"key":"connection","label":"연결","options":[["single","저항 하나"],["series","같은 저항 직렬"],["parallel","같은 저항 병렬"]],"value":"single"}],"outputs":[{"key":"current","label":"전지 쪽 전류","unit":"A","digits":2,"noise":0.002},{"key":"branch","label":"저항 하나의 전류","unit":"A","digits":2,"noise":0},{"key":"energy","label":"에너지 전환","numeric":false}],"measure":"current","repeat":true,"evaluate":s=>{const current=s.voltage/s.resistance*(s.connection==='series'?.5:s.connection==='parallel'?2:1);return{current,branch:s.connection==='parallel'?current/2:current,energy:'전기 에너지가 저항에서 열로 전환됩니다.'};},"rule":"이상 전지·도선, 일정 저항. 하나 R, 직렬 2R, 병렬 R/2로 내부 계산. 합성 저항 공식과 소비전력 정량 문항은 제시하지 않는다. 점은 관습적 전류 방향의 표지이며 전자의 실제 속도가 아니다.","limit":"저항은 온도에 따라 바뀌지 않는다고 가정합니다. 전구의 밝기와 저항 변화를 그대로 재현하지 않습니다.","prompt":"같은 저항 두 개의 연결을 바꾸고 전지 쪽과 가지의 전류를 비교하세요.","challenge":{"title":"가지와 전체 비교하기","text":"3 V, 각 10 Ω, 병렬연결에서 세 번 기록하세요.","check":s=>s.voltage===3&&s.resistance===10&&s.connection==='parallel'},"conclusion":"직렬 회로의 전류는 저항 앞뒤에서 {같습니다|줄어듭니다}. 병렬 회로의 전체 전류는 각 가지 전류를 {더한 값입니다|뺀 값입니다}.","quiz":[{"kind":"적용","question":"저항에서 소비되는 것은?","options":["전류 자체입니다.","전기 에너지가 다른 형태로 전환됩니다.","전자들이 모두 사라집니다."],"answer":1,"feedback":["직렬 회로의 전류는 이어집니다.","열 등으로 전환됩니다.","전하는 보존됩니다."]},{"kind":"적용","question":"전압을 같게 두고 저항을 크게 하면?","options":["전류가 작아집니다.","전류가 반드시 커집니다.","저항과 무관합니다."],"answer":0,"feedback":["같은 전압에서 흐르기 어려워집니다.","관계를 반대로 생각했습니다.","저항은 전류에 영향을 줍니다."]}],"caption":(s,v)=>'전지 쪽 '+v.current.toFixed(2)+' A · 저항 하나 '+v.branch.toFixed(2)+' A',"describe":(s,v)=>`전체 ${v.current.toFixed(2)} A, 저항 하나 ${v.branch.toFixed(2)} A입니다.`,"draw":function draw(p,s,v,m,l){const resistor=(x,y)=>p.path([[x-50,y],[x-35,y-12],[x-20,y+12],[x-5,y-12],[x+10,y+12],[x+25,y-12],[x+40,y],[x+50,y]],'#8a5f24',4);p.path([[180,260],[180,140],[780,140],[780,400],[180,400],[180,295]],'#5f7389',4);p.line(145,260,215,260,'#7d5ba6',3);p.line(160,295,200,295,'#7d5ba6',7);p.text(110,260,'+');p.text(110,295,'−');resistor(480,140);if(s.connection==='series')resistor(650,140);if(s.connection==='parallel'){p.line(300,140,300,320);p.line(660,140,660,320);p.line(300,320,660,320);resistor(480,320);}if(m){p.arrow(240,105,360,105,'#a05c2c');p.text(510,75,'전류 방향 표지');p.text(510,449,'점은 전하가 사라지지 않음을 보여 줍니다.',20);const t=l.sceneTime||0,parallel=s.connection==='parallel',start=parallel?300:230,end=parallel?660:730;for(let x=start+(t*v.branch*100)%50;x<end;x+=50){p.circle(x,140,5,'#a05c2c');if(parallel)p.circle(x,320,5,'#a05c2c');}}},"state":{"voltage":3,"resistance":10,"connection":"single"},"answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["저항은 온도에 따라 바뀌지 않는다고 가정합니다. 전구의 밝기와 저항 변화를 그대로 재현하지 않습니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
