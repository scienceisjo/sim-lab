<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>빛은 경계에서 어디로 갈까? · CLICK SCIENCE</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../_kit/kit.css"><style>.rd{gap:12px;align-items:start}.rd>span{flex:0 0 28%}.rd b{overflow-wrap:anywhere;max-width:68%}.lab-panel a.abtn{display:block;text-decoration:none;text-align:center}.record-axes[hidden]{display:none}</style></head><body><script src="../_kit/kit.js"></script><script src="../_kit/explorer.js"></script><script>
'use strict';
Explorer.start({"id":"light-paths","title":"빛은 경계에서 어디로 갈까?","unit":"빛과 파동","subject":"phys","codes":["9과10-01"],"core":"빛의 반사각은 입사각과 같고, 물질 경계를 통과할 때 방향이 바뀔 수 있다.","controls":[{"key":"angle","label":"법선에서 잰 입사각","min":0,"max":70,"step":5,"unit":"°","value":35},{"key":"surface","label":"경계","options":[["mirror","평면거울"],["water","공기에서 물로"],["glass","공기에서 유리로"]],"value":"mirror"}],"outputs":[{"key":"reflected","label":"반사각","unit":"°","digits":1,"noise":0},{"key":"transmitted","label":"굴절각 또는 거울의 반사각","unit":"°","digits":1,"noise":0.1}],"measure":"transmitted","repeat":true,"evaluate":s=>{const n={mirror:1,water:1.333,glass:1.5}[s.surface];return{reflected:s.angle,transmitted:Math.asin(Math.sin(s.angle*Math.PI/180)/n)*180/Math.PI};},"rule":"반사각=입사각. 공기 n=1, 물 n=1.333, 유리 n=1.5의 스넬 법칙으로 광선 계산. 정량 굴절 법칙은 교사용 내부 계산에만 둔다. 분산·편광·반사율은 생략.","limit":"빛의 길은 선으로 표시한 모형입니다. 선의 굵기는 밝기가 아니며 물질 속 속력의 정량 계산은 다루지 않습니다.","prompt":"각도는 표면이 아니라 법선에서 잽니다. 물질을 고정하고 입사각을 바꾸세요.","challenge":{"title":"수직으로 입사시키기","text":"공기에서 물로 들어가는 입사각을 0°로 만들고 세 번 기록하세요.","check":s=>s.surface==='water'&&s.angle===0},"conclusion":"반사각은 입사각과 {같습니다|다릅니다}. 공기에서 물로 비스듬히 들어가는 빛은 법선 쪽으로 {꺾입니다|멀어집니다}.","quiz":[{"kind":"적용","question":"입사각은 어디에서 재나요?","options":["표면에서 잽니다.","경계에 수직인 법선에서 잽니다.","빛의 끝에서만 잽니다."],"answer":1,"feedback":["표면과 잰 각은 입사각의 여각입니다.","법선을 기준으로 비교합니다.","기준 방향이 필요합니다."]},{"kind":"적용","question":"물체를 보려면 어떤 경로가 필요한가요?","options":["눈에서 물체로 빛이 나가야 합니다.","빛 없이 눈만 열면 됩니다.","물체에서 온 빛이 눈에 들어와야 합니다."],"answer":2,"feedback":["일반적인 보는 과정은 반대입니다.","눈에 들어오는 빛이 필요합니다.","광원에서 반사된 빛 또는 물체가 낸 빛을 받습니다."]}],"caption":(s,v)=>s.surface==='mirror'?'들어온 각과 반사된 각을 비교하세요.':'법선에 더 가까워지는 방향을 보세요.',"describe":(s,v)=>`입사각 ${s.angle}°, 반사각 ${v.reflected}°, ${s.surface==='mirror'?'반사':'굴절'} 방향 ${v.transmitted.toFixed(1)}°입니다.`,"draw":function draw(p,s,v,m){const a=s.angle*Math.PI/180,b=v.transmitted*Math.PI/180;p.box(60,285,840,185,s.surface==='mirror'?'#d9e1e9':'#c4e6f5');p.line(60,285,900,285,'#6b8798',4);p.arrow(480-210*Math.sin(a),285-210*Math.cos(a),480,285,'#d99012',5);p.arrow(480,285,480+210*Math.sin(a),285-210*Math.cos(a),'#e86646',4);if(s.surface!=='mirror')p.arrow(480,285,480+175*Math.sin(b),285+175*Math.cos(b),'#d99012',5);if(m){p.line(480,70,480,470,'#7e8b9b',2,[7,6]);p.text(585,90,'법선');p.text(230,100,'입사광');p.text(720,100,'반사광');if(s.surface!=='mirror')p.text(720,420,'굴절광');}},"state":{"angle":35,"surface":"mirror"},"answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["빛의 길은 선으로 표시한 모형입니다. 선의 굵기는 밝기가 아니며 물질 속 속력의 정량 계산은 다루지 않습니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
</script></body></html>
