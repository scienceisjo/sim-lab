<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>부력 · CLICK SCIENCE</title><link rel="stylesheet" href="../_kit/kit.css"><link rel="icon" href="data:,"></head><body><script src="../_kit/kit.js"></script><script>
'use strict';
const W=1.96,K=80,clamp=v=>Math.max(0,Math.min(1,v));
// Internal dimensions: each cylinder 11 cm³, height 5 cm, cup area 40 cm².
function physics(raise){
 const lift=Math.max(0,raise-200),tops=[220-lift,280-lift],bottom=520-raise,base=360-raise;
 let surface=base;for(let i=0;i<30;i++){const volume=11*tops.reduce((v,t)=>v+clamp((t+40-surface)/40),0);surface=base-volume/40*8;}
 const fractions=tops.map(t=>clamp((t+40-surface)/40)),volume=11*(fractions[0]+fractions[1]),B=volume*.0098,N=lift>0?W-B:0,T=W-B-N;
 const center=volume>0?fractions.reduce((sum,f,i)=>sum+f*(tops[i]+40-f*20),0)/(fractions[0]+fractions[1]):270;
 return {tops,bottom,surface,fractions,volume,B,N,T,center,lift,immersion:Math.round(volume/22*100),stage:volume<1e-8?'air':fractions[1]===1&&fractions[0]===0?'one':fractions[0]===1?'two':'partial'};
}
let book,msg,baseline=null;const rows=i=>book.rows.filter(r=>r._mission===i);
const stageName={air:'공기 중',one:'한 개만 잠김',two:'두 개 모두 잠김',partial:'일부분 잠김'};
function preset(l,raise){l.state.raise=raise;}
Lab.init({id:'buoyancy',version:1,title:'부력',subject:'phys',unit:'힘의 작용',grade:'중1',updated:'2026-09-27',board:{w:960,h:600},state:{raise:0,magnify:true},
 sceneNote:'고리로 이어진 추 두 개 전체에 작용하는 힘을 그립니다. 바닥의 작은 받침 사이로 물이 통합니다. 돋보기는 부력 화살표만 10배로 키운 보조 그림입니다.',
 assumptions:['각각 100 g인 추 두 개를 이어 매달았습니다. 줄과 연결 고리의 무게와 부피는 무시합니다.','컵을 천천히 움직여 정지한 상태를 비교합니다. 물결과 물의 저항은 다루지 않습니다.','추가 잠기면 수면도 올라갑니다. 모두 잠긴 뒤에는 깊이만 바꾸어도 잠긴 부피는 같습니다.','바닥이 추를 떠받치면 줄이 느슨해집니다. 작은 받침 사이로 물이 추 아래까지 통한다고 가정합니다.','학습 센서에는 최대 0.01 N 흔들림을 넣고 소수 둘째 자리로 반올림합니다. 힘 화살표는 정확한 모형값입니다.'],
 teacher:`<h4>교과서와 계산</h4><p>비상교육 중1 p.172–173. 추 두 개의 총질량 0.2 kg, 중력 1.96 N. 각 부피 11 cm³, 물 1000 kg/m³, g=9.8 m/s²로 내부 부력을 계산합니다. 한 개 잠기면 B=0.1078 N, 센서=1.8522 N이고 두 개는 B=0.2156 N, 센서=1.7444 N입니다. 학생 화면에는 밀도와 정량식을 제시하지 않습니다.</p><p>센서 표시값끼리 빼면 1.96−1.85=0.11 N, 1.96−1.74=0.22 N입니다. 교과서의 감소량 0.21 N은 원측정값 반올림 차이로 설명됩니다. 예를 들어 공기 중 1.957 N, 한 개 부력 0.107 N이라면 표시값 세 개와 감소량 0.21 N이 함께 가능합니다.</p><h4>그림·바닥 접촉</h4><p>두 추를 하나의 계로 보고 내부 연결 힘은 표시하지 않습니다. 중력은 질량 중심, 부력은 잠긴 부피의 중심, 당기는 힘은 줄 부착점, 바닥 힘은 받침 접촉점에서 시작합니다. 접촉 후에는 바닥 힘 N을 포함해 T+B+N=W이며 줄은 밀지 않습니다. 수면 높이는 잠긴 부피와 고정점 반복으로 함께 구합니다. 받침에는 물이 통하는 틈이 있어 완전히 밀착하여 물이 배제되는 경우는 다루지 않습니다.</p><h4>확대 창</h4><p>본체는 1 N=80 논리 px로 고정하고 부력 돋보기만 10배 확대합니다. 두 화살표가 별개의 힘을 뜻하지 않습니다. 실제 장치 치수의 축척 모형은 아닙니다.</p>`,
 missions:[
 {kind:'둘러보기',title:'물속에서도 위로 미는 힘 찾기',text:'컵을 천천히 올리며 추와 물, 위쪽 부력 화살표를 살펴보세요.',check:(s,l)=>l.touches>=3},
 {kind:'해 보기',title:'한 개와 두 개가 잠기면?',text:'공기 중 기준값을 먼저 기록하고, 추 한 개만 잠겼을 때와 두 개가 모두 잠겼을 때 기록하세요. 컵 높이 0·80·140을 이용할 수 있습니다.',enter:l=>preset(l,0),check:()=>['air','one','two'].every(stage=>rows(1).some(r=>r.stage===stage&&!r.floor)),ok:'센서는 약 1.96→1.85→1.74 N을 가리킵니다. 바닥에 닿지 않았다면 줄어든 값이 부력입니다.'},
 {kind:'예상',title:'모두 잠긴 뒤 더 깊이 넣으면?',text:'두 추가 모두 잠긴 뒤 컵을 조금 더 올리면 부력이 더 커질까요? 예상한 뒤 높이 140과 180에서 기록하세요.',enter:l=>preset(l,140),predict:{options:['깊어지므로 계속 커집니다.','잠긴 부피가 같으므로 같습니다.','깊어지므로 작아집니다.'],answer:1},check:()=>[140,180].every(h=>rows(2).some(r=>r.raise===h&&r.pred)),ok:'잠긴 부피가 같고 물도 같으므로 부력은 같습니다. 작은 센서 차이는 측정 흔들림입니다.'},
 {kind:'해 보기',title:'컵 바닥이 추를 받치면?',text:'높이 140에서 기록한 뒤 220까지 올려 다시 기록하세요. 줄과 바닥의 힘 화살표를 확인하세요.',enter:l=>preset(l,140),check:()=>rows(3).some(r=>r.raise===140)&&rows(3).some(r=>r.floor),ok:'바닥이 추를 떠받치면 센서는 0 N입니다. 줄어든 1.96 N 전체를 부력이라고 할 수 없습니다.'},
 {kind:'변인 고르기',title:'잠긴 정도만 바꾸어 비교하기',text:'추 두 개와 같은 물을 유지하고 잠긴 정도만 바꾸어 센서값을 비교하세요. 바닥에 닿지 않는 두 조건으로 설계하세요.',variables:{options:[['immersion','잠긴 정도'],['count','전체 추 개수'],['water','액체 종류'],['sensor','힘 센서값']],change:'immersion',keep:['count','water'],measure:'sensor',recordId:'water'},ok:'같은 추 두 개와 같은 물에서 잠긴 정도만 바꾸어 비교했습니다.'},
 {kind:'찾아내기',title:'센서가 줄어든 까닭 설명하기',text:'관찰한 힘과 측정의 조건을 정리하세요.',sentence:'물은 추를 {위로|아래로} 밀고, 가라앉는 추에도 부력이 {작용합니다|없습니다}. 바닥이 떠받칠 때 센서 감소량은 부력보다 {클 수 있습니다|항상 작습니다}.',blanks:[0,0,0]}
 ],
 quiz:[
 {kind:'진단',question:'물속으로 가라앉는 추에도 부력이 작용하나요?',options:['작용합니다. 중력이 더 큽니다.','가라앉으므로 부력은 없습니다.','중력과 같은 아래쪽으로 작용합니다.'],answer:0,feedback:['부력이 위로 작용해도 중력보다 작으면 가라앉을 수 있습니다.','뜨는 물체에만 부력이 생기는 것은 아닙니다.','부력은 중력과 반대인 위쪽입니다.']},
 {kind:'적용',question:'바닥에 닿지 않은 추의 센서값이 1.96 N에서 1.85 N으로 줄었습니다. 표시값으로 구한 부력은?',options:['1.85 N입니다.','0.11 N입니다.','1.96 N입니다.'],answer:1,feedback:['1.85 N은 센서가 당기는 힘입니다.','1.96−1.85=0.11 N입니다.','1.96 N은 공기 중 기준 무게입니다.']},
 {kind:'새 상황',question:'추가 컵 바닥에 얹혀 센서가 0 N입니다. 부력이 1.96 N이라는 결론이 맞나요?',options:['센서가 0이므로 맞습니다.','물속에서 중력이 없어졌습니다.','바닥 힘도 있어 그렇게 알 수 없습니다.'],answer:2,feedback:['바닥이 떠받치는 힘을 함께 생각해야 합니다.','물속에서도 중력은 작용합니다.','센서 감소량에 바닥이 떠받치는 효과까지 포함됩니다.']}
 ],
 setup(l){const u=l.ui;u.group('물에 담그기');u.slider({key:'raise',label:'컵을 올린 높이',min:0,max:220,step:10,unit:'',onChange:()=>{}});u.note('0에서 공기 중, 80에서 한 개, 140에서 두 개가 잠깁니다. 220에서는 바닥이 추를 떠받칩니다. 높이 숫자는 조작 눈금입니다.');u.toggle({key:'magnify',label:'부력 돋보기 보기'});
 u.group('힘 비교');u.readout({label:'잠긴 상태',get:s=>stageName[physics(s.raise).stage]});u.readout({label:'힘 센서(모형값)',get:s=>physics(s.raise).T.toFixed(2)+' N'});u.readout({label:'부력(모형값)',get:s=>physics(s.raise).B.toFixed(2)+' N'});u.readout({label:'바닥이 떠받치는 힘',get:s=>physics(s.raise).N.toFixed(2)+' N'});
 u.learnOnly(u.group('측정·기록'));u.readout({label:'힘 센서 측정값',get:(s,l)=>l.measure('sensor',physics(s.raise).T,{amplitude:.01}).toFixed(2)+' N'});u.readout({label:'공기 중 기준 측정',get:()=>baseline==null?'먼저 공기 중에서 기록하세요.':baseline.toFixed(2)+' N'});
 book=u.records({id:'water',version:1,columns:[{key:'raise',label:'컵 눈금',numeric:true,digits:0},{key:'stage',label:'잠긴 상태',format:v=>stageName[v]},{key:'immersion',label:'잠긴 정도(%)',numeric:true,digits:0},{key:'baseline',label:'공기 중 기준(N)',numeric:true},{key:'sensor',label:'센서 측정(N)',numeric:true},{key:'difference',label:'감소량(N)',numeric:true},{key:'floor',label:'바닥이 받침',numeric:true,format:v=>v?'예':'아니요'}],conditions:['raise'],measure:'sensor',x:'immersion',y:'sensor',validate:r=>{const p=physics(r.raise);return Number.isInteger(r.raise)&&r.raise>=0&&r.raise<=220&&r.count===2&&r.water==='water'&&Math.abs(r.sensor-p.T)<=.015001&&Math.abs(r.baseline-W)<=.015001&&Math.abs(r.difference-(r.baseline-r.sensor))<1e-6;}});
 msg=u.note('공기 중에서 기준값을 먼저 기록하세요. 반복 측정의 평균은 기록장에서 확인합니다.');u.button({label:'힘 센서 측정·기록',onClick:l=>{const s=l.state,p=physics(s.raise);if(l.mi===2&&l.prediction==null){msg.textContent='먼저 미션 카드에서 예상을 고르세요.';return;}if(l.mi===4&&p.N>0){msg.textContent='변인 비교는 바닥에 닿지 않은 상태에서 하세요.';return;}const sensor=+l.measure('sensor',p.T,{amplitude:.01,fresh:true}).toFixed(2);if(p.stage==='air')baseline=sensor;if(baseline==null){msg.textContent='컵 높이를 0으로 내려 공기 중 기준값을 먼저 기록하세요.';return;}book.add({raise:s.raise,stage:p.stage,immersion:p.immersion,baseline,sensor,difference:+(baseline-sensor).toFixed(2),floor:p.N>0?1:0,count:2,water:'water',pred:l.mi===2&&l.prediction!=null});msg.textContent=p.N>0?'바닥 힘이 함께 작용하므로 이 감소량을 부력이라고 할 수 없습니다.':'바닥에 닿지 않았으므로 감소량으로 부력을 구합니다. 측정 오차는 남을 수 있습니다.';}});
 },onMissionsReset(){baseline=null;},
 draw(c,l){const s=l.state,p=physics(s.raise),d=l.draw,z=l.fs(14),text=(x,y,t,col='#334155',align='center')=>d.text(c,x,y,t,{size:z,color:col,align}),cx=450;
 c.fillStyle='#f4fbff';c.fillRect(0,0,960,600);text(480,36,'같은 추 두 개를 물에 담급니다.');
 c.strokeStyle='#64748b';c.lineWidth=7;c.beginPath();c.moveTo(130,550);c.lineTo(190,550);c.lineTo(190,65);c.lineTo(cx,65);c.lineTo(cx,80);c.stroke();
 c.fillStyle='#e2e8f0';c.fillRect(cx-60,80,120,50);c.fillStyle='#bbf7d0';c.fillRect(cx-50,87,100,36);text(cx,113,p.T.toFixed(2)+' N','#065f46');text(640,104,'힘 센서');
 c.strokeStyle='#475569';c.lineWidth=3;c.beginPath();c.moveTo(cx,130);if(p.lift>0)c.quadraticCurveTo(cx+30,180,cx,p.tops[0]);else c.lineTo(cx,p.tops[0]);c.stroke();
 c.fillStyle='rgba(125,211,252,.35)';c.fillRect(320,p.surface,260,p.bottom-p.surface);c.strokeStyle='#0ea5e9';c.lineWidth=2;c.beginPath();c.moveTo(320,p.surface);c.lineTo(580,p.surface);c.stroke();c.strokeStyle='#64748b';c.lineWidth=4;c.beginPath();c.moveTo(310,330-s.raise);c.lineTo(310,p.bottom+8);c.lineTo(590,p.bottom+8);c.lineTo(590,330-s.raise);c.stroke();
 // Permeable supports keep water under the lower weight when it rests on the cup.
 c.fillStyle='#94a3b8';for(const x of [432,460])c.fillRect(x,p.bottom,8,8);
 for(const [i,t]of p.tops.entries()){c.fillStyle='#94a3b8';c.strokeStyle='#475569';c.lineWidth=2;c.beginPath();c.roundRect(cx-30,t,60,40,6);c.fill();c.stroke();text(cx-85,t+29,'100 g');if(i===0){c.beginPath();c.moveTo(cx,t+40);c.lineTo(cx,p.tops[1]);c.stroke();}}
 text(110,355,stageName[p.stage]);text(110,397,p.N>0?'바닥이 받칩니다.':'줄이 당깁니다.');
 if(l.modelVisible){d.arrow(c,cx,270-p.lift,0,W*K,{color:'#d14e55',width:4});d.arrow(c,cx,p.tops[0],0,-p.T*K,{color:'#e77822',width:4});d.arrow(c,cx,p.center,0,-p.B*K,{color:'#0891b2',width:5});if(p.N>0)d.arrow(c,cx,p.bottom,0,-p.N*K,{color:'#16a085',width:4});
  c.strokeStyle='#475569';c.lineWidth=3;c.beginPath();c.moveTo(35,90);c.lineTo(35+K,90);c.stroke();text(75,128,'1 N');text(735,173,'중력 1.96 N','#d14e55');text(735,215,p.N>0?'바닥이 떠받치는 힘':'센서가 당기는 힘',p.N>0?'#16a085':'#e77822');text(735,257,(p.N>0?p.N:p.T).toFixed(2)+' N',p.N>0?'#16a085':'#e77822');
  if(s.magnify){c.strokeStyle='#7dd3fc';c.lineWidth=2;c.strokeRect(640,293,280,237);text(780,329,'같은 부력 ×10','#0891b2');d.arrow(c,780,507,0,-p.B*K*10,{color:'#0891b2',width:5});text(665,483,p.B.toFixed(2)+' N','#0891b2','left');}
 }
 text(480,582,p.N>0?'바닥 힘도 작용합니다. 센서 감소량 전체가 부력은 아닙니다.':'잠긴 부피가 커지면 부력도 커집니다.');
 }
