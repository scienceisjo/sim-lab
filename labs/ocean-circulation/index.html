Explorer.start({"id":"ocean-circulation","title":"바람과 해류는 열을 어디로 옮길까?","unit":"수권과 해수의 순환","subject":"earth","codes":["9과17-02","9과18-02","9과18-03"],"core":"바람과 북태평양 표층 해류가 연결되고 해류는 저위도와 고위도 사이 에너지를 재분배한다.","observation":true,"controls":[{"key":"view","label":"비교 장면","options":[["gyre","북태평양 순환"],["profile","우리나라 주변 바다의 수온"]],"value":"gyre"},{"key":"season","label":"계절","options":[["summer","여름"],["winter","겨울"]],"value":"summer"}],"outputs":[{"key":"pattern","label":"주요 특징","numeric":false},{"key":"energy","label":"에너지와 연결","numeric":false}],"evaluate":s=>({pattern:s.view==='gyre'?'북적도 해류·쿠로시오·북태평양 해류·캘리포니아 해류가 연결됩니다.':s.season==='summer'?'표층이 따뜻해져 수온 약층이 더 뚜렷해집니다.':'표층 냉각과 혼합으로 혼합층이 깊어질 수 있습니다.',energy:s.view==='gyre'?'따뜻한 해류는 저위도의 에너지를 높은 위도 쪽으로 운반합니다.':'깊은 바다는 표층보다 계절 변화가 작습니다.'}),"rule":"북반구 아열대 북태평양 순환의 개념도. 북적도 해류 서향, 쿠로시오 북향, 북태평양 해류 동향, 캘리포니아 해류 남향. 위쪽편서풍 동향·아래무역풍 서향. 수온곡선은 수치축 없는 계절적 경향 그림이며 특정 관측 자료가 아니다.","limit":"해류 경로와 수온 곡선은 대표 경향을 단순화했습니다. 특정 날짜·위치의 실제 관측값이나 일기 예보는 아닙니다.","prompt":"바람과 해류의 방향을 연결하고, 여름과 겨울의 수온 분포를 비교하세요.","challenge":{"title":"여름 바다의 수온","text":"우리나라 주변 바다 수온을 여름으로 선택해 기록하세요.","check":s=>s.view==='profile'&&s.season==='summer'},"conclusion":"해류는 전 지구의 에너지를 {재분배합니다|새로 만듭니다}. 여름의 수온 약층은 표층 아래에서 온도가 {빠르게 낮아지는 층|항상 일정한 층}입니다.","quiz":[{"kind":"적용","question":"북태평양의 쿠로시오 해류는?","options":["대체로 저위도에서 높은 위도로 따뜻한 물을 옮깁니다.","항상 얼음을 만듭니다.","적도에서 동쪽으로만 흐릅니다."],"answer":0,"feedback":["난류의 에너지 이동을 봅니다.","난류입니다.","북적도 해류와 구별합니다."]},{"kind":"적용","question":"겨울에 표층이 냉각되고 바람으로 잘 섞이면?","options":["혼합층이 반드시 사라집니다.","혼합층이 깊어질 수 있습니다.","깊은 바다가 즉시 모두 가열됩니다."],"answer":1,"feedback":["섞이는 깊이를 생각해 보세요.","표층 냉각과 혼합을 연결합니다.","시간과 수심에 따른 차이가 있습니다."]}],"caption":(s,v)=>v.energy,"describe":(s,v)=>v.pattern+' '+v.energy,"draw":function draw(p,s,v,m){if(s.view==='gyre'){p.box(140,100,680,345,'#dcebf5');p.text(95,285,'아시아',20);p.text(865,285,'아메리카',18);if(m){p.arrow(235,350,235,200,'#cf7657',6);p.arrow(285,170,680,170,'#ce8865',6);p.arrow(725,205,725,350,'#528db6',6)
