<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>힘의 표현과 평형 · CLICK SCIENCE</title>
<meta name="description" content="힘을 화살표로 나타내고, 두 힘의 합력과 힘의 평형을 찾는 가상 실험실">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M11 7l12 9-5.5 1.2 3.3 6.3-2.6 1.4-3.3-6.3L11 22z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../_kit/kit.css">
</head>
<body data-subject="phys">
<script src="../_kit/kit.js"></script>
<script>
/* 힘의 표현과 평형 (힘의 작용 1소단원)
 * 계산: 1차원(가로). 상자 5 kg. 바닥은 마찰력이 없다고 가정한다(마찰력은 「마찰력」 실험실에서).
 * 합력 = 힘 ① + 힘 ②(오른쪽 +). 상자의 속도는 합력 ÷ 질량만큼 1초마다 바뀐다(화면에는 식을 내지 않음).
 */
const K = 2.2;           // 화살표 축척: 1 N = 2.2 px
const PPM = 80;          // 바닥 눈금: 1 m = 80 px
const M = 5;             // 상자 질량(kg)
const CX = 480, FLOOR_Y = 440, BOX = 120, DT = 1 / 120;
const LIM = { t: 8, x: 20, v: 10 };   // 재생을 멈추는 때: 8초, 20 m, 10 m/s
const C = { push: Lab.color('--f-push'), net: Lab.color('--f-net') };

const sim = { x: 0, v: 0, cam: 0, time: 0, acc: 0, ghosts: [], prev: [], nextGhost: 0.5, ended: '' };
const flags = { played: false, dragged1: false, f80: false, f20: false, eq: false, eqT: 0, armed: null, comb: false, combT: 0 };
// 힘을 바꾸면 늘 멈춘 상자에서 다시 시작한다(움직이는 중에 힘이 바뀌는 장면은 「알짜힘」 실험실 몫)
function changed(lab) { if (sim.time > 0 || lab.running) { lab.setRunning(false); restart(lab, true); } }
let noteEl = null;

const netF = s => s.f1 * s.d1 + s.f2 * s.d2;
const dirTxt = v => v > 0 ? '→' : v < 0 ? '←' : '';
const nf = v => (+Math.abs(v).toFixed(1)).toString();
const fmtF = v => Math.abs(v) < 0.05 ? '0 N' : `${nf(v)} N ${dirTxt(v)}`;
const boxX = () => CX + (sim.x - sim.cam) * PPM;    // 상자 가운데의 화면 x

function restart(lab, keepPrev) {
  if (!keepPrev) sim.prev = [];
  sim.x = 0; sim.cam = 0; sim.v = 0;
  sim.time = 0; sim.acc = 0; sim.ghosts = []; sim.nextGhost = 0.5; sim.ended = '';
  flags.eqT = flags.combT = 0;
  lab.t = 0;
}
function setMission(lab, st) { Object.assign(lab.state, st); lab.setRunning(false); restart(lab); if (noteEl) noteEl.textContent = ''; }
function syncM3() {
  const a = document.getElementById('m3a'), b = document.getElementById('m3b');
  const done = window.lab && window.lab.done[2];
  if (a) a.textContent = flags.f80 || done ? '✅' : '☐';
  if (b) b.textContent = flags.f20 || done ? '✅' : '☐';
}

Lab.init({
  id: 'force-balance', version: 2, title: '힘의 표현과 평형', subject: 'phys', unit: '힘의 작용', grade: '중1', updated: '2026-09-26',
  board: { w: 960, h: 600 },
  state: { f1: 40, d1: 1, f2: 20, d2: -1, showNet: true, show3: true, showGhost: false, showSpeed: false },
  teacher: `
    <h4>이 실험실이 맡는 개념 (1. 힘의 표현과 평형)</h4>
    <ul><li>힘의 3요소(작용점·방향·크기)와 화살표 표현</li><li>나란한 두 힘의 합력: 같은 방향은 더하고, 반대 방향은 큰 힘에서 작은 힘을 빼며 방향은 큰 힘 쪽</li>
    <li>합력은 두 힘과 같은 효과를 내는 하나의 힘</li><li>힘의 평형: 크기가 같고 방향이 반대인 두 힘, 멈춰 있어도 힘은 작용함</li></ul>
    <p>성취기준 [9과05-01]. 비상교육 기준 p.157–161입니다. 교과서 p.161의 「합력이 0이 되는 조건 찾기」 가상 실험 자료로 바로 쓸 수 있습니다.</p>
    <h4>화면 뒤의 계산</h4>
    <p>상자는 5 kg이고, 바닥은 마찰력이 없다고 가정했습니다. 합력이 0이 아니면 상자의 빠르기가 바뀌므로, 「합력으로 바꾸기」 전후의 0.5초 자국을 견주어 같은 효과인지 확인할 수 있습니다. 상자가 20 m를 가거나 속력이 10 m/s를 넘거나 8초가 지나면 재생을 멈춥니다.</p>
    <p>같은 쪽의 두 힘은 겹치지 않게 조금 띄워 그렸을 뿐, 같은 작용선 위의 힘으로 계산합니다.</p>
    <h4>이어지는 실험실(교과서 순서)</h4>
    <p>중력 → 탄성력 → 마찰력(물체 올리기·최대 정지 마찰력 그래프) → 부력 → 알짜힘. 힘을 바꾸면 상자는 늘 멈춘 자리에서 다시 시작하므로, 움직이는 물체의 운동 상태 변화는 「알짜힘」 실험실에서 다룹니다.</p>
    <h4>수업에서</h4>
    <ul><li>화살표 끝을 손가락으로 끌어 힘을 바꿀 수 있어 전자칠판 시연에 좋습니다. 크기가 0인 힘은 상자 옆의 ＋ 손잡이를 끌어 되살립니다.</li>
    <li>미션 없이 쓰려면 주소 끝에 <b>?missions=off</b>를 붙입니다. 공용 기기라면 미션 칸의 「다시 하기」로 진행을 지웁니다.</li></ul>
    <h4>다루지 않는 것</h4>
    <p>나란하지 않은 두 힘의 합성과 회전(p.157 설명 지양), 가속도와 F = ma, 관성이라는 이름.</p>`,
  missions: [
    { kind: '둘러보기', title: '마음대로 당겨 보기',
      text: '두 힘의 크기와 방향을 마음대로 바꾸고 <b>▶ 재생</b>해 보세요. 실험판의 빨간 화살표 끝을 끌어도 됩니다.',
      check: (s, lab) => lab.touches >= 3 && flags.played, ok: '좋아요. 이제 하나씩 해 봐요.' },
    { kind: '해 보기', title: '화살표로 힘 나타내기',
      text: '실험판에서 힘 ①의 화살표 끝을 끌어 <b>왼쪽으로 60 N</b>이 되게 만들어 보세요. 화살표의 시작점, 방향, 길이가 무엇을 나타내는지 살펴보세요.',
      enter: lab => setMission(lab, { f1: 40, d1: 1, f2: 0, show3: true }),
      check: s => flags.dragged1 && s.f1 === 60 && s.d1 === -1,
      ok: '화살표의 시작점은 힘의 작용점, 화살표의 방향은 힘의 방향, 화살표의 길이는 힘의 크기를 나타내요. 이 세 가지를 힘의 3요소라고 합니다.' },
    { kind: '해 보기', title: '50 N과 30 N으로 합력 만들기',
      text: '50 N과 30 N 두 힘만 써서 합력을 만들어 보세요.<br><span id="m3a">☐</span> 합력 80 N<br><span id="m3b">☐</span> 합력 20 N',
      enter: lab => setMission(lab, { f1: 0, f2: 0 }),
      check: s => {
        const pair = (s.f1 === 50 && s.f2 === 30) || (s.f1 === 30 && s.f2 === 50);
        if (pair && s.d1 === s.d2) flags.f80 = true;
        if (pair && s.d1 !== s.d2) flags.f20 = true;
        syncM3();
        return flags.f80 && flags.f20;
      },
      ok: '같은 방향이면 두 힘을 더하고, 합력의 방향은 두 힘의 방향과 같아요. 반대 방향이면 큰 힘에서 작은 힘을 빼고, 합력의 방향은 큰 힘의 방향이에요.' },
    { kind: '예상', title: '두 힘 대신 합력 하나로 당기면?',
      text: '① 50 N →, ② 30 N ←로 당기며 <b>▶ 재생</b>해 자국을 남긴 뒤 「합력으로 바꾸기」를 누르면 20 N → 하나만 남아요. 이 힘 하나로 다시 재생하면 상자의 움직임은 어떻게 될까요?',
      enter: lab => { setMission(lab, { f1: 50, d1: 1, f2: 30, d2: -1, showGhost: true }); flags.armed = null; },
      predict: { options: ['① 더 멀리 간다(자국 간격이 넓어진다)', '② 똑같이 움직인다(자국이 같은 자리에 찍힌다)', '③ 덜 간다(자국 간격이 좁아진다)'], answer: 1 },
      check: () => flags.comb,
      ok: '두 힘 대신 합력 하나로 당겨도 자국이 똑같은 자리에 찍혀요. 합력은 두 힘과 같은 효과를 내는 하나의 힘이에요.' },
    { kind: '해 보기', title: '당겨도 꼼짝 않는 상자',
      text: '멈춰 있는 상자에 두 힘을 모두 걸고 <b>▶ 재생</b>하세요. 상자가 1초 넘게 그대로 멈춰 있게 만들어 보세요.',
      enter: lab => setMission(lab, { f1: 0, f2: 0 }),
      check: () => flags.eq,
      ok: '크기가 같고 방향이 반대인 두 힘은 합력이 0이에요. 이것을 힘의 평형이라고 합니다. 멈춰 있어도 두 힘은 여전히 작용하고 있어요.' },
    { kind: '찾아내기', title: '합력과 힘의 평형 정리하기', text: '실험한 결과로 문장을 완성해 보세요.',
      sentence: '같은 방향으로 작용하는 두 힘의 합력은 두 힘을 {빼서|더해서} 구하고, 반대 방향으로 작용하는 두 힘의 합력의 방향은 {작은|큰} 힘의 방향입니다. 두 힘이 평형을 이루려면 크기가 {다르고|같고}, 방향이 {반대여야|같아야} 합니다.',
      blanks: [1, 1, 1, 0], ok: '잘 정리했어요! 다음은 「여러 가지 힘」에서 중력부터 차례로 만나요.' },
  ],

  setup(lab) {
    const ui = lab.ui;
    ui.group('힘 ① (당기는 힘)', C.push);
    ui.slider({ key: 'f1', label: '크기', min: 0, max: 100, step: 10, unit: 'N', onChange: (v, l) => changed(l) });
    ui.choice({ key: 'd1', options: [[-1, '← 왼쪽'], [1, '오른쪽 →']], onChange: (v, l) => changed(l) });
    ui.group('힘 ② (당기는 힘)', C.push);
    ui.slider({ key: 'f2', label: '크기', min: 0, max: 100, step: 10, unit: 'N', onChange: (v, l) => changed(l) });
    ui.choice({ key: 'd2', options: [[-1, '← 왼쪽'], [1, '오른쪽 →']], onChange: (v, l) => changed(l) });
    ui.button({ label: '합력으로 바꾸기', onClick: l => {
      const s = l.state, F = netF(s);
      if (!s.f1 && !s.f2) { noteEl.textContent = '지금은 상자에 작용하는 힘이 없어요.'; return; }
      if (!s.f1 || !s.f2) { noteEl.textContent = '이미 힘이 하나예요. 두 힘을 모두 걸고 눌러 보세요.'; return; }
      if (F === 0) { noteEl.textContent = '두 힘의 합력이 0 N이라 하나로 바꿀 힘이 없어요. 두 힘은 여전히 작용하고 있어요.'; return; }
      if (Math.abs(F) > 100) { noteEl.textContent = `합력 ${Math.abs(F)} N은 힘 ① 막대의 끝(100 N)보다 커서 이 실험판에서는 바꿀 수 없어요. 두 힘을 조금 줄여 보세요.`; return; }
      const had = sim.ghosts.length;
      flags.armed = had >= 1 ? F : null;   // 두 힘으로 재생한 자국이 있어야 견줄 수 있다
      sim.prev = sim.ghosts.slice();
      s.f1 = Math.abs(F); s.d1 = F < 0 ? -1 : 1; s.f2 = 0;
      l.setRunning(false); restart(l, true);
      if (!s.showGhost) s.showGhost = true;
      noteEl.textContent = had ? '두 힘을 같은 효과를 내는 힘 하나로 바꿨어요. ▶ 재생해서 회색 자국(바꾸기 전)과 견주어 보세요.'
        : '두 힘을 힘 하나로 바꿨어요. 견줄 자국이 없으니, 미션 4의 「이 상황으로 실험판 맞추기」로 두 힘으로 돌아가 ▶ 재생한 뒤 다시 바꿔 보세요.';
    } });
    noteEl = ui.note('');

    ui.group('측정값');
    ui.readout({ label: '두 힘의 합력', get: s => { const F = netF(s); return F === 0 && s.f1 && s.f2 ? '0 N <small>(힘의 평형)</small>' : fmtF(F); } });
    ui.readout({ label: '상자', get: s => sim.v === 0 ? '멈춰 있음' : (s.showSpeed ? `${Math.abs(sim.v).toFixed(2)} m/s ${dirTxt(sim.v)}` : `${dirTxt(sim.v)} 쪽으로 움직이는 중`) });

    ui.group('보기');
    ui.toggle({ key: 'show3', label: '힘의 3요소 이름표' });
    ui.toggle({ key: 'showNet', label: '합력 화살표' });
    ui.toggle({ key: 'showGhost', label: '0.5초마다 자국 남기기' });
    ui.toggle({ key: 'showSpeed', label: '속력 숫자' });

    restart(lab);
    syncM3();
    lab.update();
  },

  onPlay(lab) {
    flags.played = true;
    if (sim.ended) restart(lab, true);
  },
  rewind(lab) { restart(lab, true); if (noteEl) noteEl.textContent = ''; },
  reset(lab) { restart(lab); flags.armed = null; if (noteEl) noteEl.textContent = ''; },
  onMissionsReset() { Object.assign(flags, { played: false, dragged1: false, f80: false, f20: false, eq: false, armed: null, comb: false }); syncM3(); },

  step(dt, lab) {
    const s = lab.state;
    sim.acc += dt;
    while (sim.acc >= DT && !sim.ended) {
      sim.acc -= DT;
      const F = netF(s);
      const v0 = sim.v, v = v0 + F / M * DT;
      const x0 = sim.x;
      sim.x += (v0 + v) / 2 * DT;
      sim.v = Math.abs(v) < 1e-9 ? 0 : v;
      sim.time += DT;
      // 0.5초 자국: 물리 시각 기준, 경계에서 위치를 보간
      if (sim.time >= sim.nextGhost) {
        const f = 1 - (sim.time - sim.nextGhost) / DT;
        sim.ghosts.push(x0 + (sim.x - x0) * f);
        sim.nextGhost += 0.5;
      }
      // 미션 판정용 누적 시간
      flags.eqT = s.f1 > 0 && s.f2 > 0 && F === 0 && sim.v === 0 ? flags.eqT + DT : 0;
      flags.combT = flags.armed != null && s.f2 === 0 && s.f1 * s.d1 === flags.armed ? flags.combT + DT : 0;
      const mi = window.lab.mi;
      if (flags.eqT >= 1 && mi === 4) flags.eq = true;
      if (flags.combT >= 1.5 && mi === 3 && window.lab.prediction != null) flags.comb = true;
      // 멈추는 때
      const again = ' ▶ 재생을 누르면 처음 자리에서 다시 시작해요.';
      if (sim.time >= LIM.t - 1e-9) sim.ended = `${LIM.t}초가 지나 재생을 멈췄어요.` + again;
      else if (Math.abs(sim.x) >= LIM.x) sim.ended = '상자가 20 m를 가서 재생을 멈췄어요.' + again;
      else if (Math.abs(sim.v) >= LIM.v) sim.ended = '상자가 너무 빨라져서 재생을 멈췄어요.' + again;
    }
    // 카메라: 상자가 화면 가운데 부분(300~660 px)을 벗어날 때만 따라간다
    const bx = boxX();
    if (bx > 660) sim.cam = sim.x - (660 - CX) / PPM;
    if (bx < 300) sim.cam = sim.x - (300 - CX) / PPM;
    lab.t = sim.time;
    if (sim.ended) lab.setRunning(false);
    lab.update();
  },

  pointer: {
    // 빨간 화살표 끝(또는 크기 0인 힘의 ＋ 손잡이)을 끌면 그 힘의 크기와 방향이 바뀐다
    down(p, lab) {
      const hit = handles(lab).find(t => Math.hypot(p.x - t.x, p.y - t.y) < 34);
      if (!hit) return false;
      lab.dragKey = hit.k;
    },
    move(p, lab) {
      const s = lab.state, bx = boxX(), half = BOX / 2;
      let d, mag;
      if (p.x >= bx) { d = 1; mag = (p.x - (bx + half)) / K; } else { d = -1; mag = ((bx - half) - p.x) / K; }
      mag = Math.max(0, Math.min(100, Math.round(mag / 10) * 10));
      if (s['f' + lab.dragKey] !== mag || s['d' + lab.dragKey] !== d) changed(lab);
      s['f' + lab.dragKey] = mag; s['d' + lab.dragKey] = d;
      if (lab.dragKey === 1 && lab.mi === 1) flags.dragged1 = true;
    },
    up(p, lab) { lab.dragKey = null; },
    hover(p, lab) { return handles(lab).some(t => Math.hypot(p.x - t.x, p.y - t.y) < 34); },
  },

  draw(ctx, lab) {
    const s = lab.state, d = lab.draw, bx = boxX();
    const top = FLOOR_Y - BOX;
    drawFloor(ctx);

    // 자국: 같은 시간 간격의 위치(바닥 위 세모, 회색은 바꾸기 전)
    if (s.showGhost) {
      const mark = (gx, col, y0) => {
        const sx = CX + (gx - sim.cam) * PPM;
        if (sx < 8 || sx > 952) return;
        ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(sx, y0); ctx.lineTo(sx - 7, y0 + 12); ctx.lineTo(sx + 7, y0 + 12); ctx.closePath(); ctx.fill();
      };
      sim.prev.forEach(gx => mark(gx, '#9ca3af', FLOOR_Y + 16));
      sim.ghosts.forEach(gx => {
        mark(gx, C.push, FLOOR_Y + 2);
        const sx = CX + (gx - sim.cam) * PPM;
        ctx.save(); ctx.globalAlpha = 0.22; ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 2; ctx.setLineDash([6, 5]);
        ctx.strokeRect(sx - BOX / 2, top, BOX, BOX); ctx.restore();
      });
    }
    drawBox(ctx, bx);

    // 당기는 힘: 줄은 당기는 쪽 면에 묶인다
    forces(lab).forEach(f => {
      ctx.save(); ctx.strokeStyle = '#9a7b55'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(f.ax, f.y); ctx.lineTo(f.d > 0 ? 960 : 0, f.y); ctx.stroke(); ctx.restore();
      const len = f.mag * K;
      d.arrow(ctx, f.ax, f.y, f.d * len, 0, { color: C.push });
      const lx = len >= 96 ? f.ax + f.d * len / 2 : f.ax + f.d * (len + 46);
      const ly = len >= 96 ? f.y + (f.below ? 22 : -22) : f.y;
      d.tag(ctx, lx, ly, `${f.name} ${f.mag} N`, { color: C.push });
      // 힘의 3요소 이름표(힘 ① 에만): 줄 A = 작용점·방향, 줄 B = 길이(크기) 괄호
      if (s.show3 && f.k === 1) {
        const sg = f.below ? 1 : -1, rowA = f.y + sg * 50, rowB = f.y + sg * 82;
        const gray = '#475569', al = f.d > 0 ? 'left' : 'right', z = lab.fs(13);
        const tipX = f.ax + f.d * len, labX = f.ax + f.d * 24, dirX = f.ax + f.d * Math.max(len + 12, 100);
        ctx.save(); ctx.strokeStyle = 'rgba(71,85,105,.6)'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.moveTo(labX, rowA - sg * 9); ctx.lineTo(f.ax + f.d * 6, f.y + sg * 7);
        ctx.moveTo(dirX, rowA - sg * 9); ctx.lineTo(tipX, f.y + sg * 7); ctx.stroke();
        ctx.setLineDash([]); ctx.beginPath(); ctx.arc(f.ax, f.y, 10, 0, Math.PI * 2); ctx.stroke();
        // 길이 괄호 |———|
        ctx.strokeStyle = gray; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(f.ax, rowB + sg * 12); ctx.lineTo(f.ax, rowB + sg * 20); ctx.lineTo(tipX, rowB + sg * 20); ctx.lineTo(tipX, rowB + sg * 12); ctx.stroke();
        ctx.restore();
        d.tag(ctx, labX, rowA, '작용점', { color: gray, size: z, align: al });
        d.tag(ctx, dirX, rowA, f.d > 0 ? '방향 →' : '← 방향', { color: gray, size: z, align: al });
        d.tag(ctx, f.ax + f.d * len / 2, rowB, '길이 = 크기', { color: gray, size: z });
      }
    });
    // 크기 0인 힘의 ＋ 손잡이
    handles(lab).filter(t => t.zero).forEach(t => {
      ctx.save(); ctx.strokeStyle = C.push; ctx.setLineDash([3, 3]); ctx.lineWidth = 2; ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(t.x, t.y, 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore();
      d.text(ctx, t.x, t.y + 1, '+', { align: 'center', base: 'middle', size: 18, weight: 800, color: C.push });
    });

    // 합력(점선): 두 힘이 모두 있을 때만. 상자 윗면에서 이어지는 점선으로 이 상자의 합력임을 보인다
    const F = netF(s), ny = top - 70;
    if (s.showNet && s.f1 && s.f2) {
      ctx.save(); ctx.strokeStyle = 'rgba(17,24,39,.35)'; ctx.lineWidth = 1.5; ctx.setLineDash([2, 4]);
      ctx.beginPath(); ctx.moveTo(bx, top); ctx.lineTo(bx, ny + 8); ctx.stroke(); ctx.restore();
      if (F === 0) d.tag(ctx, bx, ny, '합력 0 N · 힘의 평형', { color: C.net, size: 16 });
      else {
        d.arrow(ctx, bx, ny, F * K, 0, { color: C.net, width: 4, dash: [9, 7], dot: false });
        d.tag(ctx, bx + F * K / 2, ny - 22, `합력 ${nf(F)} N`, { color: C.net, size: 15 });
      }
    }

    // 상자 상태 · 축척 · 바닥 이름 · 멈춘 까닭
    const stateTxt = sim.v === 0 ? '멈춰 있음' : (s.showSpeed ? `속력 ${Math.abs(sim.v).toFixed(2)} m/s ${dirTxt(sim.v)}` : `${dirTxt(sim.v)} 쪽으로 움직이는 중`);
    d.tag(ctx, 940, 30, stateTxt, { align: 'right', color: '#111', size: 18 });
    if (s.showSpeed) d.text(ctx, 940, 64, `시간 ${sim.time.toFixed(1)} 초`, { align: 'right', size: lab.fs(15), color: '#6b7280' });
    ctx.save(); ctx.strokeStyle = '#374151'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(24, 30); ctx.lineTo(24 + 50 * K, 30); ctx.moveTo(24, 24); ctx.lineTo(24, 36); ctx.moveTo(24 + 50 * K, 24); ctx.lineTo(24 + 50 * K, 36); ctx.stroke(); ctx.restore();
    d.text(ctx, 24 + 50 * K + 10, 36, '= 50 N (화살표 길이)', { size: lab.fs(14), color: '#374151' });
    d.text(ctx, 24, 588, '매끄러운 바닥(마찰력이 없다고 가정)', { size: lab.fs(15), color: '#374151', weight: 700 });
    if (sim.ended) d.tag(ctx, CX, 104, sim.ended, { size: 15, color: '#4b5563' });
  },
});

// 당기는 힘 두 개의 그리기 정보(같은 쪽에 두 힘이 걸리면 위아래로 조금 띄운다)
function forces(lab) {
  const s = lab.state, cy = FLOOR_Y - BOX / 2, half = BOX / 2, bx = boxX();
  const list = [{ k: 1, mag: s.f1, d: s.d1, name: '①' }, { k: 2, mag: s.f2, d: s.d2, name: '②' }].filter(f => f.mag > 0);
  const same = list.length === 2 && s.d1 === s.d2;
  return list.map(f => {
    const off = same ? (f.k === 1 ? -16 : 16) : 0;
    return { ...f, ax: bx + f.d * half, y: cy + off, below: off > 0 };
  });
}
function handles(lab) {
  const out = forces(lab).map(f => ({ k: f.k, x: f.ax + f.d * f.mag * K, y: f.y }));
  const s = lab.state, cy = FLOOR_Y - BOX / 2, bx = boxX();
  [1, 2].forEach(k => { if (!s['f' + k]) out.push({ k, zero: true, x: bx + s['d' + k] * (BOX / 2 + 22), y: cy + (k === 1 ? -22 : 22) }); });
  return out;
}
function drawBox(ctx, x) {
  const y = FLOOR_Y - BOX;
  ctx.save();
  ctx.fillStyle = '#d9a066'; ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(x - BOX / 2, y, BOX, BOX, 6); ctx.fill(); ctx.stroke();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(138,90,43,.55)';
  for (let k = 1; k < 4; k++) { ctx.beginPath(); ctx.moveTo(x - BOX / 2 + 4, y + BOX * k / 4); ctx.lineTo(x + BOX / 2 - 4, y + BOX * k / 4); ctx.stroke(); }
  ctx.restore();
}
function drawFloor(ctx) {
  ctx.fillStyle = '#eef3f8'; ctx.fillRect(0, FLOOR_Y, 960, 600 - FLOOR_Y);
  ctx.fillStyle = '#c5d3e2'; ctx.fillRect(0, FLOOR_Y, 960, 4);
  const first = Math.floor(sim.cam - CX / PPM) - 1, last = Math.ceil(sim.cam + CX / PPM) + 1;
  ctx.save(); ctx.strokeStyle = '#6b7280'; ctx.fillStyle = '#4b5563'; ctx.lineWidth = 2;
  ctx.font = '600 14px Pretendard, sans-serif'; ctx.textAlign = 'center';
  for (let m = first; m <= last; m++) {
    const sx = CX + (m - sim.cam) * PPM;
    if (sx < 22 || sx > 938) continue;
    ctx.beginPath(); ctx.moveTo(sx, FLOOR_Y + 32); ctx.lineTo(sx, FLOOR_Y + 46); ctx.stroke();
    ctx.fillText(`${m} m`, sx, FLOOR_Y + 63);
  }
  ctx.restore();
}
</script>
