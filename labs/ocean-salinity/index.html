'use strict';
Explorer.start({"id":"ocean-salinity","title":"물만 증발하면 염분은 어떻게 될까?","unit":"수권과 해수의 순환","subject":"earth","codes":["9과18-01","9과18-02"],"core":"해수의 염분은 전체 해수 질량 중 염류의 질량 비율이며 물의 유출입으로 변한다.","controls":[{"key":"waterChange","label":"더한 물의 질량","min":-200,"max":200,"step":50,"unit":"g","value":0},{"key":"salt","label":"처음 염류 질량","min":20,"max":40,"step":5,"unit":"g","value":35}],"outputs":[{"key":"salinity","label":"염분","unit":"‰","digits":2,"noise":0.02},{"key":"total","label":"해수 질량","unit":"g","digits":0,"noise":0}],"measure":"salinity","repeat":true,"evaluate":s=>({salinity:s.salt/(1000+s.waterChange)*1000,total:1000+s.waterChange}),"rule":"처음 해수 총질량1000g(염류 포함). 담수 추가 또는 순수한 물의 증발로 Δm; 염류 질량 보존. S=1000m염류/m해수. 음수는 증발, 양수는 담수유입. 해빙 시 염류배제 및 밀도 순환은 정량생략.","limit":"염류가 함께 빠져나가거나 새로 들어오지 않는 용기입니다. 증발할 때 물만 나가는 경우를 비교합니다.","prompt":"0 아래로 움직이면 물의 증발, 위로 움직이면 담수 유입입니다. 염류의 양은 바뀌나요?","challenge":{"title":"증발 뒤 남은 해수","text":"처음 염류 35 g, 더한 물 −200 g에서 세 번 기록하세요.","check":s=>s.salt===35&&s.waterChange===-200},"conclusion":"물만 증발하면 염분은 {높아집니다|낮아집니다}. 담수가 들어오면 염분은 {낮아집니다|높아집니다}.","quiz":[{"kind":"적용","question":"염분 35‰ 해수 1 kg에 포함된 염류는?","options":["35 g입니다.","350 g입니다.","물 1 kg에 소금 35 kg입니다."],"answer":0,"feedback":["해수 전체 질량을 기준으로 합니다.","천분율입니다.","용매와 용액의 질량을 구별합니다."]},{"kind":"적용","question":"물을 증발시켜도 염류가 사라지지 않는다면?","options":["염류 질량이 자동으로 늘어납니다.","해수 질량이 줄어 염분이 커집니다.","염분은 항상 같습니다."],"answer":1,"feedback":["염류의 질량은 보존됩니다.","분모의 질량을 살펴보세요.","비율이 달라집니다."]}],"caption":(s,v)=>'염류 '+s.salt+' g은 그대로 남습니다.',"describe":(s,v)=>`해수 ${v.total} g 속 염류 ${s.salt} g, 염분 ${v.salinity.toFixed(2)}‰입니다.`,"draw":function draw(p,s,v,m){p.box(220,105,410,330,'#f5f9fc','#9ab2c5');const h=v.total*.22;p.box(230,425-h,390,h,'#b6d9ec');if(m){for(let i=0;i<s.salt;i++)p.circle(250+(i*73)%340,415-((i*47)%(h-20)),4,'#b78b4e');if(s.waterChange<0)p.arrow(425,140,425,80,'#689ec0');if(s.waterChange>0)p.arrow(425,80,425,140,'#689ec0');p.text(785,235,'염류는 보존됩니다.',20);p.text(785,315,v.salinity.toFixed(2)+'‰',34);}p.text(425,465,'해수 '+v.total+' g');},"state":{"waterChange":0,"salt":35},"answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["염류가 함께 빠져나가거나 새로 들어오지 않는 용기입니다. 증발할 때 물만 나가는 경우를 비교합니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
</script></body></html>
