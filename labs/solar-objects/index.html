'use strict';
Explorer.start({"id":"solar-objects","title":"태양계의 천체는 어떻게 구별할까?","unit":"태양계","subject":"earth","codes":["9과07-01"],"core":"스스로 빛을 내는지, 무엇을 중심으로 도는지, 궤도 주변에서 어떤 역할인지로 태양계 천체를 구별한다.","observation":true,"controls":[{"key":"object","label":"천체","options":[["sun","태양"],["earth","지구"],["moon","달"],["pluto","명왕성"],["asteroid","소행성"],["comet","혜성"]],"value":"sun"},{"key":"criterion","label":"비교 기준","options":[["orbit","공전과 분류"],["matter","빛과 구성"]],"value":"orbit"}],"outputs":[{"key":"category","label":"분류","numeric":false},{"key":"evidence","label":"비교 근거","numeric":false}],"evaluate":s=>({category:{sun:'별',earth:'행성',moon:'위성',pluto:'왜소행성',asteroid:'소행성',comet:'혜성'}[s.object],evidence:s.criterion==='orbit'?{sun:'태양계의 중심 별입니다.',earth:'태양을 돌며 궤도 주변에서 지배적인 역할을 합니다.',moon:'지구 주위를 도는 위성입니다.',pluto:'태양을 돌고 둥글지만 궤도 주변을 지배하지는 않습니다.',asteroid:'태양을 도는 작은 천체이며 모양이 다양합니다.',comet:'태양 가까이에서 물질이 방출되어 꼬리가 발달할 수 있습니다.'}[s.object]:s.object==='sun'?'스스로 빛을 내는 별입니다.':s.object==='comet'?'얼음과 먼지 등을 포함하며 태양빛을 반사합니다.':'스스로 별처럼 빛을 내지 않고 주로 태양빛을 반사합니다.'}),"rule":"태양계 천체의 개괄 분류. 행성/왜소행성 경계는 궤도 주변 지배, 위성은 주천체 공전. 혜성 이온꼬리는 태양반대방향, 먼지꼬리는 휠 수 있어 꼬리를 항상운동뒤쪽으로 그리지 않는다.","limit":"천체 크기·거리·주기는 실제 비율이 아닙니다. 태양계 구성과 분류 기준을 비교하는 개념도입니다.","prompt":"명왕성과 지구의 공통점과 차이, 달과 행성의 차이를 찾아보세요.","challenge":{"title":"분류가 달라져도 태양계 안에","text":"명왕성의 공전과 분류를 관찰해 기록하세요.","check":s=>s.object==='pluto'&&s.criterion==='orbit'},"conclusion":"달은 지구를 도는 {위성|별}입니다. 명왕성은 태양계의 {왜소행성|외부 은하}입니다.","quiz":[{"kind":"적용","question":"태양빛을 반사해서 빛나는 천체는?","options":["달 같은 위성입니다.","모두 스스로 빛내는 별입니다.","빛을 볼 수 없습니다."],"answer":0,"feedback":["빛을 내는 것과 반사하는 것을 구별합니다.","반사해도 보입니다.","빛이 눈에 들어오면 보입니다."]},{"kind":"적용","question":"혜성의 이온 꼬리는 주로 어느 쪽인가요?","options":["항상 운동 뒤쪽입니다.","태양 반대쪽입니다.","언제나 태양 쪽입니다."],"answer":1,"feedback":["운동 방향과 같지 않을 수 있습니다.","태양풍의 영향을 받습니다.","반대 방향을 살펴보세요."]}],"caption":(s,v)=>'선택한 천체의 분류는 '+v.category+'입니다.',"describe":(s,v)=>v.evidence,"draw":function draw(p,s,v,m){if(s.object==='sun'){p.circle(480,275,130,'#e1ad4c');p.text(480,440,'스스로 빛을 내는 중심 별입니다.',24);return;}p.circle(220,280,65,'#e1ad4c');p.circle(600,280,s.object==='sun'?65:35,s.object==='sun'?'#e1ad4c':s.object==='earth'?'#4b87bf':'#aaa997');if(s.object==='moon'){p.circle(660,235,12,'#b3b1a5');if(m)p.ellipse(600,280,90,65,'#ffffff00','#aab8c7');}if(s.object==='comet'&&m){p.c.fillStyle='#adc6dd';p.c.beginPath();p.c.moveTo(620,265);p.c.lineTo(880,200);p.c.lineTo(880,360);p.c.lineTo(620,295);p.c.fill();}if(m){p.arrow(300,170,520,170,'#d8ab4b');p.text(410,125,'태양빛');p.text(600,400,v.category,30);}p.text(220,410,'태양',25);},"state":{"object":"sun","criterion":"orbit"},"measure":"category","answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["천체 크기·거리·주기는 실제 비율이 아닙니다. 태양계 구성과 분류 기준을 비교하는 개념도입니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
