<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>수증기가 늘지 않아도 습해질까? · CLICK SCIENCE</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../_kit/kit.css"><style>.rd{gap:12px;align-items:start}.rd>span{flex:0 0 28%}.rd b{overflow-wrap:anywhere;max-width:68%}.lab-panel a.abtn{display:block;text-decoration:none;text-align:center}.record-axes[hidden]{display:none}</style></head><body><script src="../_kit/kit.js"></script><script src="../_kit/thermal.js"></script><script src="../_kit/explorer.js"></script><script>
'use strict';
Explorer.start({temperatureColor:true,"id":"humidity-cloud","title":"수증기가 늘지 않아도 습해질까?","unit":"날씨와 기후변화","subject":"earth","codes":["9과17-03"],"core":"기온이 내려가면 포화 수증기압이 낮아져 상대습도가 커지며 포화 이후 응결할 수 있다.","controls":[{"key":"temperature","label":"기온","min":0,"max":30,"step":1,"unit":"℃","value":20},{"key":"vapor","label":"냉각 전 수증기압","min":6,"max":24,"step":2,"unit":"hPa","value":12}],"outputs":[{"key":"humidity","label":"상대습도","unit":"%","digits":1,"noise":0.05},{"key":"saturation","label":"포화 수증기압","unit":"hPa","digits":2,"noise":0},{"key":"condensation","label":"응결 여부","numeric":false}],"measure":"humidity","repeat":true,"evaluate":s=>{const saturation=6.112*Math.exp(17.67*s.temperature/(s.temperature+243.5));return{humidity:100*Math.min(s.vapor,saturation)/saturation,saturation,condensation:s.vapor>saturation?'응결하여 기체 수증기 일부가 물방울이 됩니다.':'아직 포화되지 않았습니다.'};},"rule":"0~30 ℃에서 Bolton형 근사 e_s=6.112exp(17.67T/(T+243.5)) hPa. 일정 압력에서 초기 혼합비를 정한 공기를 냉각. 포화 이전 수증기압 e0, 이후 응결평형 e=e_s. RH=100e/e_s. 이 모델은 단열상승의 높이·잠열을 정량 계산하지 않는다.","limit":"응결핵이 있고 충분히 기다린 평형 모형입니다. 구름은 물방울이나 얼음 알갱이이며 눈에 안 보이는 수증기 자체가 아닙니다.","prompt":"처음 수증기압을 그대로 두고 기온만 낮춰 보세요. 100% 이후 무엇이 달라지나요?","challenge":{"title":"냉각으로 응결 만들기","text":"냉각 전 수증기압 12 hPa, 기온 0 ℃에서 세 번 기록하세요.","check":s=>s.vapor===12&&s.temperature===0},"conclusion":"수증기가 더 들어오지 않아도 냉각하면 상대습도는 {높아질 수 있습니다|항상 같습니다}. 구름의 물방울은 {액체|기체}입니다.","quiz":[{"kind":"적용","question":"구름이 생기는 대표 과정은?","options":["상승한 공기가 팽창하며 냉각해 응결합니다.","수증기가 언제나 검게 변합니다.","공기가 없어집니다."],"answer":0,"feedback":["단열 팽창과 냉각을 연결합니다.","기체 수증기는 보이지 않습니다.","물질 상태가 달라집니다."]},{"kind":"적용","question":"상대습도 100%이면 반드시 비가 오나요?","options":["항상 즉시 옵니다.","물방울 성장 등 추가 조건이 필요합니다.","물방울이 있을 수 없습니다."],"answer":1,"feedback":["작은 구름방울이 바로 빗방울은 아닙니다.","병합·얼음 알갱이 성장 등을 생각합니다.","포화와 응결이 가능합니다."]}],"caption":(s,v)=>v.condensation,"describe":(s,v)=>`포화 수증기압 ${v.saturation.toFixed(2)} hPa, 상대습도 ${v.humidity.toFixed(1)}%입니다.`,"draw":function draw(p,s,v,m){p.box(85,110,360,330,'#dcecf7','#9ab6cc');const drops=s.vapor>v.saturation;for(let i=0;i<24;i++){const x=115+(i*83)%300,y=155+(i*47)%230;p.circle(x,y,drops&&i%3===0?10:3,m?Thermal.color(s.temperature):drops&&i%3===0?'#79a9ca':'#8bb7d0');}p.text(265,465,drops?'물방울이 생깁니다.':'수증기를 점으로 표시합니다.',20);p.bar(535,210,'상대습도',v.humidity,100,'#428ac0','%');if(m){p.text(715,340,'기온 '+s.temperature+' ℃',28);p.text(715,395,'포화 한계가 달라집니다.',20);}},"state":{"temperature":20,"vapor":12},"answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["응결핵이 있고 충분히 기다린 평형 모형입니다. 구름은 물방울이나 얼음 알갱이이며 눈에 안 보이는 수증기 자체가 아닙니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
</script></body></html>
