<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>반응은 어떤 길을 거쳐 나올까? · CLICK SCIENCE</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../_kit/kit.css"><style>.rd{gap:12px;align-items:start}.rd>span{flex:0 0 28%}.rd b{overflow-wrap:anywhere;max-width:68%}.lab-panel a.abtn{display:block;text-decoration:none;text-align:center}.record-axes[hidden]{display:none}</style></head><body><script src="../_kit/kit.js"></script><script src="../_kit/explorer.js"></script><script>
'use strict';
Explorer.start({"id":"neural-response","title":"반응은 어떤 길을 거쳐 나올까?","unit":"자극과 반응","subject":"life","codes":["9과20-01","9과20-02"],"core":"감각기관의 자극은 신경을 통해 중추로 전달되고 반응 명령이 운동기관으로 전달된다.","observation":true,"controls":[{"key":"case","label":"반응 사례","options":[["voluntary","보고 손 들기"],["withdraw","뜨거운 것에서 손 떼기"],["pupil","밝은 빛에서 동공 줄기"]],"value":"voluntary"},{"key":"focus","label":"따라갈 신호","options":[["sensory","감각 신호"],["motor","운동 명령"]],"value":"sensory"}],"outputs":[{"key":"path","label":"선택한 신호의 경로","numeric":false},{"key":"center","label":"반응의 중추","numeric":false}],"evaluate":s=>{const center={voluntary:'대뇌',withdraw:'척수',pupil:'중뇌'}[s.case];return{center,path:s.focus==='sensory'?({voluntary:'눈의 망막 → 감각 신경 → 뇌',withdraw:'피부의 감각기 → 감각 신경 → 척수',pupil:'눈의 망막 → 감각 신경 → 중뇌'}[s.case]):center+' → 운동 신경 → 반응 기관'};},"rule":"대표적인 의식적 반응·척수 반사·동공 반사 경로. 회피 반사 신호는 뇌에도 전달되어 통증을 느끼므로 척수에서 끝난다고 설명하지 않는다. 실제 지연 시간은 임의로 정하지 않는다.","limit":"여러 뉴런이 관여하는 경로를 간단하게 펼쳤습니다. 반사 때도 감각 정보가 뇌에 전달됩니다.","prompt":"감각 신호와 운동 명령의 방향을 각각 따라가 보세요.","challenge":{"title":"척수가 먼저 연결하는 반응","text":"뜨거운 것에서 손 떼기의 운동 명령을 기록하세요.","check":s=>s.case==='withdraw'&&s.focus==='motor'},"conclusion":"감각 신경은 정보를 {중추로|근육으로만} 전달합니다. 척수 반사 때도 감각 정보는 뇌에 {전달됩니다|전혀 가지 않습니다}.","quiz":[{"kind":"적용","question":"손을 먼저 뗀 뒤 통증을 느낄 수 있는 까닭은?","options":["척수의 빠른 반응 경로와 뇌로 가는 경로가 함께 있습니다.","피부에 뇌가 있습니다.","감각 신경이 필요 없습니다."],"answer":0,"feedback":["경로를 구별합니다.","피부에는 감각기가 있습니다.","감각 신경이 자극을 전달합니다."]},{"kind":"적용","question":"밝은 빛에서 동공이 줄어드는 반사는?","options":["항상 대뇌의 의식적 판단이 필요합니다.","중뇌가 관여하는 반사입니다.","척수 반사만 가능합니다."],"answer":1,"feedback":["의식적으로 결정하지 않아도 일어납니다.","반사 중추는 모두 같지 않습니다.","뇌의 다른 중추도 있습니다."]}],"caption":(s,v)=>'반응의 중추: '+v.center,"describe":(s,v)=>v.path+'입니다.',"draw":function draw(p,s,v,m){p.flow(['감각기관','감각 신경',v.center,'운동 신경','반응기관'],s.focus==='sensory'?1:3);if(m){p.text(480,115,'자극에서 반응으로 이어지는 방향을 봅니다.',24);if(s.case==='withdraw'){p.box(380,370,200,65,'#e6dcf4');p.text(480,403,'뇌에도 전달됩니다.');p.arrow(480,330,480,365,'#7955bb');}}},"state":{"case":"voluntary","focus":"sensory"},"measure":"path","answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["여러 뉴런이 관여하는 경로를 간단하게 펼쳤습니다. 반사 때도 감각 정보가 뇌에 전달됩니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
</script></body></html>
