const N=28,DX=.1/N,D=.002,DT=.01,RATE=15,AREA=DX*DX,BC=38,DEV={block:'뜨거운 추 위',dip:'끝 담그기',hand:'손 대기'};
const center=14*N+14,probe=14*N+22,mask=Array.from({length:N*N},(_,i)=>Math.hypot((i%N+.5)*DX-.05,(Math.floor(i/N)+.5)*DX-.05)<.015);
function makePlate(material,device){const a=new Float64Array(N*N).fill(20);if(device==='dip')for(let y=0;y<N;y++)a[y*N]=70;return {material,a,b:new Float64Array(N*N),block:70,lost:0,supply:0,initial:BC*70+MAT[material].cv*D*AREA*a.reduce((s,t)=>s+t,0)};}
function energy(p){return BC*p.block+MAT[p.material].cv*D*AREA*p.a.reduce((s,t)=>s+t,0)+p.lost-p.supply;}
function stepPlate(p,device,dt=DT){const m=MAT[p.material],C=m.cv*D*AREA,cond=m.alpha*m.cv*D,hc=1/(1/500+D/(m.alpha*m.cv));let fromBlock=0,lost=0,supply=0;
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=y*N+x,t=p.a[i];let q=0;if(x>0)q+=cond*(p.a[i-1]-t);if(x<N-1)q+=cond*(p.a[i+1]-t);if(y>0)q+=cond*(p.a[i-N]-t);if(y<N-1)q+=cond*(p.a[i+N]-t);const air=20*AREA*(t-20);q-=air;lost+=air*dt;if(device==='block'&&mask[i]){const source=hc*AREA*(p.block-t);q+=source;fromBlock+=source*dt;}let next=t+q*dt/C;if(device==='dip'&&x===0){supply+=(70-next)*C;next=70;}p.b[i]=next;}
 p.block-=fromBlock/BC;p.lost+=lost;p.supply+=supply;[p.a,p.b]=[p.b,p.a];
}
function skin(material){const m=MAT[material],e=Math.sqrt(m.alpha*m.cv*m.cv);return (1100*33+e*20)/(1100+e);}

const sim={t:0,acc:0,plates:[],owner:null,mode:null};let book,msg;const rows=i=>book.rows.filter(r=>r._mission===i);
function rewind(l){microscope=[new Thermal.Lattice(10,3,7),new Thermal.Lattice(10,3,8)];microLast=0;Object.assign(sim,{t:0,acc:0,plates:[makePlate(l.state.left,l.state.device),makePlate(l.state.right,l.state.device)],owner:null,mode:null});}

function advance(dt,l){if(l.state.device==='hand'){l.setRunning(false);return;}sim.acc+=dt*RATE;const next=(Math.floor((sim.t+1e-7)/60)+1)*60;while(sim.acc>=DT&&sim.t<300-1e-7){sim.acc-=DT;for(const p of sim.plates)stepPlate(p,l.state.device);sim.t+=DT;if(Math.abs(sim.t-Math.round(sim.t/60)*60)<1e-6){sim.t=Math.round(sim.t/60)*60;if(sim.t>=next){sim.acc=0;l.setRunning(false);l.update();break;}}}}

 assumptions:['판의 크기와 두께, 처음 온도는 같습니다. 물질마다 열이 전도되는 정도가 다릅니다.','뜨거운 추는 처음 70 ℃이고 판에 열을 주면서 식습니다. 주변 공기는 20 ℃로 유지합니다.','검은 종이를 잘 붙인 표면의 온도를 색으로 표시합니다. 반사 때문에 카메라가 잘못 읽는 현상은 생략합니다.','입자 크기는 같고 제자리 부근에서 떱니다. 입자와 배경의 색은 해당 부분의 평균 온도 표시이며 실제 입자의 색이 아닙니다.','손 대기는 접촉 직후의 표면 온도를 비교하는 별도 모형입니다. 학습 온도 측정은 최대 0.2 ℃ 흔들린 뒤 반올림합니다.'],
 teacher:`<h4>교과서</h4><p>비상교육 p.85, 90–92. 금속판과 플라스틱판 위에 검은 종이를 붙여 뜨거운 추 위에 놓는 실험, 끝 담그기 대체 활동, 같은 실온의 금속과 나무를 만지는 차이를 다룹니다. 그림은 새로 만들었으며 실제 열화상 카메라로 사람을 관찰하는 활동으로 안내하지 않습니다.</p><h4>수치 모형</h4><p>10×10 cm, 두께 2 mm, 28×28 유한체적 격자입니다. 이웃 칸 열교환을 보존형으로 계산하며 가장자리는 단열, 표면은 20 ℃ 공기와 h=10 W/(m² K)로 열교환합니다. DT=0.01초는 최대 확산율의 명시적 안정 한계보다 작습니다. 추 열용량 38 J/K, 접촉 반지름 1.5 cm, 접촉 계수 1/(1/500+d/k)를 사용합니다. 판에 준 열만큼 추가 식으며 공기로 나간 열도 합산합니다. 끝 담그기는 왼쪽 끝을 70 ℃로 유지하는 큰 물통 조건입니다.</p><p>재료의 열확산율과 부피 열용량은 설계안의 대표값을 상수로 둔 비교 모형입니다. 실제 제품의 정확한 예측값이 아니며 접촉 상태·재질 배합·두께에 따라 달라집니다. 손 대기는 33 ℃ 피부와 20 ℃ 판의 초기 접촉을 열유효도 √(kρc)로 계산하는 반무한체 모형입니다. 피부 값은 1100 J/(m² K √s)로 정했고 장시간 손의 체온 조절은 다루지 않습니다.</p><h4>오개념 방지</h4><p>색 범위 20–70 ℃는 재료·시각에 따라 바꾸지 않습니다. 플라스틱도 중앙은 데워집니다. 입자 확대창의 온도색은 같은 위치의 판 온도와 연결합니다. 이웃 조화력과 복원력을 적분하고 국소 Langevin 열저장고로 온도에 연결한 설명 모형입니다. 입자 크기는 같고 색은 실제 물질의 색이 아닙니다. 금속의 자유 전자에 의한 전도는 이 창에 생략합니다. 금속이 원래 차갑다는 오해는 손 대기에서 두 판이 모두 20 ℃임을 먼저 확인하며 바로잡습니다.</p>`,
