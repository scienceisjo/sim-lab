'use strict';
const CI=445,CO=418,H=2,DT=.1,RATE=30,LAMBDA=H*(1/CI+1/CO),TAU=3;
function temperatures(s,t){if(s.contact==='apart')return [s.inside,s.outside];const mean=(CI*s.inside+CO*s.outside)/(CI+CO),diff=(s.inside-s.outside)*Math.exp(-LAMBDA*t);return [mean+CO/(CI+CO)*diff,mean-CI/(CI+CO)*diff];}
function sensors(s,t){const mean=s.contact==='apart'?null:(CI*s.inside+CO*s.outside)/(CI+CO);return [s.inside,s.outside].map((v,i)=>{if(mean==null)return v+(20-v)*Math.exp(-t/TAU);const a=v-mean;return mean+(20-mean)*Math.exp(-t/TAU)+a*(Math.exp(-LAMBDA*t)-Math.exp(-t/TAU))/(1-LAMBDA*TAU);});}
const DENSITY=[[5,.99997],[20,.99821],[40,.99222],[60,.98320],[80,.97179]];
function density(t){for(let i=1;i<DENSITY.length;i++)if(t<=DENSITY[i][0]){const [x,a]=DENSITY[i-1],[y,b]=DENSITY[i];return a+(b-a)*(t-x)/(y-x);}return DENSITY.at(-1)[1];}
const MICRO_RATE=90,MICRO_DT=1/240;
const width=t=>210*DENSITY[0][1]/density(t),rms=t=>MICRO_RATE*Math.sqrt((t+273.15)/293.15);
const sim={t:0,acc:0,owner:null,mode:null,path:[]};let book,msg,lastFrame=0;const explored=new Set();
const rows=i=>book.rows.filter(r=>r._mission===i);
const particles=[[],[]];
let microAcc=0,microTicks=0;
function initParticles(){microAcc=0;microTicks=0;for(let side=0;side<2;side++){particles[side]=Thermal.disks(48,210,110,8,101+side,MICRO_RATE);for(const p of particles[side])p.trail=[];}}
function moveParticles(dt,ts){microAcc+=Math.max(0,dt);while(microAcc>=MICRO_DT-1e-10){microAcc-=MICRO_DT;stepParticles(MICRO_DT,ts);microTicks++;if(microTicks%4===0)for(const ps of particles)for(const p of ps){p.trail.push([p.x,p.y]);if(p.trail.length>10)p.trail.shift();}}}
function stepParticles(dt,ts){for(let side=0;side<2;side++){const ps=particles[side],w=width(ts[side]),target=rms(ts[side]),mean=Math.sqrt(ps.reduce((q,p)=>q+p.vx*p.vx+p.vy*p.vy,0)/ps.length),factor=target/mean;
 for(const p of ps){p.vx*=factor;p.vy*=factor;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.x<8){p.x=8;p.vx=Math.abs(p.vx);}if(p.x>w-8){p.x=w-8;p.vx=-Math.abs(p.vx);}if(p.y<8){p.y=8;p.vy=Math.abs(p.vy);}if(p.y>102){p.y=102;p.vy=-Math.abs(p.vy);}}
 for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){const a=ps[i],b=ps[j],dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy);if(dist>0&&dist<15){const nx=dx/dist,ny=dy/dist,over=(15-dist)/2,dv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;a.x-=over*nx;a.y-=over*ny;b.x+=over*nx;b.y+=over*ny;if(dv<0){a.vx+=dv*nx;a.vy+=dv*ny;b.vx-=dv*nx;b.vy-=dv*ny;}}}
 // Collision correction must not push a particle through the chamber wall.
 for(const p of ps){p.x=Math.max(8,Math.min(w-8,p.x));p.y=Math.max(8,Math.min(102,p.y));}
 }}
function rewind(l){Object.assign(sim,{t:0,acc:0,owner:null,mode:null,path:[{time:0,inside:l.state.inside,outside:l.state.outside}]});initParticles();moveParticles(MICRO_DT,[l.state.inside,l.state.outside]);}

function changed(v,l){if(l.mode==='learn'&&l.mi===0)explored.add(l.state.inside+':'+l.state.outside);l.rewind();}
function advance(dt,l){sim.acc+=dt*RATE;const nextMinute=(Math.floor((sim.t+1e-6)/60)+1)*60;while(sim.acc>=DT&&sim.t<600-1e-8){sim.acc-=DT;sim.t=Math.min(600,sim.t+DT);if(Math.abs(sim.t-Math.round(sim.t/60)*60)<1e-7){sim.t=Math.round(sim.t/60)*60;const [inside,outside]=temperatures(l.state,sim.t);sim.path.push({time:sim.t/60,inside,outside});if(l.mode==='learn'&&sim.t>=nextMinute){sim.acc=0;l.setRunning(false);l.update();break;}}if(sim.t>=600){l.setRunning(false);l.update();}}}

  c.save();c.beginPath();c.roundRect(x,y,w,h,[0,0,10,10]);c.clip();
  const g=c.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,'#e7f6fa');g.addColorStop(.55,'#c4e5ef');g.addColorStop(1,'#9fcad9');c.fillStyle=g;c.fillRect(x,y,w,h);

 };
 const probe=(x,top,bottom,value,label)=>{
  const stem=c.createLinearGradient(x-3,0,x+3,0);stem.addColorStop(0,'#52687b');stem.addColorStop(.5,'#eef4f8');stem.addColorStop(1,'#52687b');
  rr(x-3,top+25,6,bottom-top-25,3,stem);ellipse(x,bottom,4,3,'#4b6072');

 function apparatus(){
  rr(24,51,514,253,18,'#f2f7fa','#e0e8ed');
  // A section through the metal cup reveals the water while its wall remains solid.
  const bx=together?114:271,by=119,bw=232,bh=143,cx=together?171:81,cw=115,cy=together?127:135,ch=125;
  ellipse(bx+bw/2,278,bw*.55,8,'rgba(36,63,80,.08)');
  const glass=c.createLinearGradient(bx,0,bx+bw,0);glass.addColorStop(0,'#dbe9ed');glass.addColorStop(.1,'#fff');glass.addColorStop(.8,'#f3f9fb');glass.addColorStop(1,'#c5dce5');
  rr(bx-7,by-6,bw+14,bh+13,[3,3,18,18],glass,'#96b4c2');
  // The outer water level rises as the metal cup displaces it. Both samples
  // occupy approximately equal section areas; the cup itself keeps its size.
  const level=together?14:87;water(bx,by+level,bw,bh-level,ts[1]);
  // The cup is shown as an open section, never as transparent metal.
  const metal=c.createLinearGradient(cx-8,0,cx+cw+8,0);metal.addColorStop(0,'#687d8d');metal.addColorStop(.12,'#d7e0e6');metal.addColorStop(.35,'#f8fbfd');metal.addColorStop(.8,'#bccbd5');metal.addColorStop(1,'#546c80');
  rr(cx-9,cy-8,cw+18,ch+16,[4,4,12,12],metal,'#647b8d');
  water(cx,cy+12,cw,ch-12,ts[0],true);
  c.strokeStyle='#6c8393';c.lineWidth=2;c.beginPath();c.moveTo(cx-9,cy-7);c.lineTo(cx-9,cy+ch);c.quadraticCurveTo(cx-9,cy+ch+8,cx,cy+ch+8);c.lineTo(cx+cw,cy+ch+8);c.quadraticCurveTo(cx+cw+9,cy+ch+8,cx+cw+9,cy+ch);c.lineTo(cx+cw+9,cy-7);c.stroke();
  c.strokeStyle='#f8fcff';c.lineWidth=2;c.beginPath();c.moveTo(cx-5,cy);c.lineTo(cx-5,cy+ch);c.stroke();
  // An exterior lip, curved base and highlights distinguish the glass from the cup.
  c.strokeStyle='#8eacba';c.lineWidth=3;c.beginPath();c.moveTo(bx-7,by-6);c.lineTo(bx-7,by+bh-4);c.quadraticCurveTo(bx-7,by+bh+7,bx+8,by+bh+7);c.lineTo(bx+bw-8,by+bh+7);c.quadraticCurveTo(bx+bw+7,by+bh+7,bx+bw+7,by+bh-4);c.lineTo(bx+bw+7,by-6);c.lineTo(bx+bw+17,by-11);c.stroke();
  c.strokeStyle='#c4d8e0';c.lineWidth=2;c.beginPath();c.moveTo(bx-12,by-7);c.lineTo(bx+bw+6,by-7);c.stroke();
  c.strokeStyle='rgba(255,255,255,.8)';c.lineWidth=4;c.beginPath();c.moveTo(bx+5,by+12);c.lineTo(bx+5,by+bh-12);c.stroke();
  probe(cx+cw/2,77,cy+ch-15,ss[0],'안쪽');probe(bx+bw-24,77,by+bh-12,ss[1],'바깥');
  text(280,294,together?'컵 벽이 두 물을 나눕니다.':'컵을 넣으면 열을 주고받습니다.','#475569',14);
 }

  d.graph(c,{x:618,y:94,w:295,h:158,xMax:10,yMax:80,xLabel:'',yLabel:'',fontSize:l.fs(13),line:sim.path.map(p=>[p.time,p.inside]),lineColor:'#b84b42',xTicks:2,yTicks:2});
  c.strokeStyle='#2563a6';c.lineWidth=3;c.beginPath();sim.path.forEach((p,i)=>{const x=618+p.time*29.5,y=252-p.outside/80*158;i?c.lineTo(x,y):c.moveTo(x,y);});c.stroke();
  for(let side=0;side<2;side++){c.fillStyle=side?'#2563a6':'#b84b42';c.beginPath();c.arc(618+sim.t/60*29.5,252-ts[side]/80*158,4,0,Math.PI*2);c.fill();}

 }
 function chamber(side,x,y,scale){
  const w=width(ts[side])*scale,h=110*scale;
  rr(x-5,y-5,w+10,h+10,12,'#f9fcfe','#bbcedb');

  c.translate(x,y);c.scale(scale,scale);
  if(l.state.trails){c.lineCap='round';c.lineJoin='round';for(const p of particles[side]){for(let i=1;i<p.trail.length;i++){c.strokeStyle=Thermal.color(ts[side]);c.globalAlpha=.08+.36*i/p.trail.length;c.lineWidth=3;c.beginPath();c.moveTo(...p.trail[i-1]);c.lineTo(...p.trail[i]);c.stroke();}}c.globalAlpha=1;}
  for(const [i,p]of particles[side].entries()){c.fillStyle=Thermal.color(ts[side]);c.beginPath();c.arc(p.x,p.y,7.5,0,Math.PI*2);c.fill();c.strokeStyle='rgba(28,63,85,.35)';c.lineWidth=.8;c.stroke();c.fillStyle='rgba(255,255,255,.45)';c.beginPath();c.arc(p.x-2,p.y-2,2.1,0,Math.PI*2);c.fill();if(i===0){c.strokeStyle='#193c58';c.lineWidth=1.3;c.beginPath();c.arc(p.x,p.y,9,0,Math.PI*2);c.stroke();}}
  c.restore();
 }
 function speedBars(y){
  const base=large?132:72,len=large?540:245,ref=rms(80),x2=large?base:582;
  if(large){text(480,y-28,'입자 집단의 운동 빠르기','#334155',17);for(let side=0;side<2;side++){const yy=y+side*48;text(86,yy+7,side?'밖':'안');rr(base,yy-8,len,14,7,'#e5edf3');rr(base,yy-8,len*rms(ts[side])/ref,14,7,Thermal.color(ts[side]));text(785,yy+7,(rms(ts[side])/rms(20)).toFixed(3)+'배','#334155',15);}}
  else for(let side=0;side<2;side++){const x=side?x2:base;rr(x,y,len,9,4,'#e5edf3');rr(x,y,len*rms(ts[side])/ref,9,4,Thermal.color(ts[side]));text(x+len+37,y+9,(rms(ts[side])/rms(20)).toFixed(2),'#334155',13);}
 }
 c.fillStyle='#fbfcff';c.fillRect(0,0,960,600);
 text(480,30,large?'같은 배율로 두 물의 입자 운동을 비교합니다.':'금속 컵을 물에 넣고 온도 변화를 살펴보세요.','#243f54',17);
 if(!large){apparatus();graph();}
 if(l.modelVisible){

  const wallY=y+10,wallH=110*scale-20;
  const metal=c.createLinearGradient(462,0,496,0);metal.addColorStop(0,'#8ea2b3');metal.addColorStop(.5,'#e9f0f5');metal.addColorStop(1,'#7f96a8');rr(466,wallY,26,wallH,4,metal,'#718b9c');
  text(480,large?365:337,'컵 벽','#526b7d',14);
  if(together&&Math.abs(ts[0]-ts[1])>=.3){const right=ts[0]>ts[1];d.arrow(c,right?435:526,y+wallH/2+10,right?91:-91,0,{color:'#cb7027',width:3});}
  speedBars(large?427:561);
  if(large)text(480,530,'20 ℃의 운동 빠르기를 1배로 놓았습니다.','#64748b',14);
  else text(480,594,'운동 빠르기 비교 · 양쪽 모두 20 ℃를 1로 표시합니다.','#64748b',13);
  if(large)text(480,577,together?(Math.abs(ts[0]-ts[1])<.3?'평형에 가까워져도 입자는 계속 움직입니다.':'열은 뜨거운 물에서 찬물로 순이동합니다.'):'컵을 넣기 전에는 두 온도가 유지됩니다.','#334155',15);
 }else{
  text(260,362,'안쪽 물 '+ts[0].toFixed(1)+' ℃','#b84b42',23);text(725,362,'바깥 물 '+ts[1].toFixed(1)+' ℃','#2563a6',23);
  const diff=ts[0]-ts[1];if(together&&Math.abs(diff)>=.3)d.arrow(c,diff>0?285:675,425,diff>0?390:-390,0,{color:'#cb7027',width:4});
  text(480,482,together?'물이 섞이지 않아도 컵 벽을 통해 열을 주고받습니다.':'따로 둔 두 물의 온도는 유지됩니다.','#334155',17);

 }

Lab.init({id:'heat-equilibrium',version:1,title:'열평형 입자 실험실',subject:'phys',unit:'열의 이동',grade:'중1',updated:'2026-09-27',board:{w:960,h:600},state:{inside:60,outside:5,contact:'apart',focus:'all',trails:true},animate:true,
 viewLabels:{scene:'장치 보기',model:'입자·온도 보기'},
 sceneNote:'입자 움직임은 양쪽에 같은 길이·시간 배율을 적용합니다. 꼬리는 최근 이동 자취입니다. 온도 변화 재생을 멈춰도 입자는 계속 움직입니다. 물 분자 사이의 모든 힘을 재현한 모형은 아닙니다.',
 assumptions:['두 물은 각각 100 g이고 알루미늄 컵은 30 g입니다. 컵 벽을 통해 열이 이동하며 물은 섞이지 않습니다.','바깥으로 새는 열은 무시합니다. 실제 실험의 최종 온도와 걸리는 시간은 장치에 따라 다릅니다.','재생 1초는 실험 30초입니다. 학습 모드는 1분마다 멈추어 측정할 시간을 줍니다.','온도 센서는 처음 20 ℃에서 시작하며 물의 온도를 바로 따라가지 못합니다. 꽂은 뒤 잠시 기다려야 합니다.','학습 측정값은 최대 0.2 ℃ 흔들리고 반올림합니다. 입자의 크기와 개수는 같습니다. 입자 색은 그 부분의 평균 온도를 나타내는 설명용 표시입니다.'],
 teacher:`<h4>교과서</h4><p>비상교육 p.84–88. 약 60 ℃ 물과 약 5 ℃ 물, 10분 관찰, 온도–입자 움직임, 접촉식 온도계를 기다리는 까닭을 연결합니다. 두 정리본의 내용은 같은 단원이므로 하나로 만들었습니다.</p><h4>내부 계산</h4><p>안쪽 물 100 g과 알루미늄 컵 30 g의 열용량은 445 J/K, 바깥 물은 418 J/K, 열전달 계수는 2 W/K로 설정했습니다. 에너지 보존을 만족하는 두 덩어리 해석해를 0.1초 간격으로 표본화합니다. 기본 평형 온도는 약 33.36 ℃이며 교과서의 실측값이 아닙니다. 센서는 시간 상수 3초인 1차 응답의 해석해를 씁니다. 0.3 ℃ 미만은 '열평형에 가까움'의 표시 기준이며 완전히 같은 온도로 값을 강제 변경하지 않습니다.</p><h4>입자 모형의 한계</h4><p>각 48개 동일 원판, 같은 질량 탄성 충돌을 이용한 설명 그림이며 실제 액체의 분자 간 힘을 전부 계산하지 않습니다. 거시 계산 온도에 맞춰 평균 제곱 속력을 조절합니다. 운동 크기는 √(T+273.15)에 비례합니다. 양쪽 기준 빠르기를 모두 90 모형 길이/표시초로 높이고 1/240초 간격으로 충돌을 계산합니다. 약 0.15초의 실제 위치 자취와 확대 보기를 제공합니다. 비교 막대는 평균 제곱 속력의 제곱근이며 20 ℃를 1배로 정합니다. 60/5 ℃의 빠르기 비 1.094411을 과장하지 않습니다. 움직임 줄이기 설정에서는 입자 애니메이션을 멈추지만 수치와 막대를 볼 수 있습니다. 장치는 안쪽 금속 컵을 잘라 본 단면이며 물의 실제 색은 온도에 따라 붉어지지 않습니다. 물 밀도 표(5/20/40/60/80 ℃의 0.99997/0.99821/0.99222/0.98320/0.97179 g/cm³)를 선형 보간하여 창 너비를 조절합니다. 입자는 생성·소멸하거나 칸막이를 넘지 않습니다. 간격·시간·입자 수는 실제 물 전체의 재현이 아닙니다.</p><h4>범위</h4><p>물의 양과 재료 바꾸기, 열량 식, 외부 열손실은 이 실험실에서 조작하지 않습니다. 후속 비열 단원에서 다룹니다. 열 화살표 방향은 안팎 위치가 아니라 온도 차이로 정합니다.</p>`,
 missions:[
 {kind:'둘러보기',title:'온도와 입자 움직임 비교하기',text:'안쪽과 바깥쪽 처음 온도를 바꾸며 입자와 움직임 비교 막대를 살펴보세요.',check:()=>explored.size>=3},
 {kind:'해 보기',title:'60 ℃와 5 ℃를 10분 관찰하기',text:'상황을 맞추고 재생하세요. 1분마다 멈추면 기록하고 다시 재생하세요. 0분·1분·10분 기록이 필요합니다.',enter:l=>configure(l,{inside:60,outside:5,contact:'together'}),check:()=>[0,60,600].every(t=>rows(1).some(r=>r.seconds===t&&r.initialInside===60&&r.initialOutside===5&&r.contact==='together')),ok:'두 물의 온도는 약 33.4 ℃로 가까워집니다. 입자는 서로 섞이지 않아도 컵 벽을 통해 열을 주고받습니다.'},
 {kind:'예상',title:'열평형 가까이에서도 입자는?',text:'온도가 거의 같아진 뒤 입자가 어떻게 움직일지 예상하고 10분까지 관찰해 기록하세요.',enter:l=>configure(l,{inside:60,outside:5,contact:'together'}),predict:{options:['모두 멈춥니다.','계속 움직이고 활발한 정도가 비슷합니다.','안쪽이 언제나 더 활발합니다.'],answer:1},check:()=>rows(2).some(r=>r.seconds===600&&r.visible&&Math.abs(r.trueInside-r.trueOutside)<.3&&r.pred),ok:'열평형에 가까워져도 입자는 계속 움직입니다. 두 물 사이 열의 순이동만 작아집니다.'},
 {kind:'해 보기',title:'안팎을 바꾸면 열의 방향은?',text:'60/5 ℃와 5/60 ℃를 각각 맞추고 접촉시켜 1분 뒤 기록하세요. 온도만 바꾸어도 화살표가 뒤집히는지 보세요.',enter:l=>configure(l,{inside:60,outside:5,contact:'together'}),check:()=>[[60,5],[5,60]].every(([a,b])=>rows(3).some(r=>r.initialInside===a&&r.initialOutside===b&&r.seconds===60&&r.contact==='together'&&r.visible)),ok:'열은 위치와 관계없이 온도가 높은 물에서 낮은 물로 순이동합니다.'},
 {kind:'변인 고르기',title:'시간에 따른 안쪽 온도 재기',text:'처음 온도와 접촉 상태를 유지하고 시간에 따른 안쪽 센서값을 재도록 설계하세요.',variables:{options:[['seconds','시간'],['initialInside','안쪽 처음 온도'],['initialOutside','바깥 처음 온도'],['contact','접촉 상태'],['measuredInside','안쪽 센서값']],change:'seconds',keep:['initialInside','initialOutside','contact'],measure:'measuredInside',recordId:'heat'}},
 {kind:'해 보기',title:'꽂자마자 읽으면 어떨까?',text:'컵을 따로 두어 물의 온도가 유지되는 상황에서 0분과 1분을 기록하세요. 센서가 물의 온도에 가까워지는지 보세요.',enter:l=>configure(l,{inside:60,outside:5,contact:'apart'}),check:()=>[0,60].every(t=>rows(5).some(r=>r.seconds===t&&r.contact==='apart'&&r.initialInside===60&&r.initialOutside===5)),ok:'처음 센서는 20 ℃입니다. 물의 온도가 일정해도 센서는 기다려야 그 온도에 가까워집니다.'},
 {kind:'찾아내기',title:'열과 온도를 구별하기',text:'관찰을 문장으로 정리하세요.',sentence:'열은 온도가 {높은|낮은} 곳에서 {낮은|높은} 곳으로 순이동합니다. 온도가 같아져도 입자는 {움직입니다|멈춥니다}.',blanks:[0,0,0]}
 ],
 quiz:[
 {kind:'진단',question:'찬물의 입자는 멈춰 있나요?',options:['온도가 낮으니 멈춥니다.','찬물에서도 계속 움직입니다.','큰 입자만 움직입니다.'],answer:1,feedback:['차갑다고 입자 움직임이 없어지지 않습니다.','찬물에서도 입자는 끊임없이 움직입니다.','온도는 입자의 크기를 바꾸지 않습니다.']},
 {kind:'적용',question:'안쪽 물이 5 ℃, 바깥 물이 60 ℃라면 열의 순이동 방향은?',options:['안쪽에서 바깥쪽입니다.','바깥쪽에서 안쪽입니다.','온도와 관계없이 양쪽이 같습니다.'],answer:1,feedback:['안팎 위치가 아니라 온도를 비교해야 합니다.','더 뜨거운 바깥 물에서 찬 안쪽 물로 이동합니다.','온도 차이가 있으면 순이동이 생깁니다.']},
 {kind:'새 상황',question:'온도계를 뜨거운 물에 넣자마자 낮은 온도가 읽힙니다. 어떻게 할까요?',options:['잠시 기다려 물과 온도가 비슷해진 뒤 읽습니다.','물에서 냉기가 나온 것입니다.','바로 읽은 값이 언제나 정확합니다.'],answer:0,feedback:['접촉식 온도계도 물과 열평형에 가까워지는 시간이 필요합니다.','차가운 기운이 나오는 현상이 아닙니다.','온도계는 물의 온도를 바로 따라가지 못합니다.']}
 ],
 setup(l){const u=l.ui;u.group('입자 관찰');u.choice({key:'focus',label:'관찰 창',options:[['all','장치와 함께'],['particles','입자 크게']],onChange:()=>{if(!l.modelVisible){document.querySelector('[data-view="model"]').click();}l.update();}});u.toggle({key:'trails',label:'이동 자취 보기'});u.readout({label:'안쪽 / 바깥 운동 빠르기',get:s=>{const t=temperatures(s,sim.t);return (rms(t[0])/rms(t[1])).toFixed(3)+'배';}});u.note('같은 물도 입자마다 순간 빠르기가 다릅니다. 막대는 집단의 대표 빠르기를 비교합니다.');Thermal.note(l,'같은 온도가 되면 두 물의 입자 색도 같아집니다. 그래프의 두 선 색은 안쪽·바깥쪽을 구별하는 색입니다.');u.group('처음 조건');u.slider({key:'inside',label:'안쪽 물 처음 온도',min:5,max:80,step:5,unit:'℃',onChange:changed});u.slider({key:'outside',label:'바깥 물 처음 온도',min:5,max:80,step:5,unit:'℃',onChange:changed});u.choice({key:'contact',label:'컵의 위치',options:[['apart','따로 두기'],['together','컵 넣기']],onChange:changed});u.note('처음 조건을 바꾸면 관찰을 처음부터 시작합니다. 두 물은 컵 벽 때문에 섞이지 않습니다.');u.group('온도 관찰');u.readout({label:'실험 시간',get:()=>Math.floor(sim.t/60)+'분 '+Math.round(sim.t%60)+'초'});u.readout({label:'안쪽 물(모형값)',get:s=>temperatures(s,sim.t)[0].toFixed(1)+' ℃'});u.readout({label:'바깥 물(모형값)',get:s=>temperatures(s,sim.t)[1].toFixed(1)+' ℃'});u.readout({label:'상태',get:s=>s.contact==='apart'?'서로 떨어져 있습니다.':Math.abs(temperatures(s,sim.t)[0]-temperatures(s,sim.t)[1])<.3?'열평형에 가까워졌습니다.':'온도 차이가 줄어듭니다.'});
 u.learnOnly(u.group('측정·기록'));u.readout({label:'안쪽 센서 측정',get:(s,l)=>l.measure('inside',sensors(s,sim.t)[0],{amplitude:.2}).toFixed(1)+' ℃'});u.readout({label:'바깥 센서 측정',get:(s,l)=>l.measure('outside',sensors(s,sim.t)[1],{amplitude:.2}).toFixed(1)+' ℃'});
 book=u.records({id:'heat',version:1,columns:[{key:'initialInside',label:'안쪽 처음(℃)',numeric:true,digits:0},{key:'initialOutside',label:'바깥 처음(℃)',numeric:true,digits:0},{key:'contact',label:'접촉',format:v=>v==='apart'?'따로 둠':'컵 넣음'},{key:'minutes',label:'시간(분)',numeric:true},{key:'measuredInside',label:'안쪽 센서(℃)',numeric:true,digits:1},{key:'measuredOutside',label:'바깥 센서(℃)',numeric:true,digits:1}],conditions:['initialInside','initialOutside','contact','seconds'],measure:'measuredInside',x:'minutes',y:'measuredInside',validate:r=>{const s={inside:r.initialInside,outside:r.initialOutside,contact:r.contact},rs=sensors(s,r.seconds);return r.seconds>=0&&r.seconds<=600&&r.minutes===r.seconds/60&&Math.abs(r.measuredInside-rs[0])<=.250001&&Math.abs(r.measuredOutside-rs[1])<=.250001;}});
 msg=u.note('1분마다 멈추면 센서를 읽고 기록한 뒤 다시 재생하세요. 입자 창과 그래프는 모형값이며 센서값과 다를 수 있습니다.');u.button({label:'두 온도 측정·기록',onClick:l=>{if(l.mi===2&&l.prediction==null){msg.textContent='먼저 예상을 고르세요.';return;}if(sim.t>0&&(sim.owner!==l.mi||sim.mode!=='learn')){msg.textContent='이 미션에서 처음부터 다시 관찰하세요.';return;}const s=l.state,ts=temperatures(s,sim.t),rs=sensors(s,sim.t);book.add({initialInside:s.inside,initialOutside:s.outside,contact:s.contact,seconds:sim.t,minutes:sim.t/60,measuredInside:+l.measure('inside',rs[0],{amplitude:.2,fresh:true}).toFixed(1),measuredOutside:+l.measure('outside',rs[1],{amplitude:.2,fresh:true}).toFixed(1),trueInside:ts[0],trueOutside:ts[1],visible:l.modelVisible,pred:l.mi===2&&l.prediction!=null});}});u.graphData({columns:[{key:'time',label:'시간(분)',numeric:true},{key:'inside',label:'안쪽 물 모형(℃)',numeric:true},{key:'outside',label:'바깥 물 모형(℃)',numeric:true}],getRows:()=>sim.path});initParticles();rewind(l);
 },step:advance,onPlay(l){if(sim.t>=600)rewind(l);if(sim.t===0){sim.owner=l.mi;sim.mode=l.mode;}},rewind,reset:rewind,onModeChange(){sim.owner=null;},onMissionSelect(){sim.owner=null;explored.clear();},onMissionsReset(){explored.clear();},
 draw:drawEquilibrium
});
</script></body></html>
