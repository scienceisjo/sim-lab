<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>녹인 뒤 식히면 무엇이 남을까? · CLICK SCIENCE</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../_kit/kit.css"><style>.rd{gap:12px;align-items:start}.rd>span{flex:0 0 28%}.rd b{overflow-wrap:anywhere;max-width:68%}.lab-panel a.abtn{display:block;text-decoration:none;text-align:center}.record-axes[hidden]{display:none}</style></head><body><script src="../_kit/kit.js"></script><script src="../_kit/thermal.js"></script><script src="../_kit/explorer.js"></script><script>
'use strict';
Explorer.start({temperatureColor:true,"id":"solubility-lab","title":"녹인 뒤 식히면 무엇이 남을까?","unit":"물질의 특성","subject":"chem","codes":["9과08-01","9과08-03"],"core":"일정한 온도의 일정량 물에 녹을 수 있는 양에는 한계가 있으며, 냉각으로 용질을 분리할 수 있다.","controls":[{"key":"temperature","label":"물의 온도","options":[[20,"20 ℃"],[40,"40 ℃"],[60,"60 ℃"]],"value":20},{"key":"water","label":"물의 질량","min":50,"max":150,"step":50,"unit":"g","value":100},{"key":"solute","label":"넣은 질산 칼륨","min":10,"max":120,"step":10,"unit":"g","value":60}],"outputs":[{"key":"dissolved","label":"녹아 있는 양","unit":"g","digits":1,"noise":0.05},{"key":"solid","label":"남은 고체","unit":"g","digits":1,"noise":0}],"repeat":true,"evaluate":s=>{const capacity={20:31.6,40:63.9,60:110}[s.temperature]*s.water/100;return{dissolved:Math.min(s.solute,capacity),solid:Math.max(0,s.solute-capacity)};},"rule":"질산 칼륨 용해도 표의 근삿값 20/40/60 ℃에서 31.6/63.9/110 g per 100 g water. 충분히 기다린 평형. 녹은 양=min(투입,용해한계), 남은 고체=투입−녹은 양. 증발 없음.","limit":"질산 칼륨 한 물질의 모형입니다. 모든 물질의 용해도가 온도에 따라 같은 방식으로 변하지는 않습니다.","prompt":"물을 같은 양으로 두고 온도를 낮춰 보세요. 녹았던 물질이 사라지는지 살펴보세요.","challenge":{"title":"냉각하여 고체 얻기","text":"물 100 g, 질산 칼륨 60 g을 20 ℃로 놓고 세 번 기록하세요. 남는 고체를 관찰하세요.","check":s=>+s.temperature===20&&s.water===100&&s.solute===60},"conclusion":"이 물질의 용액을 식히면 녹을 수 있는 양은 {줄어듭니다|늘어납니다}. 남은 고체까지 합친 용질의 양은 {같습니다|줄어듭니다}.","quiz":[{"kind":"적용","question":"더 저으면 용해도보다 많이 계속 녹나요?","options":["한계 없이 녹습니다.","충분히 기다린 뒤의 용해 한계는 바뀌지 않습니다.","고체가 물로 바뀝니다."],"answer":1,"feedback":["젓기는 녹는 빠르기에 영향을 줍니다.","온도와 물의 양이 같을 때 비교합니다.","용질의 종류는 유지됩니다."]},{"kind":"적용","question":"용해도는 무엇을 기준으로 비교하나요?","options":["용액 100 g입니다.","용기 크기입니다.","일정 온도의 용매 100 g입니다."],"answer":2,"feedback":["용액과 용매를 구별하세요.","용기 크기 자체가 기준이 아닙니다.","용매 질량을 같게 두고 비교합니다."]}],"caption":(s,v)=>'녹은 양과 남은 고체의 합은 '+s.solute+' g입니다.',"describe":(s,v)=>`${s.temperature} ℃에서 ${v.dissolved.toFixed(1)} g이 녹고 ${v.solid.toFixed(1)} g이 남습니다.`,"draw":function draw(p,s,v,m){p.box(170,135,360,300,'#f4f9ff','#7891a5');p.box(180,435-s.water*1.5,340,s.water*1.5,m?Thermal.tint(s.temperature):'#b9def5');if(v.solid>0)p.box(187,423-Math.min(v.solid*1.2,90),326,Math.min(v.solid*1.2,90),'#e7dfab');p.text(710,180,s.temperature+' ℃',36);p.text(710,250,'물 '+s.water+' g');p.text(710,305,'용질 '+s.solute+' g');if(m){for(let i=0;i<Math.round(v.dissolved/3);i++)p.circle(205+(i*71)%270,420-20-((i*43)%(s.water*1.5-30)),5,Thermal.color(s.temperature));p.text(710,390,'점은 확대 표시입니다.');}},"state":{"temperature":20,"water":100,"solute":60},"measure":"dissolved","answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["질산 칼륨 한 물질의 모형입니다. 모든 물질의 용해도가 온도에 따라 같은 방식으로 변하지는 않습니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
</script></body></html>
