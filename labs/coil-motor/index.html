<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>전류를 뒤집으면 힘도 바뀔까? · CLICK SCIENCE</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../_kit/kit.css"><style>.rd{gap:12px;align-items:start}.rd>span{flex:0 0 28%}.rd b{overflow-wrap:anywhere;max-width:68%}.lab-panel a.abtn{display:block;text-decoration:none;text-align:center}.record-axes[hidden]{display:none}</style></head><body><script src="../_kit/kit.js"></script><script src="../_kit/explorer.js"></script><script>
'use strict';
Explorer.start({"id":"coil-motor","title":"전류를 뒤집으면 힘도 바뀔까?","unit":"전기와 자기","subject":"phys","codes":["9과14-04"],"core":"자기장 속 코일의 두 변에는 반대 방향의 힘이 작용하며 전류 방향을 바꾸면 힘 방향이 바뀐다.","controls":[{"key":"current","label":"전류 방향","options":[[1,"정방향"],[-1,"역방향"],[0,"전류 없음"]],"value":1},{"key":"field","label":"자석의 방향","options":[[1,"왼쪽 N · 오른쪽 S"],[-1,"왼쪽 S · 오른쪽 N"]],"value":1},{"key":"strength","label":"전류 세기","min":1,"max":3,"step":1,"unit":"상대값","value":1}],"outputs":[{"key":"force","label":"왼쪽 변 힘의 부호 있는 상대값","unit":"","digits":0,"noise":0},{"key":"direction","label":"왼쪽 변의 힘","numeric":false}],"measure":"force","evaluate":s=>({force:s.current*s.field*s.strength,direction:s.current===0?'힘이 없습니다.':s.current*s.field>0?'화면 밖으로 작용합니다.':'화면 안으로 작용합니다.'}),"rule":"자기장은 가로 방향. 왼쪽 코일 변 전류가 아래로 흐르는 때를 +로 정의. F=IL×B, 왼쪽 변 z성분=+IBL. 오른쪽 변은 반대. I=1,2,3 상대값에 비례. 고정한 코일의 힘이며 정류자 운동은 이 화면에 넣지 않는다.","limit":"코일을 정면에서 본 고정 순간입니다. 점은 화면 밖, ×는 화면 안 방향만 표시합니다. 기호 크기는 힘의 크기가 아닙니다. 회전 중 정류자의 전환 과정은 생략합니다.","prompt":"자석과 전류를 하나씩 뒤집어 힘 방향을 비교하세요. 두 변의 힘도 함께 보세요.","challenge":{"title":"전류가 없을 때","text":"전류 없음으로 바꾸고 힘을 기록하세요.","check":s=>s.current===0},"conclusion":"전류 방향을 뒤집으면 힘 방향은 {뒤집힙니다|같습니다}. 코일의 마주 보는 두 변에는 {반대 방향의 힘|같은 방향의 힘}이 작용합니다.","quiz":[{"kind":"적용","question":"자석 방향과 전류 방향을 모두 뒤집으면 힘 방향은?","options":["원래와 같습니다.","반드시 사라집니다.","항상 한 번 더 뒤집힙니다."],"answer":0,"feedback":["두 번의 방향 반전입니다.","전류와 자기장이 남아 있습니다.","각 반전의 효과를 따져 보세요."]},{"kind":"적용","question":"전동기의 에너지 전환은?","options":["운동 에너지가 없어집니다.","전기 에너지가 운동 등으로 전환됩니다.","전하가 질량으로 모두 바뀝니다."],"answer":1,"feedback":["운동을 만들어 냅니다.","열 손실도 실제에는 있습니다.","이 현상의 설명이 아닙니다."]}],"caption":(s,v)=>'왼쪽 변: '+v.direction,"describe":(s,v)=>`왼쪽 힘 ${v.force}, 오른쪽 힘 ${-v.force}의 상대값입니다.`,"draw":function draw(p,s,v,m){p.box(70,180,120,210,s.field===1?'#e29b99':'#9bbbe2');p.box(770,180,120,210,s.field===1?'#9bbbe2':'#e29b99');p.text(130,280,s.field===1?'N':'S',45);p.text(830,280,s.field===1?'S':'N',45);p.path([[360,155],[600,155],[600,400],[360,400],[360,155]],'#af7b39',8);if(m){p.arrow(s.field===1?220:735,105,s.field===1?735:220,105,'#2c6e5f');p.text(475,76,'자기장');if(v.force!==0){p.text(320,280,v.force>0?'⊙':'⊗',40,'#b44974');p.text(645,280,v.force>0?'⊗':'⊙',40,'#b44974');p.arrow(360,s.current>0?200:355,360,s.current>0?355:200,'#a05c2c',4);}p.text(480,449,'⊙ 밖으로 · ⊗ 안으로',24);}},"state":{"current":1,"field":1,"strength":1},"answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["코일을 정면에서 본 고정 순간입니다. 점은 화면 밖, ×는 화면 안 방향만 표시합니다. 기호 크기는 힘의 크기가 아닙니다. 회전 중 정류자의 전환 과정은 생략합니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
</script></body></html>
