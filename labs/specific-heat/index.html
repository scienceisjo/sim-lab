const MAT={iron:{name:'철',ratio:.107,rho:7.87,solid:true,color:'#94a3b8'},sand:{name:'건조 모래',ratio:.191,rho:1.6,solid:true,color:'#d5b988'},al:{name:'알루미늄',ratio:.214,rho:2.7,solid:true,color:'#cbd5e1'},oil:{name:'식용유(콩기름)',ratio:.47,rho:.92,color:'#f6d76d'},ethanol:{name:'에탄올',ratio:.568,rho:.789,color:'#ede9fe'},water:{name:'물',ratio:1,rho:1,color:'#b8e0fa'}};
const P=20,H=.15,DT=.1,RATE=30,capacity=(key,amount)=>MAT[key].ratio*4187*amount/1000;
function temperature(key,amount,method,t){const C=capacity(key,amount),decay=Math.exp(-H*t/C);return method==='heat'?20+P/H*(1-decay):20+40*decay;}
function crossing(key,amount,target){return -capacity(key,amount)/H*Math.log(1-H*(target-20)/P);}
function duration(s){return s.method==='cool'?600:Math.min(300,...[s.left,s.right].map(k=>crossing(k,s.amount,k==='ethanol'?70:80)));}

function configure(l,s){Object.assign(l.state,s);l.rewind();}
function advance(dt,l){sim.acc+=dt*RATE;const limit=duration(l.state),next=(Math.floor((sim.t+1e-6)/60)+1)*60;while(sim.acc>=DT&&!sim.ended){sim.acc-=DT;sim.t=Math.min(limit,sim.t+DT);if(Math.abs(sim.t-Math.round(sim.t/60)*60)<1e-7)sim.t=Math.round(sim.t/60)*60;const end=sim.t>=limit-1e-8;if(sim.t-sim.path.at(-1).time*60>=5-1e-8||end)sim.path.push({time:sim.t/60,left:temperature(l.state.left,l.state.amount,l.state.method,sim.t),right:temperature(l.state.right,l.state.amount,l.state.method,sim.t)});if(end){sim.ended=true;l.setRunning(false);l.update();}else if(l.mode==='learn'&&sim.t>=next){sim.acc=0;l.setRunning(false);l.update();break;}}}
