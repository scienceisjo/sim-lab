<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>다시 짝지어도 원자는 남을까? · CLICK SCIENCE</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../_kit/kit.css"><style>.rd{gap:12px;align-items:start}.rd>span{flex:0 0 28%}.rd b{overflow-wrap:anywhere;max-width:68%}.lab-panel a.abtn{display:block;text-decoration:none;text-align:center}.record-axes[hidden]{display:none}</style></head><body><script src="../_kit/kit.js"></script><script src="../_kit/explorer.js"></script><script>
'use strict';
Explorer.start({"id":"reaction-builder","title":"다시 짝지어도 원자는 남을까?","unit":"화학 반응의 규칙성","subject":"chem","codes":["9과11-01","9과11-04","9과16-01","9과16-02","9과16-03","9과16-04","9과16-05"],"core":"화학 반응은 원자가 다시 결합하는 과정이며 원자 종류와 수가 보존된다.","controls":[{"key":"hydrogen","label":"수소 분자 수","min":0,"max":8,"step":1,"unit":"개","value":4},{"key":"oxygen","label":"산소 분자 수","min":0,"max":4,"step":1,"unit":"개","value":2},{"key":"stage","label":"반응 장면","options":[[0,"반응 전"],[1,"반응 후"]],"value":0}],"outputs":[{"key":"water","label":"생긴 물 분자","unit":"개","digits":0,"noise":0},{"key":"leftH","label":"남은 수소 분자","unit":"개","digits":0,"noise":0},{"key":"leftO","label":"남은 산소 분자","unit":"개","digits":0,"noise":0},{"key":"mass","label":"전체 상대 질량","unit":"","digits":0,"noise":0}],"measure":"water","evaluate":s=>{const n=s.stage?Math.min(Math.floor(s.hydrogen/2),s.oxygen):0;return{water:2*n,leftH:s.hydrogen-2*n,leftO:s.oxygen-n,mass:2*s.hydrogen+32*s.oxygen};},"rule":"2H₂+O₂→2H₂O. 한 반응 묶음당 수소 2, 산소 1분자를 소비하고 물 2분자를 만든다. 상대 원자 질량 H=1,O=16의 셈 모형. 수소:산소 질량비 1:8. 같은 온도·압력의 기체 물(수증기)에만 부피비 2:1:2를 적용한다.","limit":"밀폐된 계의 반응 전후를 비교합니다. 반응 속도·점화·액체 물의 부피는 계산하지 않습니다. 원자 크기와 분자 간격은 확대 표현입니다.","prompt":"반응 뒤 남는 분자도 세어 보세요. 물 분자만 세면 전체 질량을 놓칩니다.","challenge":{"title":"남는 물질까지 세기","text":"수소 6개, 산소 2개로 반응 후를 기록하세요. 남는 수소도 확인하세요.","check":s=>s.hydrogen===6&&s.oxygen===2&&s.stage===1},"conclusion":"반응 전후 원자의 종류와 수는 {같습니다|달라집니다}. 남은 반응물도 포함한 전체 질량은 {같습니다|줄어듭니다}.","quiz":[{"kind":"적용","question":"수소만 더 넣으면 산소가 없어도 물이 계속 생기나요?","options":["계속 생깁니다.","필요한 산소가 없으면 더 생기지 않습니다.","수소 원자가 산소로 바뀝니다."],"answer":1,"feedback":["두 반응물이 모두 필요합니다.","반응하고 남는 물질을 구별합니다.","화학 반응에서 원소는 바뀌지 않습니다."]},{"kind":"적용","question":"기체 부피비 2:1:2를 적용할 조건은?","options":["같은 온도·압력에서 모두 기체일 때입니다.","물은 언제나 액체여도 됩니다.","용기 크기만 같으면 됩니다."],"answer":0,"feedback":["수증기 상태의 물을 비교합니다.","액체 부피에는 같은 비를 적용하지 않습니다.","온도와 압력 조건이 필요합니다."]}],"caption":(s,v)=>'전체 상대 질량 '+v.mass+'은 반응 전후 같습니다.',"describe":(s,v)=>`물 ${v.water}개, 남은 수소 ${v.leftH}개, 산소 ${v.leftO}개입니다.`,"draw":function draw(p,s,v,m){const molecule=(x,y,type)=>{if(type==='water'){p.circle(x,y,18,'#df625c');p.circle(x-22,y+17,11,'#e6edf5','#52728c');p.circle(x+22,y+17,11,'#e6edf5','#52728c');}else{p.circle(x-12,y,type==='H'?11:18,type==='H'?'#e6edf5':'#df625c','#52728c');p.circle(x+12,y,type==='H'?11:18,type==='H'?'#e6edf5':'#df625c','#52728c');}};[['H',v.leftH,130],['O',v.leftO,410],['water',v.water,700]].forEach(([a,n,x])=>{p.box(x-60,115,230,320,'#fff','#dae3eb');for(let i=0;i<n;i++)molecule(x+(i%2)*95,165+Math.floor(i/2)*65,a);p.text(x+50,459,{H:'수소',O:'산소',water:'물'}[a]+' '+n+'개');});if(m)p.text(480,77,'수소 원자는 밝게, 산소 원자는 붉게 표시합니다.',20);},"state":{"hydrogen":4,"oxygen":2,"stage":0},"answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["밀폐된 계의 반응 전후를 비교합니다. 반응 속도·점화·액체 물의 부피는 계산하지 않습니다. 원자 크기와 분자 간격은 확대 표현입니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
</script></body></html>
