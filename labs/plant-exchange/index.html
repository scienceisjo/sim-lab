<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>식물은 밤에도 호흡할까? · CLICK SCIENCE</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../_kit/kit.css"><style>.rd{gap:12px;align-items:start}.rd>span{flex:0 0 28%}.rd b{overflow-wrap:anywhere;max-width:68%}.lab-panel a.abtn{display:block;text-decoration:none;text-align:center}.record-axes[hidden]{display:none}</style></head><body><script src="../_kit/kit.js"></script><script src="../_kit/explorer.js"></script><script>
'use strict';
Explorer.start({"id":"plant-exchange","title":"식물은 밤에도 호흡할까?","unit":"식물과 에너지","subject":"life","codes":["9과12-01","9과12-02","9과12-03"],"core":"광합성과 호흡은 함께 일어나며 바깥에서 측정한 기체 교환은 두 과정의 차이다.","controls":[{"key":"photosynthesis","label":"광합성으로 소비한 CO₂","min":0,"max":6,"step":1,"unit":"상대량","value":4},{"key":"respiration","label":"호흡으로 내놓은 CO₂","min":1,"max":3,"step":1,"unit":"상대량","value":2}],"outputs":[{"key":"netCO2","label":"바깥으로 나간 CO₂","unit":"상대량","digits":0,"noise":0},{"key":"netO2","label":"바깥으로 나간 O₂","unit":"상대량","digits":0,"noise":0},{"key":"balance","label":"기체 교환의 해석","numeric":false}],"measure":"netCO2","evaluate":s=>({netCO2:s.respiration-s.photosynthesis,netO2:s.photosynthesis-s.respiration,balance:s.photosynthesis>s.respiration?'광합성량이 더 큽니다.':s.photosynthesis===s.respiration?'두 과정의 기체 교환이 상쇄됩니다.':'호흡량이 더 큽니다.'}),"rule":"산소성 호흡과 탄수화물 생성의 순 기체 교환을 같은 몰 상대단위로 장부처럼 합산. 값은 환경으로 예측한 실제 속도가 아니라 학생이 가정한 두 과정의 양이다. 어둠에서 광합성=0, 호흡은 계속. 광합성 산물은 저장·성장·호흡에 사용.","limit":"손잡이는 실제 빛 세기나 온도가 아니라 두 과정의 가정한 양입니다. 광합성 속도를 환경에서 예측하는 식은 아닙니다.","prompt":"광합성량을 0으로 놓아 밤을 비교하세요. 기체 교환이 0이어도 두 과정이 멈춘 것인지 따져 보세요.","challenge":{"title":"기체 교환이 0인 식물","text":"광합성량과 호흡량을 모두 2로 맞추고 기록하세요.","check":s=>s.photosynthesis===2&&s.respiration===2},"conclusion":"기체 교환이 0이어도 광합성과 호흡은 {함께 일어날 수 있습니다|모두 멈췄습니다}. 밤에도 식물은 {호흡합니다|호흡하지 않습니다}.","quiz":[{"kind":"적용","question":"밤에 식물의 광합성이 멈추면 호흡은?","options":["계속 일어날 수 있습니다.","반드시 멈춥니다.","광합성으로 바뀝니다."],"answer":0,"feedback":["살아 있는 세포는 에너지를 얻습니다.","광합성과 다른 과정입니다.","두 과정을 구별하세요."]},{"kind":"적용","question":"빛과 광합성 관계를 조사할 공정한 실험은?","options":["빛·온도·CO₂를 모두 바꿉니다.","빛만 바꾸고 온도와 CO₂ 등을 같게 둡니다.","식물 종류도 매번 바꿉니다."],"answer":1,"feedback":["원인을 구별할 수 없습니다.","한 가지 변인을 조사합니다.","다른 원인이 섞입니다."]}],"caption":(s,v)=>v.balance,"describe":(s,v)=>`CO₂ ${v.netCO2}, O₂ ${v.netO2} 상대량이 밖으로 나갑니다. 음수는 안으로 들어온다는 뜻입니다.`,"draw":function draw(p,s,v,m){p.line(460,435,460,190,'#3e8d61',13);p.ellipse(402,265,85,40,'#75ae71');p.ellipse(525,330,85,40,'#75ae71');p.box(390,425,140,40,'#a8825c');if(m){p.text(220,130,'광합성');if(s.photosynthesis>0)p.arrow(160,215,355,215,'#3276b6',s.photosynthesis*2);p.text(210,264,'CO₂ '+s.photosynthesis);p.text(760,130,'호흡');p.arrow(570,215,815,215,'#d38648',s.respiration*2);p.text(755,264,'CO₂ '+s.respiration);p.text(480,80,'화살표 두께는 가정한 양에 비례합니다.',20);p.text(735,387,'산물은 저장과 생명 활동에 쓰입니다.',17);}},"state":{"photosynthesis":4,"respiration":2},"answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["손잡이는 실제 빛 세기나 온도가 아니라 두 과정의 가정한 양입니다. 광합성 속도를 환경에서 예측하는 식은 아닙니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
</script></body></html>
