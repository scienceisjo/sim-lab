<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>같은 물체가 다른 색으로 보일까? · CLICK SCIENCE</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../_kit/kit.css"><style>.rd{gap:12px;align-items:start}.rd>span{flex:0 0 28%}.rd b{overflow-wrap:anywhere;max-width:68%}.lab-panel a.abtn{display:block;text-decoration:none;text-align:center}.record-axes[hidden]{display:none}</style></head><body><script src="../_kit/kit.js"></script><script src="../_kit/explorer.js"></script><script>
'use strict';
Explorer.start({"id":"light-colors","title":"같은 물체가 다른 색으로 보일까?","unit":"빛과 파동","subject":"phys","codes":["9과10-03"],"core":"빛의 합성과 물체가 반사하는 빛을 구별한다.","observation":true,"controls":[{"key":"light","label":"비추는 빛","options":[["white","백색광"],["red","빨강"],["green","초록"],["blue","파랑"],["yellow","빨강+초록"]],"value":"white"},{"key":"object","label":"물체의 반사 특성","options":[["white","흰 물체"],["red","빨간 물체"],["green","초록 물체"],["blue","파란 물체"],["yellow","노란 물체"]],"value":"white"}],"outputs":[{"key":"seen","label":"눈에 들어오는 빛","numeric":false}],"evaluate":s=>{const channels={white:[1,1,1],red:[1,0,0],green:[0,1,0],blue:[0,0,1],yellow:[1,1,0]},a=channels[s.light].map((v,i)=>v*channels[s.object][i]);return{seen:({'111':'흰색','100':'빨강','010':'초록','001':'파랑','110':'노랑','000':'빛이 거의 없어 어둡습니다.'})[a.join('')]};},"rule":"세 RGB 성분을 0/1로 갖는 이상 필터·반사체 모형. 반사 성분=입사 성분×반사율. 실제 색 지각과 연속 스펙트럼·조명 세기는 생략한다.","limit":"실제 물체의 반사율은 파장별로 연속적입니다. 이 모형은 세 성분을 완전히 반사하거나 흡수하는 이상적 경우입니다.","prompt":"물체는 그대로 두고 조명만 바꾸세요. 없던 빛을 물체가 만들어 낼까요?","challenge":{"title":"빨간 물체를 초록빛으로 보기","text":"초록빛과 빨간 물체를 선택해 결과를 기록하세요.","check":s=>s.light==='green'&&s.object==='red'},"conclusion":"빨간 물체는 주로 빨간 빛을 {반사합니다|만들어 냅니다}. 빨강과 초록 빛을 합치면 {노랑|검정}으로 보입니다.","quiz":[{"kind":"적용","question":"파란빛만 비춘 이상적인 빨간 물체는?","options":["빨간빛을 새로 냅니다.","어둡게 보입니다.","항상 흰색입니다."],"answer":1,"feedback":["반사할 빨간 성분이 없습니다.","입사한 빛과 반사 특성을 함께 봅니다.","흰색 성분이 생기는 것이 아닙니다."]},{"kind":"적용","question":"화면의 RGB 빛을 모두 합치면?","options":["검은 물감처럼 됩니다.","빨강만 남습니다.","흰색에 가까워집니다."],"answer":2,"feedback":["빛의 합성과 물감 혼합은 다릅니다.","세 성분이 함께 눈에 들어옵니다.","빛의 합성을 이용합니다."]}],"caption":(s,v)=>'관찰한 색: '+v.seen,"describe":(s,v)=>'이 조명 아래에서 '+v.seen,"draw":function draw(p,s,v,m){const rgb={white:'#ffffff',red:'#ef4444',green:'#22c55e',blue:'#3b82f6',yellow:'#fde047'},seen={'흰색':'#fff','빨강':'#ef4444','초록':'#22c55e','파랑':'#3b82f6','노랑':'#fde047'};p.box(50,90,860,360,'#172c40');p.circle(160,260,45,rgb[s.light]);p.box(410,185,125,150,seen[v.seen]||'#111827','#83919c');p.ellipse(800,260,40,25,'#fff');p.circle(800,260,13,'#243a54');if(m){p.arrow(215,250,400,250,rgb[s.light],8);if(seen[v.seen])p.arrow(550,250,745,250,seen[v.seen],8);p.text(480,405,'없는 성분은 반사할 수 없습니다.',22,'#e1eaf4');}},"state":{"light":"white","object":"white"},"measure":"seen","answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["실제 물체의 반사율은 파장별로 연속적입니다. 이 모형은 세 성분을 완전히 반사하거나 흡수하는 이상적 경우입니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
</script></body></html>
