<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>그래프 모양이 곧 이동 경로일까? · CLICK SCIENCE</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../_kit/kit.css"><style>.rd{gap:12px;align-items:start}.rd>span{flex:0 0 28%}.rd b{overflow-wrap:anywhere;max-width:68%}.lab-panel a.abtn{display:block;text-decoration:none;text-align:center}.record-axes[hidden]{display:none}</style></head><body><script src="../_kit/kit.js"></script><script src="../_kit/explorer.js"></script><script>
'use strict';
Explorer.start({"id":"motion-graphs","title":"그래프 모양이 곧 이동 경로일까?","unit":"운동과 에너지","subject":"phys","codes":["9과19-01"],"core":"시간–거리 그래프의 기울기와 시간–속력 그래프를 실제 직선 운동에 연결한다.","controls":[{"key":"time","label":"지난 시간","min":0,"max":5,"step":0.5,"unit":"s","value":2},{"key":"motion","label":"운동 방식","options":[["uniform","일정한 속력"],["speedup","속력이 일정하게 증가"],["slowdown","속력이 일정하게 감소"]],"value":"uniform"}],"outputs":[{"key":"distance","label":"이동 거리","unit":"m","digits":2,"noise":0.01},{"key":"speed","label":"속력","unit":"m/s","digits":2,"noise":0}],"measure":"distance","repeat":true,"evaluate":s=>({distance:s.motion==='uniform'?2*s.time:s.motion==='speedup'?s.time*s.time:10*s.time-s.time*s.time,speed:s.motion==='uniform'?2:s.motion==='speedup'?2*s.time:10-2*s.time}),"rule":"직선 한 방향0~5초. 등속2m/s, 가속0에서2m/s², 감속10m/s에서−2m/s². 거리는 속력–시간그래프 면적. 음의속력·방향반전은 포함하지 않음. v와x분석식정확.","limit":"물체는 수평 직선 위로만 움직입니다. 그래프의 곡선은 물체가 오르막을 달린다는 뜻이 아닙니다.","prompt":"시간을 같은 간격으로 늘리며 물체 위치와 그래프를 함께 비교하세요.","challenge":{"title":"멈출 때까지의 거리","text":"일정하게 감소하는 운동에서 5초를 선택하고 세 번 기록하세요.","check":s=>s.motion==='slowdown'&&s.time===5},"conclusion":"같은 시간에 더 멀리 가면 속력은 {큽니다|작습니다}. 거리 그래프가 휘어도 실제 경로가 {곡선이라는 뜻은 아닙니다|반드시 곡선입니다}.","quiz":[{"kind":"적용","question":"등속 운동의 시간–거리 그래프는?","options":["기울기가 일정한 직선입니다.","항상 가로선입니다.","반드시 원입니다."],"answer":0,"feedback":["같은 시간에 같은 거리를 갑니다.","가로선은 거리가 변하지 않는 상태입니다.","경로 모양을 그린 것이 아닙니다."]},{"kind":"적용","question":"시간–속력 그래프가 아래로 기울지만 속력이 양수라면?","options":["뒤로 움직인다는 뜻입니다.","앞으로 가면서 느려지는 운동입니다.","거리가 반드시 줄어듭니다."],"answer":1,"feedback":["속력의 감소와 방향을 구별합니다.","같은 방향의 이동 거리는 늘어납니다.","이동 거리는 감소하지 않습니다."]}],"caption":(s,v)=>'수평 직선 위에서 '+v.distance.toFixed(1)+' m 이동했습니다.',"describe":(s,v)=>`${s.time}초, 거리 ${v.distance.toFixed(2)} m, 속력 ${v.speed.toFixed(2)} m/s입니다.`,"draw":function draw(p,s,v,m){p.line(110,115,850,115);p.circle(110+v.distance/25*740,115,17,'#4483bb');p.text(480,80,'실제 이동 경로는 직선입니다.',24);if(m){const pts=Array.from({length:51},(_,i)=>{const t=i/10;return[t,s.motion==='uniform'?2:s.motion==='speedup'?2*t:10-2*t];});p.graph(pts,{x:160,y:240,w:650,h:150,xmax:5,ymax:10,xlabel:'시간(s)',ylabel:'속력(m/s)'});p.circle(160+s.time/5*650,390-v.speed/10*150,6,'#d69a37');}},"state":{"time":2,"motion":"uniform"},"answers":[0,0],"creative":"같은 축척의 비교판으로 한 가지 조건만 바꾼 결과를 견줍니다.","assumptions":["물체는 수평 직선 위로만 움직입니다. 그래프의 곡선은 물체가 오르막을 달린다는 뜻이 아닙니다.","그림의 색과 크기는 관계를 설명하기 위한 표현입니다.","모형은 선택한 조건만 다루므로 실제 현상의 모든 요인을 나타내지는 않습니다."]});
</script></body></html>
