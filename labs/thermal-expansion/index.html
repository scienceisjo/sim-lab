'use strict';
const DT=.1,RATE=60,A0=Math.PI*.2**2,V0=50+A0*10,GLASS=3.2e-6;
const MAT={water:{name:'물',rho:.99821,c:4.187,color:'#4e9de0'},ethanol:{name:'에탄올',rho:.789,c:4.187*.568,color:'#df627d'},al:{name:'알루미늄',alpha:23e-6,color:'#94a3b8'},cu:{name:'구리',alpha:17e-6,color:'#c88a69'},iron:{name:'철',alpha:11e-6,color:'#64748b'}};
const DENSITY=[[10,.99970],[20,.99821],[30,.99565],[40,.99222],[50,.98804],[60,.98320]];
function density(t){for(let i=1;i<DENSITY.length;i++)if(t<=DENSITY[i][0]){const [x,a]=DENSITY[i-1],[y,b]=DENSITY[i];return a+(b-a)*(t-x)/(y-x);}return DENSITY.at(-1)[1];}
const liquid=k=>!MAT[k].alpha,keys=s=>s.device==='liquid'?['water','ethanol']:['al','cu','iron'];
const temp=(s,k,t)=>liquid(k)?s.target+(20-s.target)*Math.exp(-2*t/(V0*MAT[k].rho*MAT[k].c)):s.target;
const volumeRatio=(k,t)=>k==='water'?.99821/density(t):Math.exp(.0011*(t-20));
function height(k,t){const glass=1+GLASS*(t-20);return (V0*volumeRatio(k,t)-50*glass**3)/(A0*glass**2);}
const angle=(k,t)=>MAT[k].alpha*.3*(t-20)/.001*180/Math.PI;
const value=(k,t)=>liquid(k)?height(k,t)-10:angle(k,t);
const sim={t:0,acc:0,owner:null,mode:null,path:[]};const books={};let msg,objectGroup,lastFrame=0,particles=[];const rows=i=>Object.values(books).flatMap(b=>b.rows).filter(r=>r._mission===i);
function resetParticles(){particles=Thermal.disks(40,230,130,10,303,24);}
function moveParticles(dt,T,k){const h=130*volumeRatio(k,T),rms=Math.sqrt(particles.reduce((n,p)=>n+p.vx*p.vx+p.vy*p.vy,0)/40),factor=24*Math.sqrt((T+273.15)/293.15)/rms;
 for(const p of particles){p.vx*=factor;p.vy*=factor;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.x<10||p.x>220)p.vx*=-1;if(p.y<10||p.y>h-10)p.vy*=-1;}
 for(let i=0;i<40;i++)for(let j=i+1;j<40;j++){const a=particles[i],b=particles[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d>0&&d<20){const nx=dx/d,ny=dy/d,over=(20-d)/2,v=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;a.x-=over*nx;a.y-=over*ny;b.x+=over*nx;b.y+=over*ny;if(v<0){a.vx+=v*nx;a.vy+=v*ny;b.vx-=v*nx;b.vy-=v*ny;}}}
 for(const p of particles){p.x=Math.max(10,Math.min(220,p.x));p.y=Math.max(10,Math.min(h-10,p.y));}
}
function selectObject(k,l){l.state.selected=k;resetParticles();if(objectGroup)for(const b of objectGroup.querySelectorAll('button'))b.setAttribute('aria-pressed',String(b.dataset.object===k));l.update();}
function rewind(l){if(l.state.device==='liquid')l.state.target=Math.min(60,l.state.target);if(!keys(l.state).includes(l.state.selected))l.state.selected=keys(l.state)[0];Object.assign(sim,{t:0,acc:0,owner:null,mode:null,path:[]});resetParticles();if(objectGroup)for(const b of objectGroup.querySelectorAll('button')){b.hidden=!keys(l.state).includes(b.dataset.object);b.setAttribute('aria-pressed',String(b.dataset.object===l.state.selected));}}
function configure(l,s){Object.assign(l.state,s);l.rewind();}
function advance(dt,l){if(l.state.device==='solid'){l.setRunning(false);return;}sim.acc+=dt*RATE;while(sim.acc>=DT&&sim.t<900){sim.acc-=DT;sim.t=Math.min(900,Math.round((sim.t+DT)*10)/10);if(sim.t%60===0){sim.path.push({time:sim.t/60,water:temp(l.state,'water',sim.t),ethanol:temp(l.state,'ethanol',sim.t)});}if(sim.t===900){l.setRunning(false);l.update();}}}
Lab.init({id:'thermal-expansion',version:1,title:'액체와 고체의 열팽창',subject:'phys',unit:'비열과 열팽창',grade:'중1',updated:'2026-09-27',board:{w:960,h:600},animate:true,state:{device:'liquid',target:50,selected:'water',expand:true},
 sceneNote:'장치에서 물체를 누르면 입자 창이 바뀝니다. 아래 단추로도 고를 수 있습니다. 물감 색은 액체를 구별하는 표시입니다. 입자 창은 실제 분자의 모든 힘을 재현하지 않는 설명 모형이며, 재생을 멈춰도 입자의 움직임은 계속됩니다.',
 assumptions:['액체는 20 ℃에서 시작합니다. 수조를 바꾸면 새 실험을 시작합니다. 같은 수조에 넣어도 데워지는 빠르기가 다릅니다.','내열 유리 50 mL 플라스크와 같은 유리관을 씁니다. 처음에는 유리관에도 액체가 들어 있습니다.','유리와 그 안의 액체 온도는 같다고 단순화합니다. 유리의 팽창도 액면 계산에 포함합니다.','고체 막대는 모두 같은 온도가 된 상태를 비교합니다. 입자 간격 변화 확대는 설명 그림에만 적용합니다.','학습 측정은 높이 ±0.02 cm, 각도 ±0.2° 흔들린 뒤 반올림합니다. 실제 구조물의 변형·파괴는 계산하지 않습니다.'],
 teacher:`<h4>교과서와 계산</h4><p>비상교육 p.100–101, 103–104, 106. 액체는 50 mL 내열 유리 플라스크, 기본 수조 50 ℃. 유리관 반지름 0.2 cm, 처음 높이 10 cm, 처음 전체 액체 부피 51.256637 mL. 물 밀도는 10/20/30/40/50/60 ℃에서 0.99970/0.99821/0.99565/0.99222/0.98804/0.98320 g/mL를 선형 보간합니다. 에탄올 V/V₀=exp[0.0011(T−20)]는 이 구간의 일정 부피 팽창률 근사입니다. 내열 유리 α=3.2×10⁻⁶/K로 플라스크 부피와 관 단면을 보정합니다.</p><p>액체 C=V₀ρc, c물=4.187, c에탄올=4.187×0.568 J/(g K), 열전달 계수 2 W/K. 수조 일정 온도에 접근하는 해석해를 0.1초 간격, 화면 1초=실험 60초로 표본화합니다. 15분 뒤 양쪽이 수조 온도 0.1 ℃ 이내일 때 비교합니다. 유리 열용량과 관의 온도 구배, 액체의 증발은 제외합니다. 교과서의 '같은 열을 받으면 에탄올이 더 팽창한다'는 결론은 틀리지 않지만 이 장치가 같게 맞추는 조건은 최종 온도입니다.</p><p>고체 ΔL=αL₀ΔT, L₀=0.3 m. 알루미늄 23, 구리 17, 철(강철 표) 11×10⁻⁶/K. 반지름 1 mm 굴대 각도=ΔL/r. 막대는 준정적 균일 온도이며 기울기 수치·열응력은 학생 평가에서 제외합니다. 고체 입자 35개와 액체 원판 40개의 크기를 고정합니다. 고체 간격 변화만 ×60로 확대할 수 있고 실제 수치는 바꾸지 않습니다. 속력 크기는 √(T+273.15), 고체는 제자리 진동, 액체는 같은 질량 탄성 충돌과 온도에 맞춘 속력 조정으로 그립니다.</p><h4>생활 연결</h4><p>선로 25 m, 온도 차 40 ℃, α=1.14×10⁻⁵/K이면 1.14 cm 늘어납니다(p.103 보충). 틈이나 구부러진 곳은 팽창할 여유를 줍니다. 철근·콘크리트는 팽창 정도가 비슷해 함께 쓰며, 모든 상황에서 균열이 없다는 뜻은 아닙니다. 내열 유리는 팽창이 작지만 어떤 온도 변화에도 깨지지 않는 재료는 아닙니다.</p>`,

 {kind:'둘러보기',title:'액체와 고체 모두 살펴보기',text:'액체는 재생해 1분 이상 지난 뒤, 고체는 20 ℃와 다른 온도로 바꾼 뒤 각각 기록하세요.',check:()=>rows(0).some(r=>r.device==='liquid'&&r.seconds>=60)&&rows(0).some(r=>r.device==='solid'&&r.target!==20)},
 {kind:'해 보기',title:'같은 온도에서 액체 비교하기',text:'50 ℃ 수조에서 15분 관찰한 뒤 두 액체를 기록하세요. 수조와 액체 온도가 충분히 가까워져야 비교할 수 있습니다.',enter:l=>configure(l,{device:'liquid',target:50}),check:()=>['water','ethanol'].every(k=>rows(1).some(r=>r.material===k&&r.target===50&&Math.abs(r.temperature-50)<.1)),ok:'같은 온도 변화에서 에탄올의 높이가 더 크게 변합니다. 먼저 데워지는 빠르기와 최종 팽창 정도는 구별해야 합니다.'},
 {kind:'예상',title:'입자 자체가 커질까?',text:'먼저 예상하세요. 고체를 20 ℃와 80 ℃에 맞추고 입자 창을 켠 채 각각 기록하세요.',enter:l=>configure(l,{device:'solid',target:20}),predict:{options:['입자 자체가 커집니다.','입자 개수가 늘어납니다.','크기·개수는 같고 간격이 멀어집니다.'],answer:2},check:()=>[20,80].every(T=>rows(2).some(r=>r.device==='solid'&&r.target===T&&r.visible&&r.pred)),ok:'입자의 크기와 수를 그대로 둔 채 간격을 비교했습니다. 고체 입자는 제자리에서 진동합니다.'},
 {kind:'해 보기',title:'세 금속의 바늘 비교하기',text:'세 막대를 80 ℃와 10 ℃에 맞추고 각각 기록하세요. 가장 많이 늘어나는 금속은 식힐 때도 가장 많이 줄어드는지 보세요.',enter:l=>configure(l,{device:'solid',target:80}),check:()=>[80,10].every(T=>['al','cu','iron'].every(k=>rows(3).some(r=>r.material===k&&r.target===T))),ok:'같은 온도 변화에서 알루미늄, 구리, 철 순으로 길이 변화가 큽니다.'},
 {kind:'변인 고르기',title:'온도만 바꾸는 설계',text:'입자 창에서 한 금속을 골라 두세요. 이 미션에서는 그 금속만 기록합니다. 물질과 관찰 시간을 유지하고 온도에 따른 각도를 비교하세요.',enter:l=>configure(l,{device:'solid',target:20}),variables:{options:[['target','설정 온도'],['device','장치'],['material','물질'],['seconds','관찰 시간'],['measured','높이 변화·각도']],change:'target',keep:['device','material','seconds'],measure:'measured',recordId:'expansion-solid'}},
 {kind:'찾아내기',title:'생활 속 팽창 여유',text:'오른쪽 생활 연결 설명을 읽고 알맞게 고르세요.',sentence:'다리의 틈과 굽힌 가스관은 팽창할 {여유를 줍니다|입자를 만듭니다}. 철근과 콘크리트는 열팽창 정도가 {비슷합니다|항상 전혀 없습니다}. 내열 유리는 보통 유리보다 열팽창이 {작습니다|큽니다}.',blanks:[0,0,0]}
 ],
 quiz:[{kind:'진단',question:'가열한 액체가 팽창하는 입자 모형은?',options:['입자 크기는 같고 사이 거리가 멀어집니다.','입자 하나하나가 커집니다.','입자를 새로 만듭니다.'],answer:0,feedback:['이 실험에서는 개수와 크기를 유지하며 간격을 비교합니다.','입자 자체가 커지는 것으로 설명하지 않습니다.','열을 준다고 입자가 새로 생기지 않습니다.']},{kind:'적용',question:'같은 수조에 넣자 에탄올만 먼저 뜨거워졌습니다. 팽창 정도를 공정하게 비교하려면?',options:['바로 높이만 비교합니다.','두 액체가 같은 온도에 가까워지기를 기다립니다.','수조 온도만 같으면 액체 온도도 언제나 같습니다.'],answer:1,feedback:['물질과 온도 차의 효과가 섞입니다.','같은 처음·나중 온도 조건에서 비교합니다.','열용량과 열 전달 때문에 시간이 걸립니다.']},{kind:'새 상황',question:'금속 막대의 길이 변화가 눈에 잘 안 보입니다. 옳은 설명은?',options:['고체는 팽창하지 않습니다.','입자 크기가 조금 커진 것입니다.','변화가 작아 바늘 장치로 관찰할 수 있습니다.'],answer:2,feedback:['고체도 열팽창합니다.','입자의 크기 변화로 설명하지 않습니다.','작은 길이 변화를 굴대의 회전으로 확인합니다.']}],
